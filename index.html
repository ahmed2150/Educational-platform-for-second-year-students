اسية للتفكير العلمي."],[2,1,0,0,"ينقسم المخ البشري (Cerebrum) طولياً إلى نصفين كرويين: النصف الأيمن والنصف الأيسر.",["صح","خطأ"],0,"صحيح؛ يتكون المخ من نصفين كرويين يرتبطان معاً بواسطة حزمة من الألياف العصبية تسمى الجسم الجاسئ."],[2,1,0,0,"يتحكم النصف الأيسر من الدماغ في الجانب الأيسر من الجسم، بينما يتحكم النصف الأيمن في الجانب الأيمن.",["صح","خطأ"],1,"خطأ (معكوسة)؛ التحكم العصبي متقاطع، فالنصف الأيسر للدماغ يتحكم في الجانب الأيمن من الجسم والعكس صحيح."],[2,1,0,0,"يختص الفص القذالي (الخلفي) في الدماغ بشكل رئيسي بمعالجة المعلومات البصرية والرؤية.",["صح","خطأ"],0,"صحيح؛ الفص القذالي (Occipital Lobe) يقع في مؤخرة الدماغ وهو المركز الرئيسي للإبصار."],[2,1,0,0,"تُعد الخلية العصبية (Neuron) الوحدة البنائية والوظيفية الأساسية للجهاز العصبي.",["صح","خطأ"],0,"صحيح؛ يتكون الدماغ من مليارات الخلايا العصبية التي تنقل الإشارات الكهروكيميائية."],[2,1,0,0,"تمر عملية التذكر بثلاث مراحل أساسية متتالية هي: الترميز، ثم التخزين، ثم الاسترجاع.",["صح","خطأ"],0,"صحيح؛ لاستدعاء أي معلومة لا بد أولاً من ترميزها (إدخالها)، ثم تخزينها، ثم استرجاعها عند الحاجة."],[2,1,0,0,"تستوعب الذاكرة قصيرة المدى (العاملة) عدداً لا نهائياً من المعلومات لسنوات طويلة دون تكرار.",["صح","خطأ"],1,"خطأ؛ الذاكرة قصيرة المدى محدودة السعة والزمن (ثوانٍ معدودة)، وتحتاج إلى التكرار والربط لتنتقل للذاكرة طويلة المدى."],[2,1,0,0,"يشير 'التفكير الشمولي' (النسقي) إلى النظر للموقف ككل متكامل وفهم العلاقات بين أجزائه بدلاً من تجزئتها.",["صح","خطأ"],0,"صحيح؛ التفكير الشمولي يدرك الصورة الكلية وتأثير كل جزء في بقية أجزاء المنظومة."],[2,1,0,0,"يختص الفص الجبهي (الأمامي) في الدماغ بالوظائف التنفيذية العليا مثل التخطيط واتخاذ القرار وحل المشكلات.",["صح","خطأ"],0,"صحيح؛ الفص الجبهي هو قائد العمليات العقلية العليا كالتخطيط والتحكم في السلوك والتفكير المنطقي."],[2,1,0,1,"تُظهر نظرية 'اللدونة العصبية' (Neuroplasticity) أن الدماغ البشري يتوقف عن تكوين وصلات عصبية جديدة بعد سن البلوغ.",["صح","خطأ"],1,"خطأ؛ اللدونة العصبية تثبت أن الدماغ قادر على إعادة تنظيم نفسه وتكوين تشابكات عصبية جديدة طوال الحياة بالتعلم والتدريب."],[2,1,0,1,"عندما يقوم شخص بتصميم لوحة فنية متكاملة الألوان والتخيل المكاني، فإن النصف الأيمن من الدماغ يكون أكثر نشاطاً.",["صح","خطأ"],0,"صحيح؛ يختص النصف الأيمن غالباً بالإدراك البصري والمكاني والخيال والألوان والموسيقى والنظرة الكلية."],[2,1,0,1,"الفرق بين 'الذاكرة الحسية' و'الذاكرة قصيرة المدى' هو أن الذاكرة الحسية تحتفظ بالمثير لأجزاء من الثانية فقط قبل الانتباه إليه.",["صح","خطأ"],0,"صحيح؛ تستقبل الذاكرة الحسية المثيرات عبر الحواس لجزء من الثانية، وما ننتبه له ينتقل للذاكرة قصيرة المدى."],[2,1,0,1,"في نموذج هيرمان (HBDI) للهيمنة الدماغية، يركز الربع (A) التحليلي على المشاعر والعلاقات الإنسانية والحدس.",["صح","خطأ"],1,"خطأ؛ الربع (A) الأيسر العلوي يركز على الحقائق والمنطق والأرقام، بينما الربع (C) الأيمن السفلي هو المسؤول عن المشاعر والعلاقات."],[2,1,0,1,"يُعد 'الاستقراء' في التفكير العلمي انتقالاً من القاعدة العامة إلى الحالات الجزئية، بينما 'الاستنباط' انتقال من الجزئيات إلى القاعدة.",["صح","خطأ"],1,"خطأ (معكوسة)؛ الاستقراء يبدأ من الملاحظات الجزئية ليصل إلى قانون عام، أما الاستنباط فيبدأ من القاعدة العامة ليطبقها على الجزئيات."],[2,1,0,1,"إصابة الفص الصدغي في الدماغ قد تؤثر بشكل مباشر على حاسة السمع وفهم اللغة واسترجاع الذكريات.",["صح","خطأ"],0,"صحيح؛ يقع الفص الصدغي على جانبي الدماغ ويضم مراكز السمع واللغة وبعض وظائف الذاكرة."],[2,1,0,1,"يُعد 'التفكير الخرافي' نمطاً يربط الظواهر بأسباب غير حقيقية أو غيبية غير مثبتة علمياً كالتشاؤم من رقم معين.",["صح","خطأ"],0,"صحيح؛ التفكير الخرافي يفسر الأحداث بعلل وهمية لا تستند إلى منطق أو برهان علمي."],[2,1,0,1,"يحتاج المبدع إلى تفعيل نصفي الدماغ معاً (الأيمن لتوليد الأفكار الخيالية والأيسر لتنظيمها وتقييمها منطقياً).",["صح","خطأ"],0,"صحيح؛ الإبداع الحقيقي يتطلب التكامل بين الخيال والحدس (النصف الأيمن) والتحليل والتنفيذ المنظم (النصف الأيسر)."],[2,1,0,1,"النسيان يحدث غالباً بسبب فشل في مرحلة 'الترميز' نتيجة عدم الانتباه الكافي أثناء تلقي المعلومة.",["صح","خطأ"],0,"صحيح؛ كثير مما نعتقد أننا نسيناه لم يتم ترميزه أصلاً بعمق في الدماغ بسبب التشتت وضعف الانتباه."],[2,1,0,1,"التفكير الشمولي يركز على حل المشكلة بشكل منعزل دون النظر إلى الآثار الجانبية للحل على بقية أقسام المؤسسة.",["صح","خطأ"],1,"خطأ؛ التفكير الجزئي هو الذي يعزل المشكلة، أما التفكير الشمولي فيدرس التفاعلات والنتائج على النظام بأكمله."],[2,1,1,0,"أي من فصوص الدماغ التالية يقع في مقدمة الرأس وهو مسؤول عن التخطيط واتخاذ القرار؟",["الفص الجبهي (الأمامي)","الفص القذالي (الخلفي)","الفص الصدغي","المخيخ"],0,"الفص الجبهي (Frontal Lobe) هو مركز الوظائف التنفيذية والتخطيط وحل المشكلات والتحكم في الانفعالات."],[2,1,1,0,"الفص الدماغي المسؤول عن معالجة الإشارات البصرية هو:",["الفص القذالي","الفص الجداري","الفص الجبهي","جذع الدماغ"],0,"يقع الفص القذالي في الجزء الخلفي من الدماغ ويختص باستقبال وتفسير المعلومات البصرية."],[2,1,1,0,"الجسر العصبي الذي يربط بين نصفي الكرة المخية الأيمن والأيسر يسمى:",["الجسم الجاسئ (Corpus Callosum)","النخاع المستطيل","الغدة النخامية","الحبل الشوكي"],0,"الجسم الجاسئ هو حزمة كثيفة من الألياف العصبية تنقل المعلومات وتنسق العمل بين نصفي الدماغ."],[2,1,1,0,"الترتيب الصحيح لمراحل عمل الذاكرة البشرية هو:",["الترميز ← التخزين ← الاسترجاع","التخزين ← الاسترجاع ← الترميز","الاسترجاع ← الترميز ← التخزين","التخزين ← الترميز ← الاسترجاع"],0,"تبدأ الذاكرة بترميز المعلومة الحسية، ثم حفظها وتخزينها، وأخيراً استرجاعها عند الحاجة."],[2,1,1,0,"يختص النصف الأيسر من الدماغ غالباً بـ:",["اللغة والمنطق والتحليل والأرقام","التخيل الفني والألوان والموسيقى","الإدراك المكاني الشمولي","الحدس والعواطف المجردة"],0,"النصف الأيسر يميل للمعالجة التحليلية المتسلسلة واللغة والعمليات الرياضية."],[2,1,1,0,"نقطة الالتقاء التي تنتقل عبرها الإشارات العصبية من خلية عصبية إلى أخرى تسمى:",["التشابك العصبي (Synapse)","الجمجمة","القرنية","الوتيرة"],0,"التشابك العصبي هو الفجوة الدقيقة التي تتواصل عبرها الخلايا العصبية باستخدام النواقل العصبية."],[2,1,1,0,"أي من أنماط التفكير التالية يعتمد على الملاحظة المنظمة وفرض الفروض واختبارها بالتجربة؟",["التفكير العلمي","التفكير الخرافي","التفكير الأسطوري","التفكير التواكلي"],0,"التفكير العلمي هو المنهج المنظم القائم على الأدلة والتجريب للوصول إلى حقائق موضوعية."],[2,1,1,0,"الذاكرة التي تحتفظ بالمعلومات لفترات طويلة جداً وقد تمتد مدى الحياة هي:",["الذاكرة طويلة المدى","الذاكرة الحسية","الذاكرة العاملة الفورية","الذاكرة البصرية اللحظية"],0,"تتميز الذاكرة طويلة المدى بسعة تخزينية هائلة واستمرارية زمنية طويلة جداً."],[2,1,1,0,"يختص الفص الجداري في الدماغ بشكل أساسي بـ:",["معالجة الإحساس باللمس والضغط والحرارة والوعي المكاني","التحكم في حركات العين فقط","إفراز هرمونات النمو","تنظيم نبضات القلب أثناء النوم"],0,"الفص الجداري (Parietal Lobe) مسؤول عن استقبال وتفسير الإحساسات الجسدية كاللمس والألم والحرارة."],[2,1,1,0,"من مهارات التفكير العلمي الأساسية:",["الملاحظة والقياس والتصنيف والتنبؤ","التعصب للرأي الشخصي","تعميم النتائج دون أدلة","تجاهل البيانات المخالفة للفرضية"],0,"يقوم التفكير العلمي على مهارات دقيقة تبدأ بالملاحظة والقياس وتنتهي بالاستنتاج والتفسير."],[2,1,1,1,"عندما يلاحظ الباحث أن كل المعادن التي اختبرها تتمدد بالحرارة فيستنتج قاعدة عامة بأن 'جميع المعادن تتمدد بالحرارة'، فهذا يمثل:",["التفكير الاستقرائي (من الجزء إلى الكل)","التفكير الاستنباطي (من الكل إلى الجزء)","التفكير الخرافي","التفكير الحدسي غير المنطقي"],0,"الاستقراء ينتقل من دراسة أمثلة وحالات جزئية متكررة للوصول إلى تعميم أو قانون كلي."],[2,1,1,1,"وفقاً لمقياس هيرمان للهيمنة الدماغية (HBDI)، الشخص الذي يفضل التنظيم والترتيب والالتزام بالجداول الزمنية والإجراءات يغلب عليه:",["النمط التنفيذي المنظم (الربع B - الأيسر السفلي)","النمط الإبداعي الاستراتيجي (الربع D - الأيمن العلوي)","النمط العاطفي الاجتماعي (الربع C - الأيمن السفلي)","النمط التحليلي الكمي فقط"],0,"الربع (B) في نموذج هيرمان يمثل التخطيط التفصيلي والتنظيم والانضباط التنفيذي."],[2,1,1,1,"لماذا ينصح خبراء التعلم بربط المعلومات الجديدة بقصص أو صور ذهنية لنقلها إلى الذاكرة طويلة المدى؟",["لأن الترميز العميق القائم على المعنى والربط يقوي التشابكات العصبية","لأن الذاكرة الحسية لا تستقبل إلا الصور الملونة","لأن النصف الأيسر للدماغ لا يعمل إلا أثناء النوم","لإلغاء دور الذاكرة قصيرة المدى تماماً"],0,"التكرار الآلي السطحي ضعيف، أما الترميز الدلالي وربط المعلومة بصور ومعانٍ فيعزز تخزينها واسترجاعها."],[2,1,1,1,"في إدارة الأزمات، لماذا يتفوق القائد الذي يمتلك 'التفكير الشمولي' على القائد ذي التفكير الجزئي؟",["لأنه يدرك الترابط بين جميع إدارات المؤسسة ويتوقع انعكاس القرار على المدى البعيد","لأنه يركز على قسم واحد ويهمل بقية الأقسام","لأنه يتخذ قرارات سريعة دون جمع معلومات","لأنه يعتمد على الحلول القديمة دون تعديل"],0,"التفكير الشمولي ينظر للمؤسسة كمنظومة متكاملة، فيمنع حل مشكلة في قسم على حساب خلق أزمة في قسم آخر."],[2,1,1,1,"تعرض شخص لحادث أدى إلى صعوبة في النطق وتكوين الجمل رغم سلامة فهمه لما يسمعه؛ أي منطقة في الدماغ تأثرت غالباً؟",["منطقة بروكا في الفص الجبهي الأيسر","الفص القذالي الأيمن","المخيخ فقط","الذاكرة الحسية البصرية"],0,"تقع منطقة بروكا المسؤولة عن إنتاج الكلام في الفص الجبهي من النصف الأيسر للدماغ."],[2,1,1,1,"كيف يسهم تعلم لغة جديدة أو العزف على آلة موسيقية في تعزيز صحة الدماغ؟",["يحفز اللدونة العصبية ويزيد من كثافة التشابكات بين الخلايا العصبية","يقلل من نشاط الفص الجبهي","يوقف عمل النصف الأيمن لصالح النصف الأيسر","يمنع انتقال المعلومات للذاكرة طويلة المدى"],0,"المهارات الجديدة المركبة تنشط مناطق متعددة في الدماغ وتبني مسارات عصبية جديدة بفضل اللدونة العصبية."],[2,1,1,1,"قراءة رقم هاتف لمرة واحدة ثم نسيانه بعد 15 ثانية قبل تدوينه يوضح حدود:",["الذاكرة قصيرة المدى (العاملة)","الذاكرة طويلة المدى الإجرائية","الذكاء الحركي","التفكير الاستنباطي"],0,"الذاكرة قصيرة المدى تحتفظ بالمعلومات لنحو 15-30 ثانية فقط ما لم يتم تكرارها أو ترميزها بعمق."],[2,1,1,1,"ما السمة المشتركة بين 'التفكير الفلسفي' و'التفكير العلمي' رغم اختلاف أدواتهما؟",["كلاهما يعتمد على التأمل العقلي المنظم وطرح التساؤلات للبحث عن الحقيقة","كلاهما يعتمد على المعمل والتجارب الكيميائية فقط","كلاهما يرفض استخدام المنطق العقلي","كلاهما يفسر الظواهر بالخرافات"],0,"التفكير الفلسفي يبحث في العلل الكلية بالعقل والمنطق، والتفكير العلمي يبحث في الظواهر الجزئية بالملاحظة والتجربة، وكلاهما تفكير منظم."],[2,1,1,1,"المصمم المعماري الذي يتخيل شكل المبنى ثلاثي الأبعاد قبل رسمه يوظف بشكل مكثف:",["النصف الأيمن للدماغ (الإدراك المكاني والخيال البصري)","النصف الأيسر فقط (القواعد النحوية)","جذع الدماغ المسؤول عن التنفس","الذاكرة الحسية السمعية"],0,"التصور الفراغي والثلاثي الأبعاد وتناغم الأشكال من أبرز وظائف النصف الأيمن للدماغ."],[2,1,1,1,"في خطوات التفكير العلمي، تأتي خطوة 'صياغة الفروض' مباشرة بعد:",["الشعور بالمشكلة وتحديدها وجمع البيانات الأولية عنها","تعميم النتائج النهائية ونشرها","إثبات صحة النظرية بشكل قاطع","إهمال الملاحظة العلمية"],0,"الفرضية هي تفسير مؤقت ومحتمل للمشكلة يُصاغ بناءً على الملاحظة وجمع المعلومات ليتم اختباره لاحقاً."],[2,2,0,0,"اقترح العالم هوارد جاردنر نظرية 'الذكاءات المتعددة' مؤكداً أن الذكاء ليس قدرة واحدة بل مجموعة قدرات مستقلة نسبياً.",["صح","خطأ"],0,"صحيح؛ رفض جاردنر اختزال الذكاء في القدرات اللغوية والرياضية فقط، وقدم نظرية الذكاءات المتعددة."],[2,2,0,0,"يُحسب معامل الذكاء (IQ) في اختبارات ستانفورد-بينيه بقسمة العمر العقلي على العمر الزمني ثم الضرب في 100.",["صح","خطأ"],0,"صحيح؛ المعادلة الكلاسيكية لمعامل الذكاء هي: (العمر العقلي ÷ العمر الزمني) × 100."],[2,2,0,0,"يشير الذكاء الوجداني (العاطفي) إلى قدرة الفرد على فهم مشاعره ومشاعر الآخرين وإدارتها بفاعلية.",["صح","خطأ"],0,"صحيح؛ يشمل الذكاء الوجداني الوعي بالذات، ضبط النفس، الدافعية، التعاطف، والمهارات الاجتماعية."],[2,2,0,0,"الذكاء الاصطناعي (AI) هو فرع من علوم الحاسب يهدف إلى بناء أنظمة تحاكي القدرات الذهنية البشرية في التعلم وحل المشكلات.",["صح","خطأ"],0,"صحيح؛ يمكّن الذكاء الاصطناعي الآلات من التعلم من البيانات والتعرف على الأنماط واتخاذ القرارات."],[2,2,0,0,"يُعد 'الذكاء الطبيعي' عند جاردنر القدرة على التمييز بين الكائنات الحية والاهتمام بالبيئة والظواهر الطبيعية.",["صح","خطأ"],0,"صحيح؛ الذكاء الطبيعي (Naturalist Intelligence) يظهر بوضوح لدى علماء الأحياء والبيئة والزراعة."],[2,2,0,0,"تعتمد البيئة الإبداعية الداعمة على التسلط الإداري وفرض الرأي الواحد ومعاقبة أي محاولة للتجريب.",["صح","خطأ"],1,"خطأ؛ البيئة الإبداعية تقوم على الحرية الفكرية والأمان النفسي وتقبل الاختلاف وتشجيع التجريب."],[2,2,0,0,"تتراوح نسبة الذكاء الطبيعي (المتوسط) لدى غالبية البشر بين 90 و 109 درجات على مقياس الذكاء.",["صح","خطأ"],0,"صحيح؛ يقع معظم الأفراد في الفئة المتوسطة للذكاء (90 - 109) وفق التوزيع الطبيعي."],[2,2,0,0,"يشير 'الذكاء الشخصي الذاتي' (Intrapersonal) إلى قدرة الفرد على فهم ذاته ونقاط قوته وضعفه وأهدافه.",["صح","خطأ"],0,"صحيح؛ الذكاء الذاتي هو معرفة الإنسان لنفسه وقدرته على توجيه سلوكه وفق قيمه وطموحاته."],[2,2,0,0,"لا توجد أي علاقة بين توفر الأمان النفسي داخل الأسرة أو المدرسة وبين نمو الإبداع لدى الأبناء.",["صح","خطأ"],1,"خطأ؛ الأمان النفسي والحرية من الخوف والسخرية هما الشرطان الأساسيان لانطلاق الطاقة الإبداعية."],[2,2,0,0,"يتميز أصحاب 'الذكاء الجسمي الحركي' بقدرة عالية على استخدام أجسادهم بمهارة للتعبير أو إنجاز أعمال دقيقة كالرياضيين والجراحين.",["صح","خطأ"],0,"صحيح؛ يجمع الذكاء الحركي بين التآزر العضلي العصبي والدقة في الأداء البدني واليدوي."],[2,2,0,1,"إذا كان العمر الزمني لطفل هو 10 سنوات، وأظهر أداءً عقلياً يعادل عمر 12 سنة، فإن معامل ذكائه (IQ) يساوي 120.",["صح","خطأ"],0,"صحيح؛ بتطبيق المعادلة: (العمر العقلي 12 ÷ العمر الزمني 10) × 100 = 120، وهو مستوى ذكاء مرتفع."],[2,2,0,1,"حصول الفرد على درجة مرتفعة جداً في اختبار الذكاء الأكاديمي (IQ) يضمن بالضرورة أنه سيكون مبدعاً ومبتكراً.",["صح","خطأ"],1,"خطأ؛ الذكاء المرتفع شرط مساعد لكنه غير كافٍ للإبداع، فالإبداع يتطلب مرونة وأصالة ودافعية وبيئة داعمة."],[2,2,0,1,"في بيئة العمل، يسهم الذكاء الوجداني للقائد في احتواء ضغوط الفريق وتحفيز الموظفين على الابتكار.",["صح","خطأ"],0,"صحيح؛ القائد الذكي وجدانياً يخلق مناخاً من الثقة والتقدير يرفع الدافعية الداخلية للإبداع."],[2,2,0,1,"تُعد البيروقراطية الجامدة وكثرة اللوائح المقيدة من أبرز معوقات البيئة الإبداعية في المؤسسات.",["صح","خطأ"],0,"صحيح؛ الإجراءات الروتينية المعقدة تقتل الحماس وتؤخر تنفيذ الأفكار الجديدة."],[2,2,0,1,"يرى جاردنر أن كل إنسان يمتلك نوعاً واحداً فقط من الذكاءات الثمانية ولا يمكنه تنمية بقية الأنواع.",["صح","خطأ"],1,"خطأ؛ يمتلك كل إنسان جميع الذكاءات بدرجات متفاوتة، ويمكن تنمية أي ذكاء بالتدريب والبيئة المناسبة."],[2,2,0,1,"استخدام أدوات الذكاء الاصطناعي التوليدي في تحليل البيانات واقتراح بدائل أولية يُعد داعماً للإبداع البشري إذا استُخدم بوعي نقدي.",["صح","خطأ"],0,"صحيح؛ الذكاء الاصطناعي أداة مساعدة تسرّع البحث والتجريب، بينما يظل التوجيه والتقييم الابتكاري للإنسان."],[2,2,0,1,"المكافآت المادية وحدها تكفي لبناء بيئة إبداعية مستدامة حتى لو غاب التقدير المعنوي والاستقلالية.",["صح","خطأ"],1,"خطأ؛ الدافعية الداخلية والتقدير المعنوي وحرية المبادرة أهم أثراً في استدامة الإبداع من الحوافز المادية المجردة."],[2,2,0,1,"يمتلك المهندس المعماري والملاح البحري ومصمم الجرافيك درجة عالية من 'الذكاء البصري المكاني'.",["صح","خطأ"],0,"صحيح؛ الذكاء البصري المكاني هو القدرة على إدراك الأبعاد والاتجاهات وتحويل التصورات الذهنية إلى أشكال بصرية."],[2,2,0,1,"السخرية من الأسئلة غير التقليدية للطلاب في الفصل الدراسي تُعد أحد أساليب تنمية الإبداع.",["صح","خطأ"],1,"خطأ؛ السخرية والقمع الفكري من أخطر مثبطات الإبداع، بينما تقبل التساؤلات الغريبة يشجع الفضول المعرفي."],[2,2,0,1,"يتضمن الذكاء الاجتماعي (Interpersonal) القدرة على قراءة لغة الجسد وفهم دوافع الآخرين وبناء علاقات ناجحة.",["صح","خطأ"],0,"صحيح؛ يميز الذكاء الاجتماعي القادة والمعلمين والمفاوضين الناجحين."],[2,2,1,0,"مؤسس نظرية الذكاءات المتعددة (Multiple Intelligences) هو العالم:",["هوارد جاردنر","إدوارد دي بونو","بنيامين بلوم","إيفان بافلوف"],0,"قدم عالم النفس الأمريكي هوارد جاردنر نظرية الذكاءات المتعددة عام 1983."],[2,2,1,0,"معادلة حساب معامل الذكاء (IQ) هي:",["(العمر العقلي ÷ العمر الزمني) × 100","(العمر الزمني ÷ العمر العقلي) × 100","(العمر العقلي + العمر الزمني) ÷ 2","(العمر العقلي × العمر الزمني) ÷ 100"],0,"يقاس معامل الذكاء بقسمة العمر العقلي على العمر الزمني وضرب الناتج في 100."],[2,2,1,0,"أي من أنواع الذكاء التالية يظهر بوضوح لدى الشعراء والخطباء والصحفيين؟",["الذكاء اللغوي اللفظي","الذكاء المنطقي الرياضي","الذكاء الموسيقي الإيقاعي","الذكاء الطبيعي"],0,"الذكاء اللغوي هو القدرة على توظيف الكلمات ببراعة سواء شفهياً أو كتابياً."],[2,2,1,0,"القدرة على التعامل مع الأرقام والاستدلال المنطقي واكتشاف الأنماط المجردة تمثل:",["الذكاء المنطقي الرياضي","الذكاء الاجتماعي","الذكاء الجسمي الحركي","الذكاء البصري المكاني"],0,"يتميز بهذا الذكاء العلماء والمبرمجون والمحاسبون والمهندسون."],[2,2,1,0,"من العناصر الأساسية للذكاء الوجداني (العاطفي):",["الوعي بالذات والتعاطف وإدارة الانفعالات","سرعة إجراء العمليات الحسابية المعقدة","حفظ القواميس اللغوية","القدرة على رسم الخرائط الطبوغرافية"],0,"الذكاء الوجداني يتعلق بإدراك المشاعر الذاتية ومشاعر الآخرين وتوجيهها بذكاء."],[2,2,1,0,"من أهم شروط البيئة الإبداعية داخل المؤسسات:",["توفير الحرية الفكرية والأمان النفسي وتقبل الاختلاف","تطبيق العقوبات الصارمة على أي خطأ تجريبي","المركزية المطلقة في اتخاذ جميع القرارات","منع التواصل بين الإدارات المختلفة"],0,"تزدهر الأفكار الإبداعية في البيئات التي تمنح الثقة وتشجع المبادرة وتتحمل المخاطرة المحسوبة."],[2,2,1,0,"الذكاء الذي يرتبط بالحساسية للأصوات والإيقاعات والنغمات الموسيقية هو:",["الذكاء الموسيقي","الذكاء الطبيعي","الذكاء الذاتي","الذكاء الحركي"],0,"الذكاء الموسيقي يمكّن صاحبه من تمييز الطبقات الصوتية والإيقاعات وتأليف الألحان."],[2,2,1,0,"يُصنف الشخص الذي يحصل على درجة (IQ) أعلى من 130 ضمن فئة:",["الموهوبين والمتفوقين عقلياً","متوسطي الذكاء","ذوي صعوبات التعلم الشديدة","أقل من المتوسط"],0,"الدرجات من 130 فأكثر تمثل قمة التوزيع الطبيعي للذكاء وتدل على التفوق العقلي."],[2,2,1,0,"جميع ما يلي من معوقات البيئة الإبداعية في المجتمع والمدرسة ما عدا:",["تشجيع التساؤل والبحث الحر","التلقين والحفظ الآلي دون فهم","الخوف من النقد والسخرية","الجمود الفكري والتقليد الأعمى"],0,"تشجيع التساؤل والبحث الحر هو محفز للإبداع وليس معوقاً له."],[2,2,1,0,"يُقصد بـ 'الذكاء الاصطناعي' (AI):",["محاكاة الذكاء البشري في الآلات والبرمجيات لأداء مهام تتطلب تفكيراً وتعلماً","قياس ذكاء الأطفال باستخدام المكعبات الخشبية","قدرة الإنسان على التكيف مع الطبيعة والغابات","تطوير اللياقة البدنية للرياضيين"],0,"الذكاء الاصطناعي يهدف إلى تمكين الأنظمة الحاسوبية من التعلم والاستنتاج وحل المشكلات."],[2,2,1,1,"طفل عمره الزمني 8 سنوات، أجاب عن أسئلة اختبار الذكاء بمستوى طفل عمره 10 سنوات؛ ما قيمة معامل ذكائه وتصنيفه؟",["125 (ذكي جداً / فوق المتوسط)","80 (أقل من المتوسط)","100 (متوسط تماماً)","150 (عبقري)"],0,"الحساب: (10 ÷ 8) × 100 = 1.25 × 100 = 125، وهي درجة تصنف ضمن الذكاء المرتفع فوق المتوسط."],[2,2,1,1,"مدير مبيعات يمتلك قدرة استثنائية على تهدئة العملاء الغاضبين، وفهم احتياجات فريقه، وتحفيزهم دون أوامر سلطوية. أي نوعين من الذكاء يبرزان لديه؟",["الذكاء الاجتماعي والذكاء الوجداني","الذكاء الطبيعي والذكاء الموسيقي","الذكاء البصري والذكاء الحركي","الذكاء الرياضي المجرد فقط"],0,"إدارة الانفعالات والتعاطف وبناء العلاقات الفعالة تمثل قمة الذكاء الوجداني والاجتماعي."],[2,2,1,1,"كيف يمكن للمعلم توظيف نظرية الذكاءات المتعددة لجاردنر داخل الفصل الدراسي لتحفيز الإبداع؟",["تنويع أساليب الشرح والتقييم بين الأنشطة البصرية والحركية واللغوية والجماعية","الاعتماد على المحاضرة الإلقائية والاختبارات التحريرية فقط","تقسيم الطلاب حسب درجات الرياضيات فقط","إلغاء الأنشطة الفنية والرياضية من المنهج"],0,"تطبيق نظرية جاردنر يعني مخاطبة أنماط الذكاء المختلفة لدى الطلاب لإتاحة الفرصة لكل طالب لإظهار تميزه."],[2,2,1,1,"في دراسة لمقارنة الأداء المهني، وُجد أن موظفاً ذا ذكاء أكاديمي متوسط وذكاء وجداني مرتفع تفوق على زميله ذي الذكاء الأكاديمي المرتفع. ما التفسير العلمي لذلك؟",["الذكاء الوجداني يعزز العمل الجماعي والمرونة النفسية وإدارة الضغوط في بيئة العمل","الذكاء الأكاديمي لا فائدة له في أي وظيفة","النجاح المهني يعتمد على الحظ فقط","الذكاء الوجداني يلغي الحاجة للمهارات الفنية"],0,"تشير الدراسات إلى أن الذكاء الأكاديمي يساعد في الحصول على الوظيفة، بينما الذكاء الوجداني هو المحرك الأكبر للترقي والقيادة."],[2,2,1,1,"شركة تقنية تخصص 15% من وقت عمل مهندسيها أسبوعياً للعمل على مشاريع جانبية يختارونها بحرية دون محاسبة على الفشل الأولي. هذا الإجراء يهدف إلى:",["تهيئة بيئة تنظيمية داعمة للابتكار وتقليل الخوف من المخاطرة","زيادة الرقابة البيروقراطية على الموظفين","تقليل إنتاجية الشركة","إلغاء العمل الجماعي"],0,"منح الوقت الحر والأمان النفسي للتجريب (كما فعلت شركات عالمية كـ Google و3M) هو محرك رئيسي للابتكار المؤسسي."],[2,2,1,1,"ما العلاقة الدقيقة بين 'الذكاء' و'الإبداع' وفق ما أشارت إليه الدراسات النفسية؟",["يرتبطان إيجابياً حتى حد معين (حوالي IQ 120)، وبعده لا تعني زيادة الذكاء زيادة تلقائية في الإبداع","العلاقة بينهما عكسية تماماً فكل ذكي غير مبدع","هما مصطلحان متطابقان بنسبة 100%","الإبداع يتطلب انخفاض مستوى الذكاء"],0,"تُعرف هذه بـ 'نظرية العتبة'؛ حيث يتطلب الإبداع حداً أدنى من الذكاء، لكن التفوق الإبداعي يعتمد بعد ذلك على سمات التفكير التباعدي."],[2,2,1,1,"جراح قلب يجري عمليات دقيقة بالمنظار مع قدرة فائقة على التحكم في حركة يديه وتقدير المسافات الداخلية. يجمع هذا الجراح بين:",["الذكاء الجسمي الحركي والذكاء البصري المكاني","الذكاء الموسيقي والذكاء الطبيعي","الذكاء اللغوي والذكاء الاجتماعي فقط","الذكاء الوجودي والذكاء الإيقاعي"],0,"الجراحة الدقيقة تتطلب تآزراً حركياً فائقاً (ذكاء حركي) وتصوراً دقيقاً للأعضاء والأبعاد (ذكاء بصري مكاني)."],[2,2,1,1,"أي من الممارسات الأسرية التالية تُعد أكبر عائق أمام تنمية الذكاء والإبداع لدى الطفل؟",["الحماية الزائدة واتخاذ جميع القرارات نيابة عن الطفل ومنعه من الاستكشاف","توفير الألعاب التركيبية والقصص المصورة","الإجابة عن أسئلته الفضولية بصبر ووضوح","تشجيعه على التعبير عن رأيه في شؤون الأسرة"],0,"الحماية المفرطة تحرم الطفل من التجربة والخطأ وتنمي الاعتمادية بدلاً من الاستقلالية الفكرية."],[2,2,1,1,"شخص يمتلك وعياً عميقاً بمشاعره، ويحدد أهدافه الشخصية بدقة، ويكتب يومياته لتحليل قراراته وتطوير ذاته. هذا يجسد:",["الذكاء الشخصي الذاتي (Intrapersonal Intelligence)","الذكاء الاجتماعي (Interpersonal Intelligence)","الذكاء الطبيعي","الذكاء الحركي"],0,"القدرة على التأمل الذاتي وفهم الدوافع الداخلية وتنظيم الذات هي جوهر الذكاء الشخصي الذاتي."],[2,2,1,1,"عند دمج الذكاء الاصطناعي في بيئة الأعمال الإبداعية، ما الدور الذي يظل حكراً على العقل البشري المبدع؟",["تحديد الرؤية الأخلاقية، والتعاطف الإنساني، وإضفاء المعنى الأصيل على الابتكار","فرز ملايين الجداول الرقمية في ثانية واحدة","النسخ الآلي للبيانات المتكررة","إجراء العمليات الحسابية الروتينية"],0,"تتفوق الآلة في السرعة والحوسبة، بينما يتفوق الإنسان في القيم والحدس والتعاطف وصياغة الرؤى الإبداعية الجديدة."],[2,3,0,0,"يشير 'الإبداع' (Creativity) إلى توليد الأفكار الجديدة والأصيلة، بينما يشير 'الابتكار' (Innovation) إلى تحويل تلك الأفكار إلى تطبيق عملي ومنتجات ذات قيمة.",["صح","خطأ"],0,"صحيح؛ الإبداع هو الجانب الفكري (توليد الفكرة)، والابتكار هو الجانب التنفيذي والتطبيقي الذي يحول الفكرة لواقع ملموس."],[2,3,0,0,"من مهارات التفكير الإبداعي الأساسية: الطلاقة، والمرونة، والأصالة، والتفاصيل (الإفاضة)، والحساسية للمشكلات.",["صح","خطأ"],0,"صحيح؛ هذه المهارات الخمس تمثل الركائز الأساسية للتفكير الإبداعي عند جيلفورد وتورانس."],[2,3,0,0,"تعني 'الطلاقة' (Fluency) القدرة على إنتاج أكبر عدد ممكن من الأفكار أو البدائل في فترة زمنية محددة.",["صح","خطأ"],0,"صحيح؛ الطلاقة تهتم بالكم والوفرة في توليد الأفكار المتنوعة بسرعة وسهولة."],[2,3,0,0,"تعني 'الأصالة' (Originality) تكرار الأفكار الشائعة والمألوفة التي يطرحها معظم الناس.",["صح","خطأ"],1,"خطأ؛ الأصالة تعني الجدة والتفرد والندرة، أي الإتيان بأفكار غير مسبوقة وغير تقليدية."],[2,3,0,0,"تمر العملية الإبداعية وفق نموذج جراهام والاس بأربع مراحل متتالية هي: الإعداد، والاحتضان، والإشراق، والتحقق.",["صح","خطأ"],0,"صحيح؛ تبدأ بالإعداد وجمع المعلومات، ثم الاحتضان (التخمر اللاواعي)، ثم الإشراق (ولادة الفكرة)، وأخيراً التحقق والتقييم."],[2,3,0,0,"تُعد مرحلة 'الإشراق' (Illumination) اللحظة المفاجئة التي تلمع فيها شرارة الحل أو الفكرة الإبداعية في ذهن المبدع.",["صح","خطأ"],0,"صحيح؛ تُعرف بلحظة (وجدتها! / Eureka) حيث تتبلور الفكرة وتظهر للوعي فجأة."],[2,3,0,0,"يقتصر الابتكار في منظمات الأعمال على تطوير المنتجات المادية فقط ولا يشمل أساليب التسويق أو التنظيم الإداري.",["صح","خطأ"],1,"خطأ؛ يشمل الابتكار أربعة مجالات رئيسية: ابتكار المنتج، وابتكار العمليات، وابتكار التسويق، والابتكار التنظيمي."],[2,3,0,0,"التفكير التباعدي (Divergent Thinking) هو جوهر التفكير الإبداعي لأنه ينطلق من نقطة واحدة للبحث عن حلول متعددة ومتشعبة.",["صح","خطأ"],0,"صحيح؛ على عكس التفكير التقاربي الذي يبحث عن إجابة واحدة صحيحة، يفتح التفكير التباعدي آفاقاً متعددة."],[2,3,0,0,"تعني 'الحساسية للمشكلات' قدرة المبدع على رؤية مواطن النقص والخلل في الأشياء قبل أن يلاحظها الآخرون.",["صح","خطأ"],0,"صحيح؛ المبدع يمتلك وعياً حاداً بالمشكلات والفرص التحسينية في بيئته."],[2,3,0,0,"في مرحلة 'التحقق' (Verification) يتم اختبار الفكرة الإبداعية وتقييم صلاحيتها وجدواها العملية.",["صح","خطأ"],0,"صحيح؛ التحقق هو المرحلة النهائية التي تضمن أن الفكرة المبتكرة قابلة للتطبيق وفعالة."],[2,3,0,1,"طرحت شركة آبل هاتف (iPhone) بشاشة لمس كاملة تستغني عن لوحة المفاتيح التقليدية؛ يُعد هذا مثالاً بارزاً على 'الابتكار الجذري' في المنتج.",["صح","خطأ"],0,"صحيح؛ تغيير تصميم ووظيفة الهاتف المحمول بالكامل وخلق سوق جديد هو نموذج كلاسيكي للابتكار الجذري (المزعزع)."],[2,3,0,1,"عندما يُطلب منك ذكر استخدامات غير تقليدية لـ 'مشبك الورق' فتذكر 15 استخداماً تنتمي جميعها لفئة واحدة (كالتثبيت)، فهذا يدل على طلاقة عالية ومرونة منخفضة.",["صح","خطأ"],0,"صحيح؛ كثرة الأفكار تعني الطلاقة، أما حصرها في فئة وظيفية واحدة فيدل على ضعف المرونة (تنوع الفئات)."],[2,3,0,1,"تتطلب مرحلة 'الاحتضان' (Incubation) استمرار الفرد في الضغط الذهني المتواصل دون أي راحة أو ابتعاد مؤقت عن المشكلة.",["صح","خطأ"],1,"خطأ؛ في مرحلة الاحتضان يبتعد المبدع مؤقتاً عن التفكير الواعي بالمشكلة ليتيح للعقل الباطن إعادة ترتيب المعلومات وربطها."],[2,3,0,1,"قيام شركة بتغيير أسلوب توصيل طلباتها للعملاء باستخدام طائرات الدرون بدلاً من الشاحنات التقليدية يُصنف ضمن 'ابتكار العمليات والتسويق'.",["صح","خطأ"],0,"صحيح؛ تطوير طرق الإنتاج والتوزيع والتوصيل وتجربة العميل يمثل ابتكاراً في العمليات والخدمات."],[2,3,0,1,"الإفاضة (التفاصيل - Elaboration) تعني اختصار الفكرة في كلمة واحدة وحذف جميع عناصرها التكميلية.",["صح","خطأ"],1,"خطأ؛ الإفاضة تعني إضافة تفاصيل ثرية وتوسيع الفكرة وتطويرها لتصبح أكثر كمالاً وجاذبية وقابلية للتنفيذ."],[2,3,0,1,"إدخال تحسينات تدريجية مستمرة على طراز سيارة سنوياً (مثل تحسين استهلاك الوقود) يُسمى 'ابتكاراً تدريجياً' (Incremental Innovation).",["صح","خطأ"],0,"صحيح؛ الابتكار التدريجي يضيف تحسينات مستمرة على منتجات قائمة دون تغيير جوهرها بالكامل."],[2,3,0,1,"لا يمكن أن يوجد ابتكار ناجح دون وجود فكرة إبداعية سابقة له، ولكن قد توجد أفكار إبداعية لا تتحول إلى ابتكارات.",["صح","خطأ"],0,"صحيح؛ الإبداع هو المادة الخام للابتكار؛ فكثير من الأفكار الإبداعية تبقى حبيسة الأدراج إذا لم تُنفذ وتُسوَّق كابتكارات."],[2,3,0,1,"يحتاج المبدع في مرحلة 'الإعداد' إلى جمع معلومات وبيانات واسعة ومعمقة حول المشكلة قبل أن يتوقع ظهور الإلهام.",["صح","خطأ"],0,"صحيح؛ الإلهام لا يأتي من فراغ، بل يسبق الإشراق جهد كبير في البحث والدراسة وفهم أبعاد المشكلة."],[2,3,0,1,"يُعد 'الابتكار التنظيمي' مسؤولاً عن استحداث هياكل إدارية مرنة وأساليب عمل عن بُعد تحفز إنتاجية الموظفين.",["صح","خطأ"],0,"صحيح؛ الابتكار التنظيمي يركز على تطوير بيئة العمل والهيكل الإداري ونظم الحوافز والاتصال داخل المؤسسة."],[2,3,0,1,"التفكير التقاربي (Convergent) والتفكير التباعدي (Divergent) متناقضان ولا يجتمعان أبداً في حل مشكلة واحدة.",["صح","خطأ"],1,"خطأ؛ يتكاملان في حل المشكلات؛ نستخدم التباعدي لتوليد أكبر قدر من الحلول المبتكرة، ثم التقاربي لاختيار الحل الأنسب."],[2,3,1,0,"الفرق الأساسي بين الإبداع والابتكار هو أن:",["الإبداع هو توليد الأفكار الجديدة، والابتكار هو تحويلها إلى منتجات أو خدمات مطبقة","الابتكار يحدث في الخيال فقط، والإبداع هو التصنيع التجاري","الإبداع خاص بالعلوم، والابتكار خاص بالفنون فقط","لا يوجد أي فرق بين المفهومين في الإدارة"],0,"الإبداع (Creativity) يركز على إنتاج الفكرة الأصيلة، بينما الابتكار (Innovation) يركز على التنفيذ والتطبيق العملي ذي القيمة."],[2,3,1,0,"القدرة على إنتاج أفكار جديدة ونادرة وغير مألوفة تُسمى:",["الأصالة (Originality)","الطلاقة (Fluency)","التذكر الآلي","التقليد"],0,"الأصالة هي المعيار النوعي للإبداع وتعني الجدة والتفرد وعدم التكرار."],[2,3,1,0,"الترتيب الصحيح لمراحل العملية الإبداعية الأربعة هو:",["الإعداد ← الاحتضان ← الإشراق ← التحقق","الإشراق ← الإعداد ← التحقق ← الاحتضان","الاحتضان ← التحقق ← الإعداد ← الإشراق","التحقق ← الإشراق ← الاحتضان ← الإعداد"],0,"هذا هو التسلسل الكلاسيكي للعملية الإبداعية: جمع المعلومات (إعداد) ← تخمر الفكرة (احتضان) ← ولادة الحل (إشراق) ← الاختبار (تحقق)."],[2,3,1,0,"المهارة الإبداعية التي تعني القدرة على تغيير زاوية التفكير والانتقال من فئة أفكار إلى فئة أخرى هي:",["المرونة (Flexibility)","الطلاقة اللفظية","الجمود المعرفي","الحفظ"],0,"المرونة تقيس تنوع الأفكار وقدرة الفرد على تكييف تفكيره وتغيير مساره الذهني."],[2,3,1,0,"أي من المجالات التالية يُعد أحد مجالات الابتكار الأربعة في المؤسسات؟",["ابتكار المنتج والعملية والتسويق والتنظيم","ابتكار الروتين الإداري المعقد","ابتكار الأعذار لتأخير العمل","ابتكار أساليب تقليد المنافسين حرفياً"],0,"حدد دليل أوسلو (Oslo Manual) ومقررات الابتكار أربعة مجالات: المنتج، العملية، التسويق، والتنظيم."],[2,3,1,0,"المرحلة التي يقوم فيها العقل اللاواعي بمعالجة المعلومات وربطها أثناء استرخاء الفرد هي:",["مرحلة الاحتضان (الاختمار)","مرحلة التحقق الميداني","مرحلة التسويق التجاري","مرحلة جمع البيانات الأولية"],0,"مرحلة الاحتضان هي فترة التوقف المؤقت عن التفكير المركز، حيث يعمل العقل الباطن على صياغة الروابط الجديدة."],[2,3,1,0,"إضافة تفاصيل وتحسينات تجعل الفكرة البسيطة مشروعاً متكاملاً وجذاباً يُسمى:",["الإفاضة (التفاصيل - Elaboration)","الحذف","الاختزال","النقد الهدام"],0,"الإفاضة هي القدرة على إثراء الفكرة وتطوير أبعادها وتفاصيلها التنفيذية."],[2,3,1,0,"نمط التفكير الذي ينطلق في اتجاهات متعددة لتوليد أكبر عدد من الحلول المبتكرة هو:",["التفكير التباعدي (المنطلق)","التفكير التقاربي (المحدد)","التفكير النمطي","التفكير التلقيني"],0,"التفكير التباعدي هو المحرك الأساسي للإبداع لأنه يتجاوز الحل الواحد المألوف."],[2,3,1,0,"من السمات الشخصية للمبدعين:",["الفضول المعرفي، وحب الاستطلاع، وتحمل الغموض، والمثابرة","الخوف من المجهول وتجنب الأسئلة","الالتزام الحرفي بالتعليمات دون تفكير","الاستسلام السريع عند أول عقبة"],0,"يتميز المبدعون بالفضول والانفتاح على التجارب الجديدة والقدرة على تحمل الغموض حتى يتضح الحل."],[2,3,1,0,"المرحلة الأخيرة في العملية الإبداعية والتي يتم فيها تجريب الفكرة والتأكد من فاعليتها هي:",["مرحلة التحقق","مرحلة الإعداد","مرحلة الاحتضان","مرحلة الحلم"],0,"في مرحلة التحقق يخضع الإلهام للاختبار العملي والعلمي للتأكد من صلاحيته."],[2,3,1,1,"عالم كيميائي ظل يبحث لأشهر عن التركيب الحلقي للبنزين دون جدوى، وأثناء جلوسه مسترخياً أمام المدفأة خطرت له فكرة الحلقة السداسية فجأة ثم اختبرها في المعمل. لحظة خطور الفكرة تمثل:",["مرحلة الإشراق (Illumination)","مرحلة الإعداد (Preparation)","مرحلة التحقق (Verification)","مرحلة التسويق"],0,"هذه قصة العالم كيكولي الشهيرة؛ فالبحث الطويل هو الإعداد، والاسترخاء هو الاحتضان، ولمعان الفكرة هو الإشراق، والاختبار المعملي هو التحقق."],[2,3,1,1,"في مسابقة لتوليد أفكار لتقليل الزحام المروري، اقترح أحمد 12 فكرة كلها تتعلق بتوسيع الطرق، بينما اقترحت سارة 6 أفكار تشمل: النقل الذكي، العمل عن بُعد، الدراجات، ومواعيد دوام مرنة. تتفوق سارة في مهارة:",["المرونة (تنوع الفئات والزوايا الفكرية)","الطلاقة الكمية فقط","التكرار النمطي","الحفظ الآلي"],0,"أحمد لديه طلاقة أعلى (12 فكرة) لكن في مجال واحد، بينما سارة أظهرت مرونة عالية بتنويع مجالات الحلول."],[2,3,1,1,"قامت شركة قهوة شهيرة بابتكار نظام طلب ودفع مسبق عبر تطبيق الهاتف مع برنامج ولاء تفاعلي، دون تغيير نوع حبوب القهوة. هذا يُعد:",["ابتكاراً في التسويق وتجربة العميل والعمليات","ابتكاراً في المادة الخام فقط","ابتكاراً زراعياً","تقليداً تقليدياً غير مبتكر"],0,"تطوير قنوات البيع والتفاعل مع العملاء وتسهيل الخدمة يمثل ابتكاراً تسويقياً وخدمياً عالي القيمة."],[2,3,1,1,"لماذا تفشل كثير من الشركات ذات الأفكار الإبداعية في تحقيق عوائد اقتصادية؟",["لأنها تتوقف عند مرحلة 'الإبداع' (الفكرة) وتفتقر إلى آليات 'الابتكار' (التنفيذ والتسويق)","لأن الأفكار الإبداعية ضارة بالشركات","لأن العملاء يرفضون أي منتج جديد دائماً","لأن الابتكار لا يحتاج إلى تخطيط"],0,"الفكرة الإبداعية بلا تنفيذ وتسويق وإدارة مخاطر لا تتحول إلى قيمة اقتصادية أو ميزة تنافسية."],[2,3,1,1,"شركة أحذية رياضية لاحظت أن راكبي الدراجات يعانون من انزلاق أقدامهم عن البدالات، فصممت حذاءً بنعل خاص يتعشق مع البدالة. المهارة الإبداعية التي بدأت بها هذه القصة هي:",["الحساسية للمشكلات وإدراك حاجات غير مشبعة","الطلاقة اللفظية","التفكير الخرافي","الجمود الوظيفي"],0,"ملاحظة معاناة المستخدمين وتحويلها إلى فرصة تصميمية هو جوهر مهارة الحساسية للمشكلات."],[2,3,1,1,"عند مقارنة 'الابتكار التدريجي' بـ 'الابتكار الجذري'، أي العبارات التالية صحيحة؟",["الابتكار الجذري يخلق أسواقاً جديدة ويغير قواعد المنافسة، بينما التدريجي يحسّن المنتجات الحالية","الابتكار التدريجي يحمل مخاطر أعلى دائماً من الابتكار الجذري","الابتكار الجذري يقتصر على تغيير لون غلاف المنتج فقط","الشركات الناجحة تعتمد على نوع واحد وتهمل الآخر تماماً"],0,"التوازن بين الابتكار التدريجي (لحماية الحصة السوقية الحالية) والجذري (لصناعة المستقبل) هو سر استدامة المؤسسات."],[2,3,1,1,"تجاوز مرحلة 'التحقق' والتسرع في طرح منتج مبتكر في السوق قبل اختباره يؤدي غالباً إلى:",["ظهور عيوب فنية وفشل المنتج في تلبية توقعات المستهلكين","زيادة موثوقية المنتج تلقائياً","توفير تكاليف الصيانة المستقبلية","ضمان نجاح الفكرة بنسبة 100%"],0,"مرحلة التحقق والتجريب (Prototyping & Testing) ضرورية لاكتشاف الثغرات وتعديلها قبل الإطلاق الكامل."],[2,3,1,1,"من أمثلة 'الابتكار التنظيمي' داخل الجامعات أو الشركات:",["إنشاء فرق عمل متعددة التخصصات وإلغاء الحواجز الهرمية لتسريع اتخاذ القرار","شراء أجهزة حاسوب أسرع فقط","تغيير شعار الشركة فقط","زيادة ساعات العمل الروتينية"],0,"الابتكار التنظيمي يعيد تصميم طرق العمل والتعاون والقيادة داخل المؤسسة."],[2,3,1,1,"أي من الممارسات التالية تساعد على تنشيط مرحلة 'الاحتضان' عندما تواجه مشكلة معقدة مستعصية؟",["أخذ استراحة، أو ممارسة المشي، أو الانتقال لنشاط مختلف لفترة قصيرة","السهر المتواصل لثلاث ليالٍ أمام نفس الصفحة","التوتر والقلق المستمر","إلغاء المشكلة من جدول الأعمال نهائياً"],0,"الابتعاد المؤقت بعد جهد الإعداد يتيح للدماغ ربط المعلومات في الخلفية وتجاوز التثبيت الذهني."],[2,3,1,1,"مصمم أزياء ابتكر فستاناً مصنوعاً من ألياف قابلة للذوبان في الماء لإعادة تدويرها وتشكيلها كفستان جديد كلياً. هذا يجسد مهارة:",["الأصالة (فكرة فريدة غير مسبوقة)","التقليد الحرفي","التفكير التقاربي الروتيني","الاسترجاع الآلي"],0,"الجمع بين الموضة والاستدامة عبر مادة قابلة لإعادة التشكيل هو فكرة أصيلة ونادرة للغاية."],[2,4,0,0,"من قواعد التفكير الابتكاري الأساسية: التحرر من القيود الذهنية، وتأجيل الحكم والنقد أثناء توليد الأفكار.",["صح","خطأ"],0,"صحيح؛ النقد المبكر يقتل الأفكار الوليدة، لذا يجب الفصل التام بين مرحلة التوليد ومرحلة التقييم."],[2,4,0,0,"ابتكر أليكس أوزبورن أسلوب 'العصف الذهني' (Brainstorming) لتوليد أكبر قدر من الأفكار الجماعية في جو من الحرية.",["صح","خطأ"],0,"صحيح؛ وضع أليكس أوزبورن قواعد العصف الذهني الأربع لتعزيز الإنتاج الفكري الجماعي."],[2,4,0,0,"تقوم قاعدة 'الكم يولد الكيف' في العصف الذهني على أن كثرة الأفكار المطروحة تزيد من احتمالية الوصول إلى أفكار أصيلة وذات جودة عالية.",["صح","خطأ"],0,"صحيح؛ كلما زاد عدد الأفكار المتولدة، زادت فرصة ظهور حلول إبداعية متميزة."],[2,4,0,0,"تُعد قائمة 'سكامبر' (SCAMPER) أداة إبداعية لتطوير المنتجات والأفكار عبر سبعة تساؤلات موجهة (الاستبدال، الدمج، التكييف، التعديل، الاستخدامات الأخرى، الحذف، العكس).",["صح","خطأ"],0,"صحيح؛ كل حرف في كلمة SCAMPER يرمز إلى أداة ذهنية لتحويل وتطوير فكرة أو منتج قائم."],[2,4,0,0,"ابتكر توني بوزان 'الخرائط الذهنية' (Mind Maps) كأداة بصرية تحاكي طريقة عمل الخلايا العصبية في الدماغ.",["صح","خطأ"],0,"صحيح؛ تستخدم الخرائط الذهنية الألوان والصور والفروع المتشعبة لتنظيم الأفكار وتنشيط نصفي الدماغ."],[2,4,0,0,"يُعد 'مقياس تورانس للتفكير الإبداعي' (TTCT) من أشهر المقاييس العالمية لقياس القدرات الإبداعية اللفظية والشكلية.",["صح","خطأ"],0,"صحيح؛ صمم بول تورانس اختبارات لفظية وشكلية تقيس الطلاقة والمرونة والأصالة والتفاصيل."],[2,4,0,0,"تُشجع جلسات العصف الذهني على 'البناء على أفكار الآخرين' وتطويرها والدمج بينها.",["صح","خطأ"],0,"صحيح؛ يُسمى ذلك (التلاقح الفكري)، حيث تلهم فكرة أحد المشاركين مشاركاً آخر لتطويرها."],[2,4,0,0,"تشمل أبعاد التفكير الابتكاري: البعد الشخصي (سمات المبدع)، والبعد العملي (مراحل التفكير)، والبعد البيئي (المناخ المحيط)، والبعد الإنتاجي (المخرج المبتكر).",["صح","خطأ"],0,"صحيح؛ تُعرف هذه بالأبعاد الأربعة للإبداع (4Ps: Person, Process, Press, Product)."],[2,4,0,0,"في جلسات العصف الذهني، يُمنع طرح الأفكار الغريبة أو الخيالية ويجب الالتزام بالأفكار الواقعية التقليدية فقط.",["صح","خطأ"],1,"خطأ؛ من قواعد العصف الذهني 'الترحيب بالأفكار الجامحة والغريبة' لأنها تكسر الجمود ويمكن تهذيبها لاحقاً."],[2,4,0,0,"أسلوب 'القبعات الست للتفكير' لإدوارد دي بونو يساعد على النظر للمشكلة من ست زوايا مختلفة بشكل منظم.",["صح","خطأ"],0,"صحيح؛ يوزع دي بونو أنماط التفكير على ست قبعات ملونة (بيضاء، حمراء، سوداء، صفراء، خضراء، زرقاء)."],[2,4,0,1,"عندما قام مصممو حقيبة السفر بإضافة عجلات ومقبض سحب لها بدلاً من حملها باليد، فإنهم طبقوا أداة 'الدمج' (Combine) في استراتيجية سكامبر.",["صح","خطأ"],0,"صحيح؛ دمج الحقيبة مع العجلات أحدث ثورة في صناعة حقائب السفر وسهّل تنقل المسافرين."],[2,4,0,1,"في أسلوب القبعات الست، تمثل 'القبعة السوداء' التفكير التشاؤمي الهدام الذي يجب التخلص منه وعدم استخدامه إطلاقاً.",["صح","خطأ"],1,"خطأ؛ القبعة السوداء تمثل التفكير النقدي الحذر وتقييم المخاطر ونقاط الضعف المحتملة، وهي ضرورية لحماية المشاريع من الفشل."],[2,4,0,1,"قيام شركة نوكيا قديماً بالتمسك بنظام تشغيلها التقليدي ورفض التغيير السريع للهواتف الذكي :",["أليكس أوزبورن","توني بوزان","بول تورانس","سيجموند فرويد"],0,"ابتكر أليكس أوزبورن أسلوب العصف الذهني في أربعينيات القرن الماضي لتنشيط الإبداع الجماعي."],[2,4,1,0,"القاعدة الذهبية الأولى في جلسات العصف الذهني هي:",["منع النقد والتقييم أثناء مرحلة توليد الأفكار","استبعاد الأفكار الغريبة فوراً","الاقتصار على أفكار المدير فقط","الاكتفاء بثلاث أفكار في كل جلسة"],0,"إرجاء الحكم والنقد يحرر المشاركين من الخوف ويسمح بتدفق الأفكار بحرية."],[2,4,1,0,"يرمز الحرف (S) في أداة سكامبر (SCAMPER) للتفكير الإبداعي إلى:",["الاستبدال (Substitute)","الإيقاف (Stop)","التكرار (Same)","السرية (Secret)"],0,"حرف S يرمز إلى Substitute (الاستبدال): ماذا يمكن استبداله في المنتج من مواد أو خطوات؟"],[2,4,1,0,"مطور تقنية 'الخرائط الذهنية' (Mind Mapping) هو:",["توني بوزان","أبراهام ماسلو","جان بياجيه","فريدريك تايلور"],0,"طور توني بوزان الخرائط الذهنية كأداة بصرية لتنظيم المعلومات وتنشيط الذاكرة والإبداع."],[2,4,1,0,"يقيس 'مقياس تورانس للتفكير الإبداعي' (TTCT) أربع قدرات رئيسية هي:",["الطلاقة، والمرونة، والأصالة، والتفاصيل (الإفاضة)","القوة البدنية، والسرعة، والتوازن، والمرونة العضلية","الحفظ، والتلقين، والنسخ، والإملاء","الطول، والوزن، وضغط الدم، والنبض"],0,"يُعد مقياس تورانس الأداة الأشهر عالمياً لقياس الطلاقة والمرونة والأصالة والتفاصيل."],[2,4,1,0,"في أسلوب القبعات الست لإدوارد دي بونو، ترمز 'القبعة البيضاء' إلى:",["الحقائق والمعلومات والأرقام المحايدة","المشاعر والحدس والعواطف","المخاطر والسلبيات","الإبداع والأفكار الجديدة"],0,"القبعة البيضاء تمثل الحياد والموضوعية والتركيز على البيانات المتوفرة والناقصة."],[2,4,1,0,"البعد الذي يشير إلى المناخ التنظيمي والأسري والثقافي المحيط بالمبدع ضمن أبعاد الإبداع الأربعة (4Ps) هو:",["البيئة الضاغطة أو الداعمة (Press / Environment)","المنتج الإبداعي (Product)","السمات الشخصية (Person)","العملية العقلية (Process)"],0,"تتفاعل الأبعاد الأربعة (الشخص، العملية، البيئة، المنتج) لإنتاج الإبداع."],[2,4,1,0,"يرمز الحرف (M) في أداة سكامبر (SCAMPER) إلى:",["التعديل أو التكبير أو التصغير (Modify / Magnify / Minify)","الحفظ الآلي (Memorize)","الرفض (Miss)","التأجيل (Move)"],0,"حرف M يدفعنا للتساؤل: ماذا لو كبّرنا حجم المنتج، أو صغّرناه، أو عدّلنا لونه وشكله؟"],[2,4,1,0,"من قواعد التفكير الابتكاري المهمة لكسر الروتين الذهني:",["تحدي الافتراضات المسلم بها وطرح سؤال: ماذا لو؟","الالتزام بما اعتاد عليه الناس دون تغيير","رفض أي فكرة تبدو غير مألوفة للوهلة الأولى","الاعتماد على مصدر واحد للمعلومات"],0,"سؤال 'ماذا لو؟' هو المفتاح السحري لكسر القيود الذهنية واستكشاف احتمالات جديدة."],[2,4,1,0,"تبدأ الخريطة الذهنية عادةً بـ:",["فكرة مركزية وصورة معبرة في منتصف الصفحة تتفرع منها الفروع الرئيسية","قائمة نقطية مرقمة في أعلى يمين الصفحة","جدول حسابي في أسفل الصفحة","ملخص نصي طويل في نهاية الورقة"],0,"التصميم الإشعاعي من المركز إلى الأطراف يحاكي التفرعات العصبية في الدماغ."],[2,4,1,1,"شركة ألبان لاحظت انخفاض المبيعات في الرياض، فاقترح مدير التسويق استخدام 'القبعة الصفراء' أولاً في الاجتماع. ما نوع الأفكار المطلوبة تحت هذه القبعة؟",["التركيز على الفرص الإيجابية ونقاط القوة والمزايا التنافسية المتاحة في سوق الرياض","حصر جميع المخاطر والعقبات وأسباب الفشل","التعبير عن مشاعر الإحباط والقلق لدى فريق المبيعات","عرض جداول الأرقام فقط دون أي تعليق"],0,"القبعة الصفراء (كلون الشمس) تمثل التفكير الإيجابي البناء واستكشاف الفرص والمنافع الممكنة."],[2,4,1,1,"قيام مصنع للسيارات باستبدال الهيكل الفولاذي الثقيل بألياف الكربون خفيفة الوزن لزيادة السرعة وتقليل استهلاك الوقود يمثل في سكامبر:",["الاستبدال (Substitute)","الحذف (Eliminate)","القلب (Reverse)","التقليد الحرفي"],0,"تغيير المادة الخام بمادة ذات خصائص أفضل هو تطبيق مباشر لأداة الاستبدال (S)."],[2,4,1,1,"تحويل 'مظلة المطر' التقليدية لتصبح 'مظلة مقلوبة تُغلق للأعلى' بحيث تحبس قطرات الماء بداخلها ولا تبلل أرضية السيارة عند الدخول. هذا تطبيق لأداة:",["العكس أو القلب (Reverse / Rearrange)","الدمج (Combine)","التصغير (Minify)","الحذف (Eliminate)"],0,"عكس اتجاه فتح وإغلاق المظلة حلّ مشكلة بلل الملابس والسيارات، وهو تطبيق ذكي لأداة (R)."],[2,4,1,1,"استخدام مادة 'الأسبرين' الطبية (التي صُنعت أصلاً كمسكن للآلام) في الوقاية من الجلطات القلبية، وكذلك استخدام صودا الخبز كمعطر للثلاجات، يجسد أداة:",["الاستخدامات الأخرى (Put to other uses)","الحذف (Eliminate)","التصغير (Minify)","الجمود الوظيفي"],0,"اكتشاف وظائف ومجالات جديدة لمنتج قائم هو جوهر أداة (Put to other uses - P)."],[2,4,1,1,"في جلسة عصف ذهني لتطوير خدمات مكتبة جامعية، قال أحد الطلاب: 'لماذا لا نضع مقهى للكتب وحديقة قراءة مفتوحة؟' فرد زميله فوراً: 'هذه فكرة مكلفة ومستحيلة التنفيذ'. هذا الرد خالف قاعدة:",["تأجيل الحكم والنقد أثناء مرحلة التوليد","الكم يولد الكيف","التنظيم الزمني للجلسة","التفكير التقاربي"],0,"الحكم المسبق على التكلفة أو الصعوبة أثناء توليد الأفكار يوقف تدفق الإبداع ويثبط المشاركين."],[2,4,1,1,"في مقياس تورانس اللفظي، طُلب من طالبين ذكر استخدامات غير مألوفة لـ 'الطوب الأحمر'. ذكر الأول 20 استخداماً في البناء والرصف، وذكر الثاني 8 استخدامات تشمل: بناء، مرساة قارب، أداة تدليك، حامل كتب، وموقد تخييم. أيهما أعلى في 'المرونة' و'الأصالة'؟",["الطالب الثاني أعلى في المرونة والأصالة، بينما الأول أعلى في الطلاقة","الطالب الأول أعلى في جميع المهارات بلا استثناء","كلاهما متساوٍ في الأصالة والمرونة","الطالب الثاني لديه جمود وظيفي"],0,"الطالب الأول لديه وفرة عددية (طلاقة)، أما الثاني فانتقل بين مجالات مختلفة (مرونة) وقدم أفكاراً نادرة (أصالة)."],[2,4,1,1,"متى يُفضل استخدام تقنية 'العصف الذهني الكتابي' (Brainwriting) بدلاً من العصف الذهني الشفهي التقليدي؟",["عند وجود أفراد خجولين أو هيمنة شخص واحد على الحديث في المجموعة","عندما يكون عدد المشاركين شخصاً واحداً فقط","عند الرغبة في منع توليد الأفكار تماماً","عندما تكون المشكلة محلولة مسبقاً"],0,"العصف الذهني الكتابي يضمن مشاركة الجميع بالتساوي دون تأثير الهيبة الاجتماعية أو مقاطعة المتحدثين."],[2,4,1,1,"قام مصمم مطابخ بتقليص حجم غسالة الأطباق لتصبح بحجم محمصة الخبز وتوضع على الطاولة لتناسب السكن الطلابي. هذا يمثل في سكامبر:",["التعديل بالتصغير (Modify - Minify)","القلب والعكس (Reverse)","الاستخدامات الأخرى","الحذف الكامل"],0,"تغيير الأبعاد والحجم (التصغير أو التكبير) لتلبية احتياج شريحة جديدة يقع ضمن أداة التعديل (M)."],[2,4,1,1,"كيف تساعد 'القبعة الحمراء' في اتخاذ القرارات الابتكارية رغم أنها تمثل المشاعر والحدس؟",["تسمح للفريق بالتعبير السريع عن انطباعاتهم وحدسهم دون الحاجة لتبرير منطقي مطول","تفرض على الجميع إخفاء مشاعرهم تماماً","تستبدل البيانات المالية بالعواطف في كل مراحل المشروع","تمنع المناقشة الجماعية"],0,"إعطاء مساحة 30 ثانية للحدس والمشاعر يفرغ الشحنات العاطفية ويكشف القبول النفسي الأولي للفكرة."],[2,4,1,1,"استلهام المهندسين لتصميم مقدمة القطار الياباني فائق السرعة (شينكانسن) من منقار طائر 'الرفراف' لتقليل الضوضاء عند الخروج من الأنفاق يجسد أداة:",["التكييف والمحاكاة من الطبيعة (Adapt)","الحذف (Eliminate)","التفكير الخرافي","الجمود التنظيمي"],0,"استعارة حلول من الطبيعة أو مجالات أخرى وتكييفها لحل مشكلة هندسية هو تطبيق رائع لأداة (Adapt - A)."],[2,5,0,0,"تنقسم مهارات التفكير من حيث التعقيد إلى مهارات تفكير أساسية (دنيا) ومهارات تفكير عليا (مركبة) مثل التفكير الناقد والإبداعي.",["صح","خطأ"],0,"صحيح؛ تمهد المهارات الأساسية (كالملاحظة والمقارنة) الطريق لمهارات التفكير العليا المركبة."],[2,5,0,0,"يشير مصطلح 'التفكير فوق المعرفي' (Metacognition) إلى تفكير الفرد في تفكيره، أي وعيه بعملياته الذهنية وقدرته على مراقبتها وتنظيمها.",["صح","خطأ"],0,"صحيح؛ ما وراء المعرفة هو وعي المتعلم بكيفية تعلمه وتخطيطه ومراقبته وتقييمه لأدائه العقلي."],[2,5,0,0,"تتكون مهارات التفكير فوق المعرفي من ثلاث عمليات رئيسية هي: التخطيط، والمراقبة (التحكم)، والتقييم.",["صح","خطأ"],0,"صحيح؛ يخطط الفرد قبل المهمة، ويراقب فهمه أثناءها، ويقيم نتائجه واستراتيجياته بعدها."],[2,5,0,0,"في تصنيف بلوم المطور (Bloom's Revised Taxonomy)، يُعد مستوى 'الإبداع / الابتكار' (Creating) أعلى مستويات الهرم المعرفي.",["صح","خطأ"],0,"صحيح؛ يتربع الإبداع (الابتكار) على قمة هرم بلوم المطور فوق التقييم والتحليل والتطبيق والفهم والتذكر."],[2,5,0,0,"يُعد مستوى 'التذكر' (Remembering) أدنى مستويات تصنيف بلوم المعرفي ويقتصر على استرجاع المعلومات المحفوظة.",["صح","خطأ"],0,"صحيح؛ التذكر هو القاعدة الأساسية للهرم المعرفي ويمثل استدعاء الحقائق والتعريفات."],[2,5,0,0,"التفكير الناقد (Critical Thinking) يعني تصيد أخطاء الآخرين وانتقادهم بسلبية دون تقديم أدلة موضوعية.",["صح","خطأ"],1,"خطأ؛ التفكير الناقد هو فحص الأدلة والحجج بموضوعية للتمييز بين الصواب والخطأ والوصول لحكم منطقي سليم."],[2,5,0,0,"يتضمن مستوى 'التحليل' (Analyzing) في تصنيف بلوم تفكيك المادة أو المشكلة إلى عناصرها المكونة وإدراك العلاقات بينها.",["صح","خطأ"],0,"صحيح؛ التحليل هو تجزئة الكل إلى أجزائه لفهم البنية والعلاقات السببية."],[2,5,0,0,"يساعد 'التفكير التأملي' (Reflective Thinking) الفرد على مراجعة خبراته السابقة واستخلاص الدروس المستفادة منها لتحسين المستقبل.",["صح","خطأ"],0,"صحيح؛ التفكير التأملي هو وقفة مراجعة واعية لتقييم التجارب والأفعال والتعلم منها."],[2,5,0,0,"تسهم الأنشطة الإبداعية واللامنهجية مثل المسرح والألغاز الذهنية وكتابة القصص في تنمية مهارات التفكير العليا لدى الطلاب.",["صح","خطأ"],0,"صحيح؛ الأنشطة التفاعلية تحفز الخيال وحل المشكلات والتعبير الحر."],[2,5,0,0,"في تصنيف بلوم المطور، تم استبدال الأسماء بأفعال (مثل: يتذكر، يفهم، يطبق، يحلل، يقيم، يبتكر).",["صح","خطأ"],0,"صحيح؛ قام أندرسون وكراثوول بتحديث تصنيف بلوم عام 2001 باستخدام الأفعال للدلالة على النشاط المعرفي."],[2,5,0,1,"طالب يقرأ فصلاً صعباً في كتاب، فيلاحظ أنه لم يستوعب الفقرة الأخيرة، فيقرر التوقف وإعادة قراءتها ببطء وتلخيصها؛ هذا الطالب يمارس مهارة 'المراقبة فوق المعرفية'.",["صح","خطأ"],0,"صحيح؛ وعي الطالب بتشتت فهمه أثناء القراءة وتعديل استراتيجيته فوراً هو جوهر المراقبة الذاتية ما وراء المعرفية."],[2,5,0,1,"يختلف 'التفكير الناقد' عن 'التفكير الإبداعي' في أن الناقد تفكير تقاربي تقييمي يفحص صحة الأفكار، بينما الإبداعي تفكير تباعدي يولد أفكاراً جديدة.",["صح","خطأ"],0,"صحيح؛ يتكامل التفكير الناقد والإبداعي في حل المشكلات؛ الإبداعي يولّد البدائل والناقد يغربلها ويختار الأجود."],[2,5,0,1,"عندما يُكلف المعلم طلابه بـ 'تصميم نموذج أولي لتطبيق ذكي يحل مشكلة هدر الطعام'، فإنه يستهدف مستوى 'التذكر والفهم' في تصنيف بلوم.",["صح","خطأ"],1,"خطأ؛ التصميم والابتكار وبناء نموذج جديد يقع في أعلى قمة تصنيف بلوم وهو مستوى 'الإبداع / الابتكار' (Creating)."],[2,5,0,1,"مهارة 'التمييز بين الحقائق والآراء' و'كشف التحيز والمغالطات المنطقية' تُعد من أهم مهارات التفكير الناقد.",["صح","خطأ"],0,"صحيح؛ المفكر الناقد لا يقبل الادعاءات المرسلة بل يتحقق من مصدرها ويميز بين الحقيقة الثابتة والرأي الشخصي."],[2,5,0,1,"في تصنيف بلوم الأصلي (1956) كان مستوى 'التقويم' في القمة، أما في التصنيف المطور (2001) فأصبح 'الابتكار / الإبداع' في القمة.",["صح","خطأ"],0,"صحيح؛ هذا هو أبرز تعديل جوهري في تصنيف بلوم المطور حيث اعتُبر الإنتاج الإبداعي أرقى العمليات العقلية."],[2,5,0,1,"إعطاء موظف مكافأة استثنائية (كما في حالة 'علي' الذي اقترح فكرة وفرت تكاليف التشغيل) يعزز الربط بين التقييم فوق المعرفي والدافعية للابتكار.",["صح","خطأ"],0,"صحيح؛ تقدير المبادرات النوعية يرسخ ثقافة التفكير التحليلي والابتكاري لدى العاملين."],[2,5,0,1,"الاعتماد الكلي على اختبارات الاختيار من متعدد التي تقيس الحفظ فقط يرتقي بالطلاب إلى مستويات التحليل والتقويم والابتكار.",["صح","خطأ"],1,"خطأ؛ الأسئلة التي تقيس الاسترجاع الحرفي فقط تبقي المتعلم في أدنى مستويات بلوم (التذكر) ولا تنمي التفكير العليا."],[2,5,0,1,"يُعد 'الاستنتاج' (Inferring) مهارة معرفية تعني استخلاص نتائج غير مصرح بها مباشرة بناءً على قرائن وأدلة متوفرة.",["صح","خطأ"],0,"صحيح؛ الاستنتاج هو القراءة ما بين السطور والوصول لمعانٍ جديدة من المعطيات المتاحة."],[2,5,0,1,"تساعد أنشطة 'الألعاب الذهنية والألغاز وحل المشكلات المفتوحة' على تنمية المرونة الذهنية وكسر التثبيت الوظيفي.",["صح","خطأ"],0,"صحيح؛ المشكلات المفتوحة التي تقبل أكثر من حل تدرب العقل على التفكير التباعدي."],[2,5,0,1,"المتعلم الذي يمتلك مهارات 'ما وراء المعرفة' لا يحتاج إلى تقييم أدائه بعد انتهاء الاختبار لأن النتيجة تظهر تلقائياً.",["صح","خطأ"],1,"خطأ؛ التقييم الذاتي بعد المهمة (ما الذي نجح؟ وما الذي أحتاج لتعديله مستقبلاً؟) هو الركن الثالث الأساسي لما وراء المعرفة."],[2,5,1,0,"الترتيب التصاعدي الصحيح لمستويات تصنيف بلوم المطور (من الأدنى إلى الأعلى) هو:",["التذكر ← الفهم ← التطبيق ← التحليل ← التقييم ← الابتكار","الفهم ← التذكر ← التحليل ← التطبيق ← الابتكار ← التقييم","الابتكار ← التقييم ← التحليل ← التطبيق ← الفهم ← التذكر","التطبيق ← التذكر ← الفهم ← التقييم ← التحليل ← الابتكار"],0,"يبدأ هرم بلوم المطور بـ: التذكر، الفهم، التطبيق، التحليل، التقييم، وينتهي في القمة بـ الابتكار (الإبداع)."],[2,5,1,0,"يُعرَّف 'التفكير فوق المعرفي' (Metacognition) بأنه:",["وعي الفرد بعملياته التفكيرية وقدرته على التخطيط لها ومراقبتها وتقييمها","القدرة على حفظ أكبر قدر من الأرقام الهاتفية","سرعة الكتابة على لوحة المفاتيح","التفكير اللاواعي أثناء النوم"],0,"ما وراء المعرفة هو 'التفكير في التفكير' وإدارة الذات المعرفية بوعي."],[2,5,1,0,"المستوى الذي يتربع على قمة هرم بلوم المطور (2001) هو:",["الابتكار / الإبداع (Creating)","التذكر (Remembering)","التطبيق (Applying)","الفهم (Understanding)"],0,"الابتكار هو أعلى مستوى معرفي ويشمل التصميم والتأليف والإنتاج الأصيل."],[2,5,1,0,"من مهارات التفكير الناقد الأساسية:",["تقويم الحجج، والتمييز بين الحقائق والآراء، واكتشاف المغالطات","قبول كل ما يُنشر على وسائل التواصل دون تحقق","التسرع في إصدار الأحكام","تجاهل الأدلة المخالفة"],0,"التفكير الناقد يعتمد على الفحص الموضوعي للأدلة وتقييم مصداقية المصادر."],[2,5,1,0,"تتضمن مهارات التفكير فوق المعرفي ثلاث مراحل رئيسية هي:",["التخطيط، والمراقبة، والتقييم","الحفظ، والتسميع، والنسيان","القراءة، والكتابة، والإملاء","الجمع، والطرح، والقسمة"],0,"يدير الفرد تعلمه عبر التخطيط المسبق، والمراقبة أثناء التنفيذ، والتقييم الختامي."],[2,5,1,0,"استخدام القوانين والقواعد المتعلمة في حل مسائل ومواقف جديدة يمثل في تصنيف بلوم مستوى:",["التطبيق (Applying)","التذكر (Remembering)","التقويم النقدي","الابتكار"],0,"التطبيق هو توظيف المعرفة المجردة في مواقف عملية جديدة."],[2,5,1,0,"أي من المهارات التالية تُصنف ضمن مهارات التفكير العليا (المركبة)؟",["التفكير الناقد، والتفكير الإبداعي، وحل المشكلات، واتخاذ القرار","الملاحظة البسيطة فقط","النسخ الحرفي للنصوص","التعداد الآلي"],0,"تمثل هذه العمليات الأربع قمة مهارات التفكير العليا المركبة."],[2,5,1,0,"إصدار حكم على جودة منتج أو صحة نظرية بناءً على معايير محددة يمثل في تصنيف بلوم مستوى:",["التقييم / التقويم (Evaluating)","التذكر (Remembering)","الفهم (Understanding)","الملاحظة"],0,"التقييم هو إصدار أحكام معيارية مبررة حول قيمة الأفكار أو الحلول."],[2,5,1,0,"من الأنشطة التعليمية الفعالة لتنمية التفكير الإبداعي لدى الطلاب:",["العصف الذهني، ولعب الأدوار، وكتابة النهايات المفتوحة للقصص","نقل الدروس من السبورة طوال الحصة","منع الأسئلة أثناء الشرح","الاعتماد على كتاب واحد فقط"],0,"الأنشطة التشاركية والمفتوحة تحفز الخيال والمرونة التعبيرية."],[2,5,1,0,"تفسير الطالب للمفهوم العلمي بلغته الخاصة وتلخيصه يمثل في تصنيف بلوم مستوى:",["الفهم / الاستيعاب (Understanding)","الابتكار (Creating)","التحليل المركب","التقويم"],0,"إعادة الصياغة والتفسير والتلخيص تدل على انتقال المتعلم من مجرد التذكر إلى الفهم."],[2,5,1,1,"أمامك سؤالان: (أ) اذكر شروط البيئة الإبداعية. (ب) قارن بين أثر البيئة السلطوية والبيئة الديمقراطية على إنتاجية الموظفين مع الاستدلال. ما مستوى بلوم لكل سؤال على الترتيب؟",["السؤال (أ) التذكر، والسؤال (ب) التحليل والتقييم","السؤال (أ) الابتكار، والسؤال (ب) التذكر","كلاهما يقيس مستوى التذكر الحرفي","السؤال (أ) التطبيق، والسؤال (ب) الفهم البسيط"],0,"سرد النقاط المحفوظة يقيس التذكر، بينما المقارنة المعمقة والاستدلال تقيس التحليل والتقييم."],[2,5,1,1,"قبل البدء في المذاكرة للامتحان، قام عمر بتحديد أهدافه، وتقدير الوقت اللازم لكل مادة، واختيار أسلوب الخرائط الذهنية للمراجعة. عمر يطبق مهارة:",["التخطيط فوق المعرفي (Metacognitive Planning)","التفكير الخرافي","الحفظ الآلي غير الواعي","الجمود المعرفي"],0,"تحديد الاستراتيجية والزمن والأهداف قبل بدء التعلم هو الركن الأول لمهارات ما وراء المعرفة."],[2,5,1,1,"قرأ صحفي خبراً يقول: 'إن 90% من المستهلكين يفضلون هذا المنتج'، فتساءل الصحفي: 'كم كان حجم العينة؟ ومن موّل هذه الدراسة؟'. هذا التساؤل يعكس:",["التفكير الناقد وفحص مصداقية الأدلة","التفكير التواكلي","القبول الأعمى للإحصاءات","التفكير الحسي البسيط"],0,"المفكر الناقد لا ينبهر بالأرقام المجردة بل يفحص منهجية جمع البيانات ومصدرها."],[2,5,1,1,"في مشروع التخرج، طُلب من الطلاب: 'تحليل أسباب عزوف الشباب عن القراءة الورقية، ثم ابتكار حملة توعوية رقمية تفاعلية لمعالجة هذه الظاهرة'. يجمع هذا التكليف بين مستويي:",["التحليل (Analyzing) والابتكار (Creating)","التذكر والفهم فقط","التطبيق البسيط والتذكر","الحفظ والتسميع"],0,"تشخيص الأسباب هو تحليل، وتصميم حملة إبداعية جديدة هو ابتكار."],[2,5,1,1,"كيف يسهم 'التفكير التأملي' للمعلم بعد انتهاء الحصة الدراسية في تطوير أدائه المهني؟",["يجعله يراجع المواقف الصفية، ويحلل نقاط القوة والضعف في أسلوب شرحه ليطورها مستقبلاً","يجعله يكرر نفس الأخطاء في الحصص القادمة","يلغي حاجته للتحضير المسبق","يركز على لوم الطلاب فقط"],0,"التأمل المهني هو أداة المعلم والمبدع للتعلم المستمر من الممارسة العملية."],[2,5,1,1,"عند اتخاذ قرار استراتيجي مصيري في شركة، ما الترتيب الأمثل لتكامل مهارات التفكير العليا؟",["التحليل لفهم المشكلة ← التفكير الإبداعي لتوليد البدائل ← التفكير الناقد لتقييم البدائل واختيار الأفضل","اختيار أول حل عشوائي ← إهمال التحليل ← منع النقد","التفكير الناقد لإلغاء جميع الأفكار ← التوقف عن العمل","الحفظ الآلي للوائح القديمة دون تعديل"],0,"هذا التسلسل يجمع بين التحليل الدقيق والتوليد الإبداعي والغربلة النقدية للوصول لأفضل قرار."],[2,5,1,1,"أي من الأفعال التالية يُستخدم لصياغة هدف تعليمي يقيس مستوى 'التقييم' (Evaluating) في تصنيف بلوم؟",["ينقد، يبرر، يحكم على، يفاضل بين","يعدد، يذكر، يعرف، يسمي","ينسخ، يكرر، يردد","يرسم دائرة، يلون"],0,"الأفعال (ينقد، يبرر، يحكم، يفاضل) تتطلب إصدار حكم قائم على معايير موضوعية."],[2,5,1,1,"بعد انتهاء طالبة من حل اختبار صعب، جلست تراجع أخطاءها وتسأل نفسها: 'هل أخطأت بسبب التسرع في قراءة السؤال أم بسبب نقص الفهم؟'. هذه العملية تُسمى:",["التقييم فوق المعرفي (Metacognitive Evaluation)","التفكير الخرافي","التذكر الحسي اللحظي","التقليد الاجتماعي"],0,"تشخيص أسباب النجاح والإخفاق الذاتي بعد إنجاز المهمة هو جوهر التقييم ما وراء المعرفي."],[2,5,1,1,"في نشاط 'بناء برج من أعواد المعكرونة وشريط لاصق لحمل قطعة حلوى في القمة'، ما القيمة التربوية لهذا النشاط الإبداعي؟",["تنمية العمل الجماعي، والتفكير الهندسي، والتعلم السريع من التجربة والخطأ","قياس قدرة الطلاب على حفظ القوانين الفيزيائية نصاً","تعويد الطلاب على العمل الفردي المنعزل","اختبار قوة البصر فقط"],0,"تحدي المارشميلو الشهير ينمي التفكير التصميمي والتعاون والمرونة في تعديل النماذج الأولية."],[2,5,1,1,"ما الفارق الجوهري بين 'المعرفة' (Cognition) و'ما وراء المعرفة' (Metacognition)؟",["المعرفة هي اكتساب المعلومات وفهمها، بينما ما وراء المعرفة هي إدارة ومراقبة كيفية اكتساب تلك المعلومات","المعرفة خاصة بالعلوم، وما وراء المعرفة خاصة بالرياضة فقط","ما وراء المعرفة أقل أهمية من الحفظ الآلي","لا يوجد أي فرق وظيفي بينهما"],0,"المعرفة تجعلك تفهم الدرس، وما وراء المعرفة تجعلك تدرك متى فهمت، ومتى تعثرت، وكيف تعالج تعثرك."],[3,0,0,0,"تُعرف محاسبة التكاليف بأنها أحد فروع المحاسبة وكأداة تحليلية تحكمها مجموعة من المبادئ والأسس العلمية لقياس تكلفة المنتج والرقابة عليها.",["صح","خطأ"],0,"عبارة صحيحة؛ محاسبة التكاليف فرع تحليلي من علم المحاسبة يطبق أسساً علمية لتتبع وتسجيل وتحليل التكاليف وقياسها والرقابة عليها وترشيد القرارات."],[3,0,0,0,"يقتصر تطبيق محاسبة التكاليف على المنشآت الصناعية فقط دون غيرها من الأنشطة الخدمية أو التجارية.",["صح","خطأ"],1,"عبارة خاطئة؛ تمتد تطبيقات محاسبة التكاليف لتشمل كافة الأنشطة الاقتصادية: الصناعية، والتجارية، والخدمية (كالمستشفيات والجامعات والبنوك)، والزراعية."],[3,0,0,0,"تعد المحاسبة المالية بمثابة (المحاسبة الأم) التي تمد محاسبة التكاليف بالبيانات الإجمالية للمشتريات والأجور وتعتبر أداة رقابية على دقتها.",["صح","خطأ"],0,"عبارة صحيحة؛ تتكامل المحاسبة المالية مع محاسبة التكاليف، حيث تمد المالية التكاليف بالبيانات الإجمالية المسجلة من واقع المستندات وتعمل كأداة رقابية عليها."],[3,0,0,0,"تقدم محاسبة التكاليف للمحاسبة المالية البيانات الخاصة بتكلفة مخزون آخر الفترة وتكلفة البضاعة المباعة لإعداد القوائم الختامية.",["صح","خطأ"],0,"عبارة صحيحة؛ تعتمد المحاسبة المالية على مخرجات محاسبة التكاليف لتحديد تكلفة الصنع والبضاعة المباعة (لقائمة الدخل) وتكلفة المخزون السلعي (لقائمة المركز المالي)."],[3,0,0,0,"تركز المحاسبة المالية في تقاريرها على توفير البيانات في صورة تفصيلية وتحليلية لكل منتج وكل قسم على حدة.",["صح","خطأ"],1,"عبارة خاطئة؛ المحاسبة المالية تركز على البيانات الإجمالية للمنشأة كوحدة واحدة، بينما تهتم محاسبة التكاليف بالتحليل التفصيلي لكل منتج أو مركز تكلفة."],[3,0,0,0,"يجب أن تكون فترة المحاسبة عن التكاليف أقل من سنة مالية (مثل يوم أو أسبوع أو شهر أو ربع سنة) لخدمة أغراض الرقابة الفورية.",["صح","خطأ"],0,"عبارة صحيحة؛ على عكس المحاسبة المالية التي تُعد سنوياً، تُعد تقارير التكاليف عن فترات قصيرة (أسبوعية أو شهرية) لتمكين الإدارة من الرقابة السريعة وتصحيح الانحرافات."],[3,0,0,0,"يُعرف مركز التكلفة بأنه دائرة نشاط معين متجانس أو خدمات متجانسة ينتج عنها منتج متميز أو خدمة متميزة قابلة للقياس وتخضع لمسؤولية شخص محدد.",["صح","خطأ"],0,"عبارة صحيحة؛ تقسيم المنشأة إلى مراكز تكلفة متجانسة تحت مسؤولية مشرف محدد هو حجر الأساس لإحكام الرقابة وتطبيق محاسبة المسؤولية."],[3,0,0,0,"تُعرف وحدة التكلفة بأنها الوحدة التي تُنسب إليها عناصر التكاليف وتُتخذ أساساً لحساب تكلفة الإنتاج وإعداد التقارير.",["صح","خطأ"],0,"عبارة صحيحة؛ وحدة التكلفة هي وحدة القياس النهائية (مثل: طن، متر، قطعة، ساعة خدمة) التي تُجمع وتُحمل عليها التكاليف."],[3,0,0,0,"يتم نشر المعلومات والتقارير الخاصة بمحاسبة التكاليف للجمهور والجهات الخارجية في الصحف الرسمية أسوة بالقوائم المالية.",["صح","خطأ"],1,"عبارة خاطئة؛ تقارير محاسبة التكاليف سرية وداخلية قاصرة على إدارة المنشأة فقط لأنها تتضمن أسرار الإنتاج والتسعير."],[3,0,0,0,"تعتمد محاسبة التكاليف على البيانات المالية (النقدية) والبيانات الكمية (العينية) معاً لخدمة الإدارة الداخلية.",["صح","خطأ"],0,"عبارة صحيحة؛ لا تقتصر محاسبة التكاليف على القيم النقدية فقط، بل تهتم بالكميات (عدد الوحدات، ساعات العمل، كيلوجرامات المواد) لإحكام الرقابة."],[3,0,0,1,"تتحرر محاسبة التكاليف نسبياً من القيود الصارمة للمبادئ المحاسبية المتعارف عليها (GAAP) مقارنة بالمحاسبة المالية، مما يسمح لها بالاعتراف بتكلفة الفرصة البديلة.",["صح","خطأ"],0,"عبارة صحيحة؛ نظراً لأن محاسبة التكاليف تخدم الإدارة الداخلية لاتخاذ القرارات، فهي أكثر مرونة وتعترف بالتكاليف الضمنية وتكلفة الفرصة البديلة، بعكس المحاسبة المالية المقيدة بالموضوعية والمستندات."],[3,0,0,1,"يتأثر تصميم المجموعة الدفترية في نظام التكاليف بنظرية تحميل التكاليف المتبعة في المنشأة (كلية أم متغيرة أم مباشرة).",["صح","خطأ"],0,"عبارة صحيحة؛ ففي الطريقة الكلية والمباشرة تُحلل الدفاتر التكاليف إلى مباشرة وغير مباشرة، بينما في الطريقة المتغيرة والمستغلة تُحلل إلى مرنة (متغيرة) وغير مرنة (ثابتة)."],[3,0,0,1,"تقتصر أنواع التقارير التي يصممها محاسب التكاليف كنتاج نهائي للنظام على قوائم قياس تكاليف الإنتاج التام فقط.",["صح","خطأ"],1,"عبارة خاطئة؛ يصمم محاسب التكاليف 3 أنواع رئيسية من التقارير: (1) قوائم قياس التكاليف، (2) تقارير الرقابة، (3) تقارير ترشيد القرارات الإدارية."],[3,0,0,1,"بوّب النظام المحاسبي الموحد مراكز التكاليف بالمنشآت إلى خمس مجموعات رئيسية بحسب الوظائف التي تؤديها.",["صح","خطأ"],0,"عبارة صحيحة؛ وهي: مراكز الإنتاج، مراكز الخدمات الإنتاجية، مراكز الخدمات التسويقية، مراكز الخدمات الإدارية والتمويلية، ومراكز العمليات الرأسمالية."],[3,0,0,1,"تتحقق الرقابة على التكاليف من خلال مقارنة التكاليف الفعلية للفترة الحالية بالتكاليف المعيارية أو بتكاليف فترات سابقة لتحديد الانحرافات.",["صح","خطأ"],0,"عبارة صحيحة؛ الرقابة تعني التأكد من كفاءة استخدام الموارد ومنع الإسراف عبر مقارنة الأداء الفعلي بالمعايير المحددة مسبقاً أو الفترات السابقة."],[3,0,0,1,"تعتبر البيانات التي تقدمها المحاسبة المالية لمحاسبة التكاليف مجرد بيانات تقديرية غير موثقة مستندياً.",["صح","خطأ"],1,"عبارة خاطئة؛ بيانات المحاسبة المالية تتميز بالموضوعية وإمكانية التحقق من سلامتها ودقتها من واقع المستندات الفعلية للتعامل مع الغير."],[3,0,0,1,"باختلاف وحدات التكلفة من صناعة لأخرى (مثل صناعة الأسمنت مقابل صناعة الأثاث) يختلف تصميم نظام التكاليف والحسابات الواجب إمساكها.",["صح","خطأ"],0,"عبارة صحيحة؛ تحديد وحدة التكلفة هو الخطوة الأولى في تصميم النظام، واختلاف طبيعة المنتج (مراحل مستمرة أم أوامر إنتاجية) يغير هيكل السجلات والدليل."],[3,0,0,1,"ترتبط محاسبة التكاليف بالعملية التخطيطية من خلال توفير البيانات التحليلية اللازمة لإعداد الموازنات التخطيطية.",["صح","خطأ"],0,"عبارة صحيحة؛ الموازنة التخطيطية هي ترجمة مالية وكمية للخطط المستقبلية، وتمدها محاسبة التكاليف بالبيانات التاريخية والحالية والتنبؤية."],[3,0,0,1,"تتمثل المشكلة الأساسية عند تحقيق هدف تحديد تكلفة كل منتج بدقة في قياس التكاليف المباشرة التي يسهل تتبعها عينياً.",["صح","خطأ"],1,"عبارة خاطئة؛ التكاليف المباشرة يسهل قياسها وتتبعها بدقة، بينما تكمن المشكلة الحقيقية في توزيع وتخصيص التكاليف غير المباشرة المشتركة على المنتجات."],[3,0,0,1,"تشترك كل من المحاسبة المالية ومحاسبة التكاليف في الاعتماد على المستندات كمصدر واحد وأساسي للبيانات الفعلية.",["صح","خطأ"],0,"عبارة صحيحة؛ كلا الفرعين يستقي بياناته الأولية من الدورة المستندية للمنشأة (فواتير شراء، أذون صرف، بطاقات وقت)."],[3,0,1,0,"كان الهدف التقليدي والأقدم لمحاسبة التكاليف عند نشأتها هو:",["تحديد تكلفة وحدة المنتج أو النشاط","توفير معلومات للتخطيط الاستراتيجي","إعداد القوائم المالية المنشورة للمساهمين","تقييم أداء المديرين التنفيذيين"],0,"نشأت محاسبة التكاليف تقليدياً بهدف رئيسي وهو قياس وتحديد تكلفة كل منتج على حدة لتسعيره وتقييم المخزون، ثم تطورت لتشمل الرقابة والتخطيط واتخاذ القرارات."],[3,0,1,0,"ينحصر البعد الزمني للبيانات التي تعتمد عليها محاسبة التكاليف في:",["الماضي والحاضر والمستقبل","الماضي فقط (بيانات تاريخية)","المستقبل فقط (بيانات تقديرية)","الحاضر فقط"],0,"تجمع محاسبة التكاليف بين الماضي (التكاليف الفعلية)، والحاضر (الرقابة الجارية)، والمستقبل (الموازنات التخطيطية واتخاذ القرارات)."],[3,0,1,0,"أي مما يلي لا يُعد من الأهداف الرئيسية لمحاسبة التكاليف؟",["تحديد نتيجة أعمال المنشأة الكلية والمركز المالي للجهات الخارجية","تحديد تكلفة كل منتج أو خدمة على حدة","مساعدة الإدارة في إحكام الرقابة على التكاليف","ترشيد القرارات الإدارية وتوفير بيانات الموازنات"],0,"تحديد نتيجة أعمال المنشأة ككل (ربح أو خسارة) ومركزها المالي للجهات الخارجية هو الهدف الأساسي للمحاسبة المالية وليس محاسبة التكاليف."],[3,0,1,0,"الخطوة الأولى في تصميم النظام المحاسبي للتكاليف تتمثل في إعداد:",["دليل وحدات التكلفة (وحدات الإنتاج النهائية)","قائمة المركز المالي الختامية","تقارير الانحرافات المعيارية","قائمة التدفقات النقدية"],0,"تبدأ خطوات تصميم نظام التكاليف بتحديد وحصر المنتجات النهائية واختيار وحدة قياسها الفنية (دليل وحدة التكلفة)."],[3,0,1,0,"أي من الجهات التالية يُعد المستخدم الأساسي لمخرجات وتقارير محاسبة التكاليف؟",["الإدارة الداخلية للمنشأة بمستوياتها المختلفة","مصلحة الضرائب والجهات الحكومية","البنوك والمقرضون والدائنون","المستثمرون الحاليون والمرتقبون في البورصة"],0,"محاسبة التكاليف تخدم المستخدم الداخلي (إدارة المنشأة) في المقام الأول لمساعدتها في التخطيط والرقابة واتخاذ القرارات."],[3,0,1,0,"من المقومات الأساسية لنظام المحاسبة عن التكاليف:",["جميع ما يلي (دليل وحدات التكلفة، دليل مراكز التكلفة، دليل عناصر التكاليف)","دليل وحدات التكلفة فقط","دليل مراكز التكلفة فقط","دليل عناصر التكاليف فقط"],0,"يقوم نظام التكاليف على مقومات متكاملة تشمل الأدلة الثلاثة (الوحدات، المراكز، العناصر) بالإضافة للدورة المستندية والدفترية والتقارير ونظرية التحميل."],[3,0,1,0,"تنقسم عناصر التكاليف في دليل العناصر إلى ثلاث مجموعات نوعية رئيسية هي:",["عنصر تكلفة المواد، عنصر تكلفة العمالة (الأجور)، عنصر تكلفة الخدمات","أصول متداولة، أصول ثابتة، خصوم","إيرادات، مصروفات، مسحوبات","تكاليف غارقة، تكاليف ضمنية، تكاليف تفاضلية"],0,"التقسيم النوعي لعناصر التكاليف في الدليل يصنفها حسب طبيعتها إلى: مواد، وأجور (عمالة)، وخدمات (مصروفات أخرى)."],[3,0,1,0,"يمكن أن تكون الفترة المحاسبية التي تُعد عنها تقارير محاسبة التكاليف:",["جميع ما يلي (يوماً، أسبوعاً، شهراً، ربع سنة)","سنة مالية كاملة 12 شهراً فقط","خمس سنوات مالية","لا ترتبط بفترة زمنية محددة"],0,"تتسم تقارير التكاليف بالدورية القصيرة (يومية، أسبوعية، شهرية) لتوفير تغذية عكسية سريعة للإدارة."],[3,0,1,0,"كانت البداية الحقيقية والانطلاقة الكبرى للمحاسبة عن التكاليف مع قيام:",["الثورة الصناعية","الثورة الزراعية","الثورة الرقمية","اكتشاف الطباعة"],0,"ظهرت الحاجة الملحة لمحاسبة التكاليف مع قيام الثورة الصناعية وظهور المصانع الكبيرة وتعدد المنتجات والحاجة لحساب تكلفة الإنتاج."],[3,0,1,0,"تُعد عملية اتخاذ القرارات جوهر العملية الإدارية، وتساهم محاسبة التكاليف فيها من خلال:",["توفير البيانات التفاضلية والملائمة للمفاضلة بين البدائل المتاحة","اتخاذ القرار نيابة عن المدير العام","نشر القوائم المالية في الجريدة الرسمية","تسجيل قيود اليومية الإجمالية فقط"],0,"دور محاسب التكاليف هو توفير المعلومات الملائمة والتحليلية لكل بديل لمساعدة الإدارة في المفاضلة واختيار البديل الأمثل."],[3,0,1,1,"عند مقارنة المحاسبة المالية بمحاسبة التكاليف من حيث (الموضوعية مقابل الملاءمة)، نجد أن:",["المحاسبة المالية تركز على الموضوعية وقابلية التحقق، بينما تركز محاسبة التكاليف على الملاءمة لاتخاذ القرار","محاسبة التكاليف ترفض البيانات التقديرية وتلتزم بالمستندات التاريخية فقط","المحاسبة المالية تعتمد على التقديرات المستقبلية أكثر من المستندات","كلاهما يلتزم بنفس القواعد القانونية دون أي اختلاف"],0,"المحاسبة المالية تخدم أطرافاً خارجية لذا تشترط الموضوعية والتوثيق المستندي، أما محاسبة التكاليف فتخدم الإدارة الداخلية لذا تركز على ملاءمة المعلومة وسرعتها."],[3,0,1,1,"أي من المراكز التالية لا يندرج ضمن تصنيف النظام المحاسبي الموحد لمراكز التكاليف الوظيفية؟",["مراكز التصفية القضائية","مراكز الإنتاج","مراكز الخدمات الإنتاجية","مراكز العمليات الرأسمالية"],0,"حدد النظام المحاسبي الموحد 5 مجموعات لمراكز التكلفة: الإنتاج، الخدمات الإنتاجية، الخدمات التسويقية، الخدمات الإدارية والتمويلية، والعمليات الرأسمالية."],[3,0,1,1,"لماذا يُشترط عند تقسيم المنشأة إلى مراكز تكلفة أن يكون كل مركز تحت مسؤولية شخص معين؟",["لتطبيق مبدأ محاسبة المسؤولية وإحكام الرقابة على عناصر التكاليف","لزيادة عدد المديرين في الهيكل التنظيمي","لتسهيل نشر التقارير في البورصة","لإلغاء الحاجة إلى الدورة المستندية"],0,"ربط كل مركز تكلفة بشخص مسؤول يتيح مساءلته عن التكاليف الخاضعة لرقابته وتحقيق الرقابة الفعالة."],[3,0,1,1,"الفرق الجوهري بين (وحدة التكلفة) و(مركز التكلفة) يتمثل في أن:",["مركز التكلفة هو دائرة نشاط أو قسم تُجمع فيه التكاليف، بينما وحدة التكلفة هي وحدة القياس النهائية للمنتج أو الخدمة","وحدة التكلفة أكبر من مركز التكلفة وتضم عدة مصانع","مركز التكلفة يُستخدم في المصانع فقط ووحدة التكلفة في البنوك فقط","لا يوجد أي فرق بين المصطلحين"],0,"تُجمع التكاليف أولاً في مراكز التكلفة (الأقسام)، ثم تُحمل وتُقاس على أساس وحدات التكلفة (الوحدات المنتجة)."],[3,0,1,1,"تظهر حلقة الوصل المباشرة بين مخرجات محاسبة التكاليف وقائمة المركز المالي في المحاسبة المالية من خلال:",["تحديد تكلفة المخزون السلعي (مواد خام، تحت التشغيل، إنتاج تام) في نهاية الفترة","تحديد قيمة رأس المال المدفوع","تحديد رصيد القروض طويلة الأجل","تحديد توزيعات الأرباح للمساهمين"],0,"المخزون السلعي بأنواعه الثلاثة يظهر ضمن الأصول المتداولة في قائمة المركز المالي، وتقوم محاسبة التكاليف بحساب تكلفته بدقة."],[3,0,1,1,"تظهر حلقة الوصل المباشرة بين مخرجات محاسبة التكاليف وقائمة الدخل في المحاسبة المالية من خلال:",["تحديد تكلفة الصنع وتكلفة البضاعة المباعة خلال الفترة","تحديد إيرادات الاستثمارات في الأوراق المالية","تحديد فوائد السندات الحكومية","تحديد ضريبة الدخل المؤجلة"],0,"تمد محاسبة التكاليف المحاسبة المالية بتكلفة الإنتاج التام المباع التي تُطرح من إيراد المبيعات في قائمة الدخل للوصول لمجمل الربح."],[3,0,1,1,"يتوقف تصميم المجموعة الدفترية والسجلات في نظام محاسبة التكاليف على عدة عوامل ليس من بينها:",["عدد المساهمين في الجمعية العمومية للشركة","إمكانيات المنشأة وحجم معاملاتها","تعدد المنتجات ومدى تكرار العمليات الإنتاجية","طريقة تحميل التكاليف المتبعة في المنشأة"],0,"يتأثر تصميم الدفاتر بحجم المنشأة، وتعدد منتجاتها، وتكرار عملياتها، ونظرية التحميل المتبعة، ولا علاقة له بعدد المساهمين."],[3,0,1,1,"أي من التقارير التالية يصممه محاسب التكاليف خصيصاً لتحقيق الرقابة المحاسبية على عوامل الإنتاج (المواد والعمالة والآلات)؟",["تقارير الرقابة ومقارنة الأداء الفعلي بالمعياري","قائمة المركز المالي المجمعة","تقرير مجلس الإدارة السنوي","نشرة الاكتتاب العام"],0,"تقارير الرقابة هي أحد الأنواع الثلاثة لتقارير التكاليف، وتهدف لكشف الإسراف والانحرافات في استخدام عوامل الإنتاج."],[3,0,1,1,"تُعبر العلاقة بين المحاسبة المالية ومحاسبة التكاليف بأنها علاقة:",["تكامل وتبادل للمعلومات حيث يكمل كل منهما الآخر","تعارض وتنافس لإلغاء أحدهما","تطابق تام في الأهداف والتقارير والفترة الزمنية","انفصال تام دون أي تبادل للبيانات"],0,"المحاسبة المالية ومحاسبة التكاليف فرعان متكاملان؛ فالمالية تعطي التكاليف الإجماليات والتكاليف تعطي المالية تكلفة المبيعات والمخزون."],[3,0,1,1,"لماذا تُعد الرقابة بهدف تخفيض التكاليف ضرورة حتمية في بيئة الأعمال المعاصرة؟",["لأن التكاليف تتجه للتزايد المستمر، وتحقيق الكفاءة في استخدام الموارد هو السبيل لزيادة الأرباح والمنافسة","لأن القوانين تمنع زيادة أسعار البيع نهائياً","لأن المحاسبة المالية لا تسجل المصروفات","لتقليل عدد التقارير المقدمة للإدارة"],0,"مع اشتداد المنافسة وارتفاع أسعار عوامل الإنتاج، يصبح ضبط التكاليف ومنع الهدر الركيزة الأساسية لتحقيق الربحية."],[3,1,0,0,"تُعرف التكلفة بأنها التضحية بالموارد الاقتصادية المتاحة للمنشأة من أجل تحقيق منفعة أو منافع محددة، وتُقاس نقدياً.",["صح","خطأ"],0,"عبارة صحيحة؛ أركان مفهوم التكلفة هي: التضحية بموارد اقتصادية، القابلية للقياس النقدي، وتوقع الحصول على منفعة."],[3,1,0,0,"يقصد بمفهوم التكلفة التضحية بالموارد الاقتصادية القابلة للقياس العيني فقط دون النقدي.",["صح","خطأ"],1,"عبارة خاطئة؛ يشترط في التكلفة قابليتها للقياس النقدي (المالي) حتى يمكن تسجيلها وإدراجها في القوائم."],[3,1,0,0,"النفقة هي التضحية بالموارد المالية والتي ينتج عنها نقص في الأصول أو زيادة في الخصوم لغرض تحقيق منافع اقتصادية محددة.",["صح","خطأ"],0,"عبارة صحيحة؛ النفقة ترتبط بتدفق مالي فعلي أو التزام (نقص نقدية/أصول أو زيادة التزامات/خصوم) مقابل منفعة."],[3,1,0,0,"تعتبر التكلفة أوسع مفهوماً من النفقة، لأن التكلفة تشمل الموارد الاقتصادية المدفوعة وكذلك التضحيات المحتسبة كتكلفة الفرصة البديلة.",["صح","خطأ"],0,"عبارة صحيحة؛ كل نفقة مدفوعة لغرض النشاط هي تكلفة، ولكن ليست كل تكلفة نفقة، لأن التكلفة تشمل التكاليف الضمنية المحتسبة غير المدفوعة."],[3,1,0,0,"المصروف هو ذلك الجزء المستنفد من التكلفة خلال الفترة والذي حقق الغرض المحدد له وتمت مقابلته بالإيراد في قائمة الدخل.",["صح","خطأ"],0,"عبارة صحيحة؛ التكلفة المستنفدة التي تولد إيراداً تتحول إلى مصروف يظهر في قائمة الدخل."],[3,1,0,0,"الخسارة هي تكلفة مستنفدة أُنفقت بدون الحصول على أي مقابل أو عائد أو منفعة اقتصادية.",["صح","خطأ"],0,"عبارة صحيحة؛ الفرق الجوهري بين المصروف والخسارة أن المصروف يقابله إيراد أو منفعة، أما الخسارة فتستنفد دون عائد (مثل تلف الخامات أو الحريق)."],[3,1,0,0,"التكلفة غير المستنفدة هي التي لم يتحقق الغرض منها بتوليد الإيراد بعد، ويُنتظر ذلك مستقبلاً، لذا تظهر كأصل في قائمة المركز المالي.",["صح","خطأ"],0,"عبارة صحيحة؛ مثل الآلات والمخزون السلعي في نهاية الفترة؛ فهي منافع مؤجلة للمستقبل وتُدرج ضمن الأصول."],[3,1,0,0,"تتحول تكلفة الأصل الثابت (كالآلة) بالكامل إلى مصروف بمجرد شرائه أو بدء استخدامه في العملية الإنتاجية.",["صح","خطأ"],1,"عبارة خاطئة؛ يتحول إلى مصروف فقط الجزء المستنفد منه سنوياً (قسط الإهلاك)، بينما يظل الجزء غير المستنفد أصلاً بالميزانية."],[3,1,0,0,"يتم تبويب عناصر التكاليف نوعياً (طبيعياً) إلى: مواد، وأجور عمال، وخدمات أخرى، بغض النظر عن الوظيفة التي أُنفقت من أجلها.",["صح","خطأ"],0,"عبارة صحيحة؛ التبويب النوعي ينظر لطبيعة العنصر ذاته (مادة، عمل بشري، خدمة) وليس للقسم الذي استخدمه."],[3,1,0,0,"يتم تبويب عناصر التكاليف وظيفياً إلى: تكاليف إنتاجية (صناعية)، وتكاليف تسويقية، وتكاليف إدارية وتمويلية.",["صح","خطأ"],0,"عبارة صحيحة؛ التبويب الوظيفي يربط التكلفة بالوظيفة الرئيسية التي حدثت من أجلها داخل المنشأة."],[3,1,0,1,"كل مصروف هو في أصله تكلفة، ولكن ليست كل تكلفة بمثابة مصروف خلال الفترة المحاسبية الواحدة.",["صح","خطأ"],0,"عبارة صحيحة؛ لأن التكلفة قد تكون مستنفدة مقابل إيراد (فتصبح مصروفاً)، أو غير مستنفدة (فتبقى أصلاً بالميزانية)، أو مستنفدة بلا عائد (فتصبح خسارة)."],[3,1,0,1,"عندما يكون تغليف الجبن بورق معدني ضرورة فنية تفرضها طبيعة تصنيع المنتج وحفظه وفق المواصفات، تُعد تكلفة الورق تكلفة تسويقية.",["صح","خطأ"],1,"عبارة خاطئة؛ التغليف الأولي اللازم لإتمام تصنيع المنتج وحفظه وفق المواصفات الفنية يُعد تكلفة صناعية (إنتاجية)، أما التغليف الخارجي للعرض والبيع فيُعد تكلفة تسويقية."],[3,1,0,1,"يمكن أن تتحول التكلفة إلى مصروف فوري بمجرد سدادها والحصول على منفعتها في نفس الفترة دون المرور بمرحلة التخزين.",["صح","خطأ"],0,"عبارة صحيحة؛ مثل إيجار المعارض التسويقية أو مرتبات الإدارة؛ فهي تستنفد فورياً في نفس الفترة وتُحمل على قائمة الدخل."],[3,1,0,1,"تُسمى العملية المحاسبية لتعيين التكاليف المباشرة لوحدة المنتج (تتبع التكلفة)، بينما تُسمى عملية تعيين التكاليف غير المباشرة (تخصيص التكلفة).",["صح","خطأ"],0,"عبارة صحيحة؛ التكاليف المباشرة يتم تتبعها بدقة إلى غرض التكلفة، أما التكاليف غير المباشرة المشتركة فيتم تخصيصها (توزيعها) باستخدام أسس تحميل مناسبة."],[3,1,0,1,"إذا كان عنصر التكلفة ضئيل القيمة جداً (كالخيط أو الغراء في صناعة الأثاث) فإنه يُعامل عملياً كتكلفة غير مباشرة استناداً لمعيار الأهمية النسبية.",["صح","خطأ"],0,"عبارة صحيحة؛ رغم إمكانية تتبع الخيط أو الغراء عينياً، إلا أن ضآلة قيمته تجعل تكلفة تتبعه بدقة أكبر من العائد، فيُعامل كتكلفة غير مباشرة طبقاً للأهمية النسبية."],[3,1,0,1,"التكاليف الخاضعة للتحكم هي تلك التكاليف التي يمكن لمدير مركز مسؤولية معين أن يؤثر فيها زيادة أو نقصاناً خلال فترة معينة.",["صح","خطأ"],0,"عبارة صحيحة؛ ترتكز محاسبة المسؤولية على التمييز بين التكاليف القابلة للتحكم من قبل المدير وتلك غير القابلة للتحكم (المفروضة من مستويات أعلى)."],[3,1,0,1,"تبرز أهمية التبويب النوعي لعناصر التكاليف في تمكين الإدارة من معرفة الأهمية النسبية لكل عنصر (مواد/أجور/خدمات) عند وضع برامج خفض التكاليف.",["صح","خطأ"],0,"عبارة صحيحة؛ يوضح التبويب النوعي أين تتركز أموال المنشأة (هل في الخامات أم الأجور أم الخدمات) لتوجيه جهود الترشيد للعنصر الأكبر وزناً."],[3,1,0,1,"تتضمن كل وظيفة من الوظائف الرئيسية الثلاث (الإنتاج، التسويق، الإدارة) عناصر التكاليف النوعية الثلاثة (مواد، أجور، خدمات).",["صح","خطأ"],0,"عبارة صحيحة؛ فوظيفة التسويق مثلاً تحتاج مواد (أدوات تغليف)، وأجور (عمولات ومرتبات مندوبي البيع)، وخدمات (إعلان ونقل)."],[3,1,0,1,"يُعتبر المبلغ المدفوع في شراء مواد خام لم تُستخدم بعد في الإنتاج بمثابة مصروف فترة يُخصم فوراً في قائمة الدخل.",["صح","خطأ"],1,"عبارة خاطئة؛ المواد الخام المشتراة تمثل تكلفة غير مستنفدة (أصل متداول - مخزون مواد) وتظهر في قائمة المركز المالي لحين استخدامها وبيع المنتج."],[3,1,0,1,"تقتصر المنافع التي تحصل عليها المنشأة مقابل التكلفة على المنافع المادية الملموسة فقط كالسلع والآلات.",["صح","خطأ"],1,"عبارة خاطئة؛ تشمل المنافع الاقتصادية منافع ملموسة (مواد، آلات) ومنافع غير ملموسة (خدمات الصيانة، التدريب، الحملات الإعلانية، براءات الاختراع)."],[3,1,1,0,"يُعرف المصروف محاسبياً بأنه عبارة عن تكلفة:",["مستنفدة حققت الغرض المحدد لها وقوبلت بالإيراد","غير مستنفدة لم تحقق الغرض المحدد لها بعد","مستنفدة لم يتحقق منها أي عائد أو منفعة","تُدرج ضمن الأصول الثابتة في الميزانية"],0,"المصروف هو الجزء المستنفد من التكلفة الذي ساهم في توليد إيرادات الفترة، ويُرحل لقائمة الدخل."],[3,1,1,0,"تُعرف الخسارة في محاسبة التكاليف بأنها:",["تكاليف مستنفدة لم يتحقق منها عائد أو منفعة","تكاليف غير مستنفدة مؤجلة للمستقبل","تكاليف قابلة للتخزين في المستودعات","تضحية بموارد اقتصادية مقابل إيراد مرتفع"],0,"الخسارة هي تضحية اقتصادية استُنفدت دون أن تولد أي منفعة أو إيراد مقابلها."],[3,1,1,0,"يتم تحليل عناصر التكاليف نوعياً (أو طبيعياً) إلى:",["مواد / أجور عمال / خدمات","صناعية / تسويقية / إدارية وتمويلية","مباشرة / غير مباشرة","متغيرة / ثابتة / مختلطة"],0,"التبويب النوعي يصنف التكاليف حسب نوع العنصر إلى ثلاث مجموعات: مواد، وأجور، وخدمات."],[3,1,1,0,"يتم تحليل عناصر التكاليف وظيفياً إلى:",["إنتاجية (صناعية) / تسويقية / إدارية وتمويلية","مواد / أجور عمال / خدمات","مباشرة / غير مباشرة","متغيرة / ثابتة / مختلطة"],0,"التبويب الوظيفي يقسم التكاليف وفقاً للوظائف الأساسية للمنشأة: الإنتاج، التسويق، والإدارة والتمويل."],[3,1,1,0,"يتم تحليل عناصر التكاليف بحسب علاقتها بوحدة المنتج (غرض التكلفة) إلى:",["تكاليف مباشرة / تكاليف غير مباشرة","مواد / أجور / خدمات","صناعية / تسويقية / إدارية","متغيرة / ثابتة / مختلطة"],0,"وفقاً للعلاقة بوحدة المنتج، تنقسم التكاليف إلى مباشرة (تُتبع بدقة للمنتج) وغير مباشرة (مشتركة بين عدة منتجات)."],[3,1,1,0,"يقصد بـ (التكلفة الأولية) للمنتج مجموع كل من:",["المواد المباشرة + الأجور المباشرة (+ الخدمات الصناعية المباشرة)","الأجور المباشرة + التكاليف الصناعية غير المباشرة","المواد المباشرة + التكاليف التسويقية","التكاليف الثابتة + التكاليف الإدارية"],0,"التكلفة الأولية (Prime Cost) تمثل إجمالي التكاليف الصناعية المباشرة التي تدخل في تكوين المنتج."],[3,1,1,0,"يقصد بـ (تكاليف التحويل أو التشكيل) مجموع كل من:",["الأجور المباشرة + التكاليف الصناعية غير المباشرة","المواد المباشرة + الأجور المباشرة","المواد المباشرة + التكاليف الصناعية غير المباشرة","التكاليف التسويقية + التكاليف الإدارية"],0,"تكاليف التحويل (Conversion Cost) هي التكاليف اللازمة لتحويل المواد الخام إلى منتج تام، وتشمل العمل المباشر والأعباء الصناعية غير المباشرة."],[3,1,1,0,"أي من الأمثلة التالية يُعد من التكاليف الصناعية المباشرة؟",["جميع ما يلي (الخشب في الأثاث، القطن في الغزل والنسيج، الحديد في السيارات)","الخشب في صناعة الأثاث فقط","القطن في صناعة الغزل والنسيج فقط","الحديد في صناعة السيارات فقط"],0,"جميعها مواد خام أساسية تدخل في تكوين المنتج النهائي ويمكن تمييزها عينياً وربطها مباشرة بوحدة المنتج."],[3,1,1,0,"من الأسس العلمية للتفرقة بين التكاليف المباشرة والتكاليف غير المباشرة:",["جميع ما يلي (علاقة السببية، سهولة التمييز العيني، سهولة التخصيص المالي، الأهمية النسبية)","علاقة السببية فقط","الأهمية النسبية فقط","سهولة التمييز العيني فقط"],0,"تعتمد التفرقة على أربعة معايير متكاملة: السببية، وسهولة التتبع العيني، وسهولة التخصيص النقدي، والأهمية النسبية للعنصر."],[3,1,1,0,"يقصد بغرض أو هدف التكلفة (Cost Object):",["وحدة المنتج أو دائرة النشاط التي تُجمع وتُنسب إليها عناصر التكاليف لقياسها","قائمة الدخل الختامية","مقدار الربح الصافي المستهدف","حساب البنك الجاري للمنشأة"],0,"غرض التكلفة هو أي شيء ترغب الإدارة في قياس تكلفته بشكل مستقل (منتج، خدمة، قسم، عميل، أو مشروع)."],[3,1,1,1,"ما هو العنصر المشترك الذي يدخل في حساب كل من (التكلفة الأولية) و(تكلفة التحويل) في آنٍ واحد؟",["الأجور المباشرة (العمل المباشر)","المواد المباشرة","التكاليف الصناعية غير المباشرة","التكاليف التسويقية المتغيرة"],0,"التكلفة الأولية = مواد مباشرة + أجور مباشرة، وتكلفة التحويل = أجور مباشرة + ت.ص.غ.م؛ إذن الأجور المباشرة عنصر مشترك بينهما."],[3,1,1,1,"تتصف تكاليف المواد غير المباشرة بأنها:",["جميع ما يلي (لا ترتبط بمنتج محدد بشكل قاطع، لازمة لتأدية الإنتاج بشكل عام، لا تشكل جزءاً أساسياً في منتج بعينه)","تُشكل الجزء الأكبر من هيكل المنتج النهائي","يسهل تتبعها وتخصيصها بدقة لكل وحدة منتجة","تُعد جزءاً من التكلفة الأولية"],0,"المواد غير المباشرة (كالزيوت والشحوم وأدوات النظافة بالمصنع) تخدم العملية الإنتاجية ككل ولا تلتصق بمنتج معين."],[3,1,1,1,"وفقاً لتبويب التكاليف حسب قابليتها للتخزين، فإن (التكاليف القابلة للتخزين) تكون قاصرة على:",["تكاليف الإنتاج (التكاليف الصناعية) التي تلتصق بالوحدات المنتجة وتذهب معها للمخازن","التكاليف التسويقية والإعلانية","التكاليف الإدارية والتمويلية","الخسائر الرأسمالية"],0,"تكاليف الإنتاج وحدها هي التي تُخزن ضمن قيمة المخزون (تحت التشغيل والتام)، أما التكاليف التسويقية والإدارية فتُعد تكاليف فترة غير قابلة للتخزين."],[3,1,1,1,"أي من العبارات التالية تصف العلاقة الصحيحة بين (النفقة) و(التكلفة) و(المصروف)؟",["التكلفة أوسع من النفقة، والمصروف هو الجزء المستنفد من التكلفة الذي قابل إيراد الفترة","النفقة أوسع من التكلفة، والمصروف هو الجزء غير المستنفد","المصروف والتكلفة والنفقة مصطلحات متطابقة تماماً في المحاسبة","التكلفة هي الخسارة التي لا يقابلها أي عائد"],0,"التسلسل المفاهيمي الصحيح: التكلفة تشمل المدفوع (نفقة) والمحتسب، وما يُستنفد منها مقابل إيراد يصبح مصروفاً، وما يُستنفد بلا عائد يصبح خسارة."],[3,1,1,1,"تُصنف التكاليف التسويقية والإدارية والتمويلية وفقاً لقابليتها للتخزين على أنها:",["تكاليف فترة غير قابلة للتخزين تُحمل مباشرة على قائمة الدخل في نفس الفترة","تكاليف منتج قابلة للتخزين ضمن مخزون آخر المدة","أصول ثابتة غير ملموسة","تكاليف أولية مباشرة"],0,"ترتبط التكاليف التسويقية والإدارية بالزمن (الفترة المالية) أكثر من ارتباطها بوحدات الإنتاج المخزنة، لذا تُستنفد فوراً في قائمة الدخل."],[3,1,1,1,"إذا نشب حريق في مخزن المواد الخام وأتلف كمية من المواد غير المؤمن عليها، فإن تكلفة هذه المواد التالفة تُصنف محاسبياً كـ:",["خسارة (تكلفة مستنفدة بدون مقابل أو عائد)","مصروف تشغيل عادي","تكلفة غير مستنفدة (أصل بالميزانية)","تكلفة تحويل صناعية"],0,"تلف المواد دون تعويض أو منفعة يحول تكلفتها المستنفدة إلى خسارة تُقفل في قائمة الدخل."],[3,1,1,1,"عندما يقوم مصنع سيارات بتخصيص راتب مشرف الصيانة الذي يخدم جميع خطوط الإنتاج على الطرازات المختلفة، فإن هذه العملية تُسمى:",["تخصيص التكلفة (Cost Allocation)","تتبع التكلفة (Cost Tracing)","استنفاد التكلفة","إهلاك الأصول"],0,"راتب مشرف الصيانة العام هو تكلفة غير مباشرة، وتعيينه على الطرازات يتم عبر (تخصيص التكلفة) باستخدام أساس توزيع مناسب."],[3,1,1,1,"أي من البنود التالية يُصنف ضمن (تكاليف الخدمات) في التبويب النوعي لعناصر التكاليف؟",["القوى المحركة والصيانة ونقل المشتريات وعلاج العاملين","المواد الخام وقطع الغيار","الأجور النقدية والمزايا العينية للعمال","المخزون السلعي آخر المدة"],0,"التبويب النوعي يضم: المواد (مستلزمات سلعية)، الأجور (عمل بشري)، والخدمات (كافة المصروفات الأخرى كالصيانة والقوى المحركة والنقل)."],[3,1,1,1,"تكاليف تخطيط وتنظيم ومراقبة كافة أنشطة المنشأة بوجه عام وتوفير التمويل اللازم لها تُصنف وظيفياً ضمن:",["التكاليف الإدارية والتمويلية","التكاليف الإنتاجية (الصناعية)","التكاليف التسويقية والبيعية","تكاليف التحويل والتشكيل"],0,"التكاليف الإدارية والتمويلية هي التي تخدم الإدارة العليا والمنشأة ككل ولا تخص الإنتاج أو التسويق وحدهما."],[3,1,1,1,"يُعد التمييز بين التكاليف القابلة للتحكم والتكاليف غير القابلة للتحكم الركيزة الأساسية لتطبيق:",["نظام محاسبة المسؤولية وتقييم أداء المديرين","طريقة القسط الثابت للإهلاك","مبدأ التكلفة التاريخية","قائمة التدفقات النقدية"],0,"العدالة في تقييم الأداء تقتضي محاسبة كل مدير عن عناصر التكاليف التي يملك سلطة ا
