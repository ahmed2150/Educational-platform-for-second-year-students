حلة:",["الوصف العام للحاجة (General Need Description)","اختيار المورد","مراجعة الأداء","طلب العروض"],0,"أولاً نصف الحاجة بشكل عام، ثم يضع المهندسون المواصفات الفنية الدقيقة."],[4,3,1,1,"لماذا يُعد \"البحث عن الموردين\" في العصر الحديث أسهل وأسرع مقارنة بالماضي؟",["بسبب منصات التجارة الإلكترونية B2B ومحركات البحث والأدلة الرقمية","بسبب قلة عدد المصانع في العالم","لأن جميع الشركات تبيع نفس المنتج بنفس السعر","بسبب إلغاء الجمارك العالمية"],0,"منصات مثل Alibaba وThomasNet سهلت الوصول لموردين من كافة أنحاء العالم."],[4,3,1,1,"عندما يقرر مصنع للسيارات شراء إطاراته من شركة \"ميشلان\" بشرط أن تشتري ميشلان سيارات النقل الخاصة بها من نفس المصنع، فإن هذا يُعرف بـ:",["المعاملة بالمثل (Reciprocity)","الشراء النظمي","التوزيع الحصري","تحليل القيمة"],0,"التبادل التجاري المتبادل بين شركتين كبيرتين."],[4,3,1,1,"أي من العبارات التالية تصف \"مركز الشراء\" (Buying Center) بدقة؟",["تشكيل مرن يتغير أعضاؤه وحجمه باختلاف نوع وأهمية الصفقة الشرائية","مكتب ثابت يضم 5 موظفين لا يتغيرون أبداً","لجنة تضم مندوبي الموردين الخارجيين","قسم يقتصر على المحاسبين فقط"],0,"في صفقة بسيطة قد يضم مركز الشراء شخصاً واحداً، وفي صفقة معقدة قد يضم 20 شخصاً من إدارات مختلفة."],[4,3,1,1,"تُعتبر المواقع الإلكترونية للشركات الصناعية (B2B Websites) والتي تحتوي على حاسبات عائد الاستثمار (ROI Calculators) ودراسات حالة، أداة موجهة لدعم مرحلة:",["تقييم العروض واختيار المورد","الشراء الاندفاعي","الاستهلاك الشخصي","التوزيع المادي"],0,"المشتري الصناعي يحتاج لأرقام ملموسة تثبت أن المنتج سيوفر له التكاليف أو يزيد أرباحه."],[4,3,1,1,"انخفاض مبيعات المطاعم والفنادق خلال فترة الإغلاق أدى لتوقفها عن شراء اللحوم والخضروات من تجار الجملة. هذا يوضح العلاقة بين:",["الطلب الاستهلاكي والطلب المشتق لأسواق الأعمال","التسعير الكشطي والتوزيع الانتقائي","التنافر المعرفي والولاء","الثقافة الفرعية والطبقة الاجتماعية"],0,"توقف المستهلك عن الذهاب للمطاعم أوقف تلقائياً سلسلة التوريد الصناعية للمطاعم."],[4,3,1,1,"في تقييم الموردين (Supplier Selection)، يستخدم مركز الشراء بطاقة تقييم (Scorecard) تمنح أوزاناً نسبية لمعايير مثل:",["الجودة، السعر، ا  التوزيع التي تعتمد على اختيار عدد محدود ومختار من الموزعين في كل منطقة (مثل الأجهزة الكهربائية والعطور) هي:",["التوزيع الانتقائي (Selective Distribution)","التوزيع المكثف","التوزيع الحصري","التوزيع المباشر فقط"],0,"التوزيع الانتقائي يقع وسطاً بين المكثف والحصري."],[4,4,1,0,"أي من أدوات المزيج الترويجي التالية تتميز بأنها \"تواصل تفاعلي مباشر وجهاً لوجه\" بين مندوب المبيعات والمشتري؟",["البيع الشخصي (Personal Selling)","الإعلان التلفزيوني","العلاقات العامة","التغليف"],0,"البيع الشخصي يسمح بتكييف الرسالة البيعية فوراً حسب ردود فعل العميل."],[4,4,1,0,"المؤتمرات الصحفية، رعاية الفعاليات الرياضية والثقافية، والبيانات الإخبارية هي أدوات رئيسية لـ:",["العلاقات العامة (Public Relations)","ترويج المبيعات","البيع الشخصي","التوزيع المادي"],0,"تهدف العلاقات العامة لتحسين الصورة الذهنية للشركة لدى المجتمع."],[4,4,1,0,"نموذج (STP) في التسويق الاستراتيجي يرمز بالترتيب إلى:",["التجزئة، الاستهداف، والتموضع الذهني (Segmentation, Targeting, Positioning)","السعر، الترويج، والمنتج","القوة، الضعف، والفرص","البيع، التدريب، والأرباح"],0,"يحدد هذا النموذج من هم عملاؤنا وكيف سنتميز في أذهانهم."],[4,4,1,0,"ترسيخ صورة ذهنية واضحة ومميزة للمنتج في عقول المستهلكين المستهدفين مقارنة بالمنافسين يُعرف بـ:",["التموضع الذهني (Positioning)","تجزئة السوق","التوزيع المكثف","تحليل SWOT"],0,"التموضع هو المكانة التي تحتلها العلامة في عقل المستهلك (مثل فولفو = الأمان)."],[4,4,1,0,"المرحلة التي تبدأ فيها المبيعات بالتراجع وتنخفض الأرباح بسبب ظهور تكنولوجيا أحدث أو تغير أذواق المستهلكين هي مرحلة:",["الانحدار (Decline)","النمو (Growth)","التقديم (Introduction)","التطوير (Development)"],0,"في مرحلة الانحدار تقرر الشركة إما حصاد المنتج، أو تطويره، أو حذفه."],[4,4,1,0,"إضافة مستوى ثالث للمنتج يتجاوز المنافع الأساسية والمادية ليشمل خدمات الضمان، الصيانة، التوصيل، والتركيب يُسمى:",["المنتج المدعم أو الإضافي (Augmented Product)","المنتج الجوهري (Core Benefit)","المنتج الفعلي (Actual Product)","المنتج الخام"],0,"مستويات المنتج الثلاثة: الجوهري (المنفعة)، الفعلي (الجودة والتصميم)، والمدعم (خدمات ما بعد البيع)."],[4,4,1,0,"دمج وتنسيق كافة قنوات الاتصال بالشركة لتقديم رسالة واضحة ومتسقة ومقنعة عن المنظمة ومنتجاتها يُسمى:",["الاتصالات التسويقية المتكاملة (IMC)","قصر النظر التسويقي","التوزيع الحصري","الطلب المشتق"],0,"IMC تمنع تضارب الرسائل بين الإعلانات ومندوبي المبيعات ووسائل التواصل."],[4,4,1,0,"تجزئة السوق على أساس السمات الشخصية، نمط الحياة، والطبقة الاجتماعية تُسمى:",["التجزئة السيكوغرافية (Psychographic Segmentation)","التجزئة الجغرافية","التجزئة الديموغرافية","التجزئة السلوكية"],0,"السيكوغرافيا تركز على الجانب النفسي وأسلوب الحياة."],[4,4,1,0,"تجزئة السوق على أساس معدل الاستخدام، الولاء للعلامة، والمنافع المطلوبة من المنتج تُسمى:",["التجزئة السلوكية (Behavioral Segmentation)","التجزئة الجغرافية","التجزئة الديموغرافية","التجزئة السياسية"],0,"تُعد التجزئة السلوكية من أفضل نقاط البداية لبناء قطاعات سوقية فعالة."],[4,4,0,1,"نجاح شركة \"أبل\" في تسعير هواتف الآيفون الجديدة بأسعار مرتفعة جداً عند الإطلاق ثم تخفيضها عند صدور الجيل التالي هو تطبيق عملي لـ \"تسعير كشط السوق\".",["صح","خطأ"],0,"صحيح؛ أبل تحصد أرباحاً ضخمة من عشاق التكنولوجيا الأوائل ثم تخفض السعر لباقي الشرائح."],[4,4,0,1,"شركة \"كت كات\" (KitKat) عندما ربطت شوكولاتتها بشعار \"خذ بريك، خذ كت كات\" (Have a break, have a KitKat)، نجحت في خلق \"تموضع ذهني\" يربط المنتج بلحظات الاستراحة.",["صح","خطأ"],0,"صحيح؛ هذا التموضع السلوكي جعلها الخيار التلقائي وقت الاستراحة في العمل أو الدراسة."],[4,4,0,1,"في مصفوفة بوسطن (BCG)، إذا قامت الشركة بسحب كافة الاستثمارات من وحدة \"نجم\" (Star) لتحويلها فوراً إلى \"بقرة حلوب\" قبل نضج السوق، فإنها تخاطر بفقدان حصتها السوقية لصالح المنافسين.",["صح","خطأ"],0,"صحيح؛ النجم يحتاج لاستثمار مستمر للدفاع عن حصته في السوق سريع النمو."],[4,4,0,1,"تُعتبر خدمة \"أمازون برايم\" (Amazon Prime) التي تجمع بين الشحن المجاني السريع، ومشاهدة الأفلام، والموسيقى باشتراك واحد مثالاً على \"تسعير الحزمة\" (Product Bundle Pricing).",["صح","خطأ"],0,"صحيح؛ دمج عدة منتجات أو خدمات في حزمة واحدة بسعر أقل من شرائها منفردة يزيد القيمة للعميل."],[4,4,0,1,"اعتمدت شركة \"نتفليكس\" عند دخولها الأسواق العالمية على \"التسعير الاختراقي\" (اشتراك شهري منخفض جداً) لبناء قاعدة مشتركين ضخمة بسرعة.",["صح","خطأ"],0,"صحيح؛ السعر المنخفض والوصول السهل ساعداها على الانتشار السريع والسيطرة على السوق."],[4,4,0,1,"المنتج \"الجوهري\" (Core Customer Value) في هاتف الآيفون ليس هو الشاشة أو المعالج أو نظام iOS، بل هو \"التواصل، الاتصال بالعالم، والإنتاجية والترفيه\".",["صح","خطأ"],0,"صحيح؛ المنتج الجوهري هو المنفعة الحقيقية غير الملموسة التي يشتريها المستهلك."],[4,4,0,1,"تُعد استراتيجية \"التسويق غير المتمايز\" (Undifferentiated Marketing) مناسبة جداً في العصر الحديث لتسويق الملابس والأحذية الرياضية.",["صح","خطأ"],1,"خطأ؛ التسويق غير المتمايز (تقديم منتج واحد للجميع) لم يعد فعالاً في الأسواق المتنوعة كالملابس التي تتطلب تسويقاً متمايزاً أو مركزاً."],[4,4,0,1,"في مرحلة \"النضج\" (Maturity) من دورة حياة المنتج، يمكن للشركة إطالة عمر المنتج من خلال تعديل السوق (البحث عن مستخدمين جدد) أو تعديل المنتج (إضافة نكهات أو مزايا جديدة).",["صح","خطأ"],0,"صحيح؛ كما تفعل شركات المشروبات الغازية والمنظفات بإطلاق عبوات وأشكال جديدة باستمرار."],[4,4,0,1,"العلامات التجارية الخاصة بالمتاجر (Store Brands / Private Labels) مثل منتجات \"كارفور\" التي تحمل اسم كارفور تُحقق هوامش ربح أعلى للمتجر وتعزز ولاء المتسوقين له.",["صح","خطأ"],0,"صحيح؛ وتنافس بقوة العلامات التجارية الوطنية بأسعار أقل."],[4,4,0,1,"التسويق بالكمين (Ambush Marketing) يحدث عندما تقوم شركة غير راعية لحدث رياضي كبير (مثل كأس العالم) بعمل حملات إعلانية توحي للجمهور بأنها راعٍ رسمي.",["صح","خطأ"],0,"صحيح؛ وهو أسلوب ذكي ومثير للجدل تستغله الشركات المنافسة للرعاة الرسميين."],[4,4,0,1,"تُعد استراتيجية \"الدفع\" (Push Strategy) في الترويج مناسبة عندما توجه الشركة جهودها البيعية والترويجية نحو \"تجار الجملة والتجزئة\" لإقناعهم بحمل المنتج وعرضه.",["صح","خطأ"],0,"صحيح؛ بينما استراتيجية \"السحب\" (Pull) توجه الإعلانات للمستهلك النهائي ليطلب المنتج من التاجر."],[4,4,0,1,"اختيار شركة \"رولز رويس\" (Rolls-Royce) للتوزيع الحصري في معارض محدودة جداً حول العالم يهدف إلى تقليل تكاليف النقل فقط.",["صح","خطأ"],1,"خطأ؛ الهدف هو الحفاظ على الندرة والفخامة والهيبة والتحكم الكامل في تجربة العميل."],[4,4,0,1,"تُعتبر \"ماكدونالدز\" مثالاً على التوسع في خط الإنتاج (Line Extension) عندما أضافت القهوة الفاخرة (McCafé) والإفطار إلى قائمتها.",["صح","خطأ"],0,"صحيح؛ توسيع الخط يستغل قوة العلامة الحالية لجذب شرائح وأوقات استهلاك جديدة."],[4,4,0,1,"في التسعير على أساس القيمة (Customer Value-Based Pricing)، تبدأ الشركة بتقدير تكلفة تصنيع المنتج أولاً ثم تضيف هامش ربح وتحدد السعر.",["صح","خطأ"],1,"خطأ؛ هذا تعريف التسعير على أساس التكلفة (Cost-Based)، أما التسعير على أساس القيمة فيبدأ بتقدير القيمة التي يدركها العميل أولاً."],[4,4,0,1,"تُعد شركة \"جونسون آند جونسون\" عندما استخدمت شامبو الأطفال للكبار عبر حملة \"لطيف بما يكفي للأطفال، ورائع لك أيضاً\" مثالاً على إيجاد استخدامات جديدة لمنتج ناضج.",["صح","خطأ"],0,"صحيح؛ هذا التكتيك أنعش مبيعات المنتج وضاعف حجم سوقه المستهدف."],[4,4,0,1,"الوساطة التجارية (تجار الجملة والتجزئة) تزيد من عدد المعاملات التجارية في السوق وتجعل عملية التوزيع أكثر تعقيداً.",["صح","خطأ"],1,"خطأ؛ الوسطاء يقللون بشكل كبير من عدد المعاملات اللازمة بين المنتجين والمستهلكين ويرفعون كفاءة التوزيع."],[4,4,0,1,"في مصفوفة بوسطن، قد تقرر الشركة الإبقاء على وحدة \"كلب\" (Dog) إذا كانت تخدم عملاء مهمين يشترون منتجات أخرى مربحة من الشركة.",["صح","خطأ"],0,"صحيح؛ أحياناً تكون هناك اعتبارات استراتيجية تمنع التصفية الفورية للوحدة."],[4,4,0,1,"يُعد البيع الشخصي أكثر فاعلية من الإعلان في المراحل المتأخرة من عملية الشراء (تكوين التفضيل، الاقتناع، وإتمام الصفقة).",["صح","خطأ"],0,"صحيح؛ الإعلان يبني الوعي في البداية، والبيع الشخصي يغلق الصفقة."],[4,4,0,1,"تُصنف طابعات الحبر (التي تُباع بسعر رخيص جداً بينما تُباع خراطيش الحبر الخاصة بها بسعر مرتفع) ضمن استراتيجية \"تسعير المنتجات الأسيرة\" (Captive-Product Pricing).",["صح","خطأ"],0,"صحيح؛ مثل شفرات الحلاقة وماكينات القهوة بالكبسولات، حيث يرتبط المنتج التكميلي بالمنتج الأساسي."],[4,4,0,1,"التوزيع متعدد القنوات (Omnichannel) يعني أن يجد العميل تجربة متكاملة وموحدة سواء اشترى من تطبيق الهاتف، الموقع الإلكتروني، أو المتجر الفعلي.",["صح","خطأ"],0,"صحيح؛ مثل إمكانية الشراء أونلاين واستلام المنتج أو إرجاعه في الفرع."],[4,4,1,1,"تمتلك شركة كبرى وحدة أعمال تسيطر على 45% من سوق الهواتف الذكية التقليدية التي توقف نموها تقريباً، وتدر هذه الوحدة أرباحاً نقدية ضخمة دون الحاجة لاستثمارات كبيرة. في مصفوفة بوسطن، تُصنف هذه الوحدة كـ:",["بقرة حلوب (Cash Cow)","نجم (Star)","علامة استفهام (Question Mark)","كلب (Dog)"],0,"حصة سوقية عالية + نمو سوق منخفض = بقرة حلوب تدر السيولة لتمويل المشاريع الجديدة."],[4,4,1,1,"أطلقت شركة تقنية تطبيقاً جديداً للذكاء الاصطناعي في سوق ينمو بنسبة 40% سنوياً، لكن حصتها السوقية الحالية لا تتجاوز 3% وتحتاج لتمويل ضخم للمنافسة. في مصفوفة بوسطن، يُعد التطبيق:",["علامة استفهام (Question Mark)","بقرة حلوب (Cash Cow)","كلب (Dog)","نجم (Star)"],0,"نمو سوق مرتفع + حصة سوقية منخفضة = علامة استفهام تحتاج لقرار حاسم بالاستثمار المكثف أو الانسحاب."],[4,4,1,1,"تبيع شركة \"جيليت\" (Gillette) مقبض ماكينة الحلاقة بسعر منخفض جداً، بينما تحقق أرباحها الحقيقية من بيع شفرات الغيار المرتفعة الثمن. هذه الاستراتيجية السعرية تُسمى:",["تسعير المنتجات الأسيرة (Captive-Product Pricing)","تسعير كشط السوق","التسعير الجغرافي","تسعير المنتجات الثانوية"],0,"لأن المستهلك يصبح أسيراً لشراء الشفرات المتوافقة مع المقبض."],[4,4,1,1,"شركة أدوية تنفق الملايين على الإعلانات التلفزيونية الموجهة للمرضى مباشرة بعبارة \"اسأل طبيبك عن دواء كذا\"، لدفع المرضى لطلب الدواء من الصيدليات والأطباء. هذه الاستراتيجية هي:",["استراتيجية السحب (Pull Strategy)","استراتيجية الدفع (Push Strategy)","التوزيع الحصري","التسعير الاختراقي"],0,"السحب يخلق طلباً لدى المستهلك النهائي يسحب المنتج عبر قنوات التوزيع."],[4,4,1,1,"شركة عصائر طبيعية تقسم السوق وتطلق عصيراً مدعماً بالفيتامينات للأطفال، وعصيراً خالياً من السكر لمرضى السكري، وعصيراً للطاقة للرياضيين. هذه استراتيجية استهداف:",["التسويق المتمايز (Differentiated Marketing)","التسويق غير المتمايز (Mass Marketing)","التسويق المركز (Niche)","التسويق الفردي"],0,"تصميم عروض تسويقية مستقلة لكل شريحة سوقية لزيادة المبيعات الإجمالية."],[4,4,1,1,"سلسلة فنادق فاخرة صغيرة تركز على خدمة \"الأثرياء ومحبي السياحة البيئية في جزر المالديف فقط\" وتوجه كل مواردها لهذه الشريحة الصغيرة المربحة. هذه استراتيجية:",["التسويق المركز (Concentrated / Niche Marketing)","التسويق غير المتمايز","التوزيع المكثف","التسعير الاختراقي"],0,"التركيز على حصة كبيرة في سوق فرعي صغير ومحدد (Niche)."],[4,4,1,1,"عندما تعرض شركة \"كوكاكولا\" منتجاتها في السوبر ماركت، الأكشاك، المطاعم، ماكينات البيع الذاتي، ومحطات الوقود، فإنها تطبق:",["التوزيع المكثف (Intensive Distribution)","التوزيع الحصري (Exclusive Distribution)","التوزيع الانتقائي (Selective Distribution)","البيع المباشر فقط"],0,"المشروبات الغازية سلعة ميسرة يجب أن تكون في متناول يد المستهلك أينما ذهب."],[4,4,1,1,"قيام شركة \"ديزني\" بتقديم تجربة ترفيهية متكاملة (أفلام، مدن ملاهي، ألعاب، ملابس) كلها تحت مظلة علامتها التجارية يوضح مفهوم:",["قيمة العلامة التجارية (Brand Equity) وتوسيع العلامة","قصر النظر التسويقي","مرحلة الانحدار","التسعير الكشطي"],0,"قيمة العلامة القوية تمنح الشركة مصداقية وتسهّل دخولها في فئات منتجات جديدة."],[4,4,1,1,"الفرق الأساسي بين \"توسيع خط الإنتاج\" (Line Extension) و\"توسيع العلامة التجارية\" (Brand Extension) هو:",["توسيع الخط يقدم نكهات أو أحجام جديدة في نفس فئة المنتج، بينما توسيع العلامة يدخل فئة منتجات جديدة تماماً","توسيع الخط يغير اسم العلامة التجارية بالكامل","توسيع العلامة يقتصر على خفض الأسعار فقط","لا يوجد أي فرق بينهما"],0,"إطلاق بيبسي دايت هو توسيع خط، أما إطلاق ساعات تحمل اسم بيبسي فهو توسيع علامة."],[4,4,1,1,"في دورة حياة المنتج، عندما تنخفض الأرباح رغم استمرار نمو المبيعات أو استقرارها بسبب دخول منافسين كثر واضطرار الشركة لخفض الأسعار وزيادة الترويج، فإن المنتج يكون في مرحلة:",["أواخر النمو وبداية النضج (Maturity)","التقديم (Introduction)","التطوير قبل الطرح","الاختفاء التام"],0,"تصل الأرباح لذروتها في مرحلة النمو ثم تبدأ بالتآكل في مرحلة النضج بسبب اشتداد المنافسة."],[4,4,1,1,"شركة طيران تبيع تذاكر الدرجة الاقتصادية بسعر منخفض وتذاكر درجة رجال الأعمال بسعر مرتفع لنفس الرحلة وفي نفس الوقت. هذا يُسمى:",["التسعير التمييزي (Segmented / Price Discrimination)","تسعير الكشط","تسعير الحزمة","التسعير النفسي"],0,"تحديد أسعار مختلفة لشرائح مختلفة بناءً على القيمة المدركة للمقعد والخدمة."],[4,4,1,1,"أثناء أزمة صحية، تبرعت شركة أغذية بكميات كبيرة من منتجاتها للمستشفيات وحظيت بتغطية إخبارية واسعة في القنوات التلفزيونية دون أن تدفع مقابل هذه التغطية. هذه الأداة الترويجية هي:",["العلاقات العامة والدعاية (PR & Publicity)","الإعلان المدفوع","البيع الشخصي","ترويج المبيعات"],0,"التغطية الإعلامية غير المدفوعة تتمتع بمصداقية عالية جداً لدى الجمهور."],[4,4,1,1,"توزيع عينات مجانية من عطر جديد داخل المولات التجارية لمنح المتسوقين فرصة تجربته فوراً يُعد مثالاً على:",["ترويج المبيعات (Sales Promotion)","العلاقات العامة","التسعير الكشطي","التوزيع الحصري"],0,"العينات المجانية تحفز التجربة الفورية وتكسر حاجز التردد لدى المستهلك."],[4,4,1,1,"عندما تبني شركة \"فولفو\" تموضعها الذهني على أساس \"الأمان\"، وتبني \"بي إم دبليو\" تموضعها على \"متعة القيادة\"، وتبني \"تويوتا\" تموضعها على \"الاعتمادية\"، فإن هذه الشركات تتجنب:",["التنافس المباشر القاتل على نفس الميزة في ذهن المستهلك","تجزئة السوق","إدارة علاقات العملاء","التوزيع الانتقائي"],0,"التموضع الناجح يمنح كل علامة مساحة ذهنية فريدة ومميزة."],[4,4,1,1,"استراتيجية \"البناء\" (Build) في مصفوفة بوسطن تعني استثمار المزيد من الأموال لزيادة الحصة السوقية، وهي مناسبة بشكل خاص لـ:",["علامات الاستفهام الواعدة لتحويلها إلى نجوم","الكلاب المتهالكة","المنتجات في مرحلة الانحدار","الأبقار الحلوب المكتفية"],0,"الاستثمار في علامات الاستفهام ينقلها لمربع النجوم ويهيئها لتكون أبقاراً حلوباً مستقبلاً."],[4,4,1,1,"استراتيجية \"الحصاد\" (Harvest) في مصفوفة بوسطن تعني تقليل الاستثمارات إلى الحد الأدنى لزيادة التدفق النقدي قصير الأجل، وتُستخدم مع:",["الأبقار الحلوب الضعيفة وعلامات الاستفهام والكلاب","النجوم الصاعدة بقوة","المنتجات في مرحلة التطوير","المشاريع الاستراتيجية الكبرى"],0,"الحصاد يستخرج آخر قطرة ربح من الوحدة قبل تصفيتها."],[4,4,1,1,"إضافة خدمة \"تتبع الطلب لحظة بلحظة عبر الخريطة\" في تطبيقات توصيل الطعام تندرج ضمن تطوير:",["المنتج المدعم (Augmented Product)","المنتج الجوهري","التسعير الجغرافي","البيئة الطبيعية"],0,"هي ميزة خدمية إضافية ترفع من جودة تجربة العميل وتميز التطبيق."],[4,4,1,1,"تقديم خصم 5% للتجار الذين يسددون قيمة الفاتورة خلال 10 أيام بدلاً من 30 يوماً يُسمى:",["الخصم النقدي (Cash Discount)","الخصم التجاري أو الوظيفي","خصم الكمية","الخصم الموسمي"],0,"الخصم النقدي يحفز المشتري على السداد المبكر لتحسين السيولة النقدية للبائع."],[4,4,1,1,"تقديم شركات التكييف خصومات كبيرة في فصل الشتاء لتشجيع العملاء على الشراء في غير موسم الذروة يُسمى:",["الخصم الموسمي (Seasonal Discount)","الخصم النقدي","خصم الكمية التراكمي","التسعير التفاخري"],0,"يساعد الخصم الموسمي المصانع على استقرار الإنتاج طوال العام وتقليل تكاليف التخزين."],[4,4,1,1,"تطبيق مفهوم \"الاتصالات التسويقية المتكاملة\" (IMC) يضمن للمستهلك:",["تجربة متناغمة ورسالة واحدة موحدة عبر الإعلان، الموقع، المتجر، وخدمة العملاء","الحصول على خصم 50% دائماً","عدم رؤية أي إعلانات للشركة","الشراء بالتقسيط فقط"],0,"التكامل بين القنوات يبني صورة ذهنية قوية وموثوقة للعلامة التجارية."]],"users":[{"n":"الاء خالد السيد عبد الفتاح","c":"2504330","r":"student","h":"6d204030196ebb6c1c0821f8d177eaecd74a3d5e8ab3009c927f370131f4dbe5"},{"n":"رتاج محمد محمد محمود متولي","c":"2501947","r":"student","h":"89e7087d700a4c25b7437bd05c748e50a0a5095af58e68b218327a346858f3c1"},{"n":"ملك رضا السيد عبد البديع","c":"2502508","r":"student","h":"f9186562b7b686dd273a42f78bfb73c0a5cc2fd8a7563447601dbb3295e28b72"},{"n":"سلمى محمود محمد طعيمة","c":"2501267","r":"student","h":"e52e93b0e1f92a773c5e25df1e8cb9b391bf1dfae8d1b26a7f94f1217b2de8e6"},{"n":"احمد محمد مسعد السعيد علي بدوي","c":"2300767","r":"admin","h":"21793c0cae5afc9ac2b17f4d0c76454a5709b1e35d16193aa48b7e70ddc1edf1"}]}</script>

  ${D.users.map(u=>`<tr><td>${esc(u.n)}</td><td dir="ltr" style="text-align:right">${u.c}</td><td>${u.r==='admin'?'أدمن':'طالبة'}</td><td>${load(u.c).length}</td></tr>`).join('')}</table></div></div>
  <div class="card in"><h3 class="sec">📊 إحصاءات بنك الأسئلة</h3><div style="overflow:auto"><table><tr><th>المادة</th><th>الأسئلة</th><th>صح وخطأ</th><th>اختيار من متعدد</th><th>سهل</th><th>متوسط</th></tr>
  ${D.courses.map((c,i)=>{const q=D.Q.filter(x=>x[0]===i);return`<tr><td>${esc(c.name)}</td><td>${q.length}</td><td>${q.filter(x=>x[2]===0).length}</td><td>${q.filter(x=>x[2]===1).length}</td><td>${q.filter(x=>x[3]===0).length}</td><td>${q.filter(x=>x[3]===1).length}</td></tr>`}).join('')}
  <tr><th>الإجمالي</th><th>${D.Q.length}</th><th>${D.Q.filter(x=>x[2]===0).length}</th><th>${D.Q.filter(x=>x[2]===1).length}</th><th>${D.Q.filter(x=>x[3]===0).length}</th><th>${D.Q.filter(x=>x[3]===1).length}</th></tr></table></div></div>
  <div class="card in"><h3 class="sec">🕘 آخر محاولاتي</h3>${a.length?`<div style="overflow:auto"><table><tr><th>المادة</th><th>النتيجة</th><th>الوقت</th><th>التاريخ</th></tr>${a.slice(-8).reverse().map(x=>`<tr><td>${x.ci<0?'امتحان شامل':esc(D.courses[x.ci].name)}</td><td>${x.s}/${x.t} (${Math.round(x.s/x.t*100)}%)</td><td>${fmt(x.tm||0)}</td><td>${new Date(x.d).toLocaleDateString('ar-EG')}</td></tr>`).join('')}</table></div>`:'<p class="mt">لا توجد محاولات بعد.</p>'}
  <div style="margin-top:14px"><button class="b" id="reset">مسح نتائجي على هذا الجهاز</button></div></div>`;
  $('#reset').onclick=()=>{if(confirm('سيتم مسح نتائجك المحفوظة على هذا الجهاز. متابعة؟')){save(me.c,[]);toast('تم مسح النتائج');showAdmin()}};
}
</script>
</body>
</html>
