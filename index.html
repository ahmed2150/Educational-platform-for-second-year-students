لتأثير فيها والتحكم بها فقط."],[3,2,0,0,"التكاليف المتغيرة هي التي تتغير في مجموعها بنفس نسبة تغير حجم النشاط (الإنتاج) في حدود المدى الملائم، وتساوي الصفر عند توقف النشاط.",["صح","خطأ"],0,"عبارة صحيحة؛ التكلفة المتغيرة دالة في حجم النشاط (ص = ب س)، فإذا كان حجم النشاط صفراً كانت التكلفة المتغيرة صفراً."],[3,2,0,0,"يظل متوسط تكلفة الوحدة الواحدة من التكاليف المتغيرة ثابتاً لا يتغير مع تغير حجم الإنتاج طالما بقيت مستويات الأسعار والكفاءة ثابتة.",["صح","خطأ"],0,"عبارة صحيحة؛ التكلفة المتغيرة متغيرة في إجماليها ولكنها ثابتة على مستوى الوحدة الواحدة (مثل 5 جنيهات مواد خام لكل وحدة)."],[3,2,0,0,"التكاليف الثابتة هي التي يظل إجماليها ثابتاً مهما تغير حجم النشاط في حدود المدى الملائم، وترتبط بالزمن لا بحجم الإنتاج.",["صح","خطأ"],0,"عبارة صحيحة؛ التكاليف الثابتة (مثل الإيجار والتأمين) دالة في الزمن (ص = أ) وتُسمى تكاليف الطاقة أو الحيازة."],[3,2,0,0,"تتغير علاقة نصيب الوحدة المنتجة من التكاليف الثابتة طردياً مع حجم النشاط (كلما زاد الإنتاج زاد نصيب الوحدة من التكاليف الثابتة).",["صح","خطأ"],1,"عبارة خاطئة؛ العلاقة عكسية؛ فكلما زاد حجم الإنتاج توزع المبلغ الثابت على وحدات أكثر فينخفض نصيب الوحدة الواحدة من التكاليف الثابتة."],[3,2,0,0,"التكاليف المختلطة (شبه المتغيرة أو شبه الثابتة) هي التي تجمع بين صفتي الثبات والتغير، فتتغير مع حجم النشاط ولكن ليس بنفس نسبة التغير.",["صح","خطأ"],0,"عبارة صحيحة؛ لأنها تحتوي على شق ثابت (مرتبط بالزمن) وشق متغير (مرتبط بالتشغيل)، مثل فاتورة الهاتف أو الصيانة أو الكهرباء."],[3,2,0,0,"يُعبر عن معادلة الخط المستقيم للتكاليف المختلطة بالصيغة (ص = أ + ب س)، حيث يمثل (أ) الشق الثابت ويمثل (ب) معدل التغير للوحدة.",["صح","خطأ"],0,"عبارة صحيحة؛ في معادلة التكلفة المختلطة: (ص) إجمالي التكلفة، (أ) التكلفة الثابتة، (ب) التكلفة المتغيرة للوحدة، و(س) حجم النشاط."],[3,2,0,0,"التكاليف الغارقة هي تكاليف حدثت نتيجة قرار اتُخذ في الماضي ولا يمكن استردادها أو تعديلها بقرار لاحق، لذا لا تُؤخذ في الحسبان عند اتخاذ القرارات.",["صح","خطأ"],0,"عبارة صحيحة؛ التكلفة الغارقة غير ملائمة لاتخاذ القرارات المستقبلية لأنها لن تتأثر بأي بديل يتم اختياره حالياً."],[3,2,0,0,"معظم التكاليف التاريخية التي دُفعت في الماضي (مثل القيمة الدفترية لآلة قديمة) تُعد تكاليف غارقة.",["صح","خطأ"],0,"عبارة صحيحة؛ التكلفة التاريخية للأصل المقتنى سابقاً تمثل إنفاقاً ماضياً لا يمكن تغييره، لذا فهي غارقة عند مفاضلة الاستبدال."],[3,2,0,0,"تُعرف تكلفة الفرصة البديلة بأنها أقصى مساهمة أو عائد ضائع على المنشأة نتيجة تفضيل بديل معين على البدائل الأخرى المتاحة.",["صح","خطأ"],0,"عبارة صحيحة؛ تكلفة الفرصة البديلة تنشأ عند وجود موارد نادرة وتعدد الاستخدامات البديلة، وتمثل تضحية بالعائد المتوقع من أفضل بديل مرفوض."],[3,2,0,0,"التكاليف الضمنية (المحتسبة) هي تكاليف لا تتكبدها المنشأة بالدفع النقدي ولا تُسجل في الدفاتر المالية، ولكنها مؤثرة في اتخاذ القرار.",["صح","خطأ"],0,"عبارة صحيحة؛ مثل احتساب إيجار افتراضي لعقار مملوك للمنشأة أو فائدة على رأس المال المملوك عند تقييم جدوى المشروع."],[3,2,0,1,"يرتكز منطق طريقة (أعلى وأدنى مستوى نشاط - ويليامز) في فصل التكاليف المختلطة على أن التغير في إجمالي التكلفة بين المستويين يرجع بالكامل للشق المتغير.",["صح","خطأ"],0,"عبارة صحيحة؛ لأن الشق الثابت يظل ثابتاً لا يتغير بين المستوى الأعلى والمستوى الأدنى ضمن المدى الملائم، فينحصر الفرق في الشق المتغير فقط."],[3,2,0,1,"التكلفة الحدية هي التغير في التكاليف الكلية نتيجة زيادة أو نقصان حجم النشاط بوحدة واحدة فقط، وتُقاس بالتكلفة المتغيرة طالما لم تتغير التكاليف الثابتة.",["صح","خطأ"],0,"عبارة صحيحة؛ التكلفة الحدية تقيس تكلفة الوحدة الإضافية الواحدة، وبما أن الثابت لا يتغير في المدى الملائم فإنها تساوي التكلفة المتغيرة للوحدة."],[3,2,0,1,"تختلف التكلفة التفاضلية عن التكلفة الحدية في أن التكلفة التفاضلية تقيس التغير في إجمالي التكاليف نتيجة الانتقال من مستوى نشاط لمستوى آخر (مجموعة وحدات).",["صح","خطأ"],0,"عبارة صحيحة؛ الحدية ترتبط بالتغير بوحدة واحدة، بينما التفاضلية ترتبط بالتغير الإجمالي نتيجة قرار بالانتقال بين بديلين أو مستويين مختلفين."],[3,2,0,1,"يشترط لاعتبار التكلفة (تكلفة ملائمة لاتخاذ القرار) توفر شرطين معاً: أن تكون متوقعة الحدوث في المستقبل، وأن تختلف من بديل لآخر.",["صح","خطأ"],0,"عبارة صحيحة؛ أي تكلفة لا تختلف بين البدائل أو حدثت في الماضي (غارقة) تُعد تكلفة غير ملائمة ويجب استبعادها لتبسيط القرار."],[3,2,0,1,"التكاليف الممكن تجنبها (أو تفاديها) هي تكاليف يمكن توفيرها وعدم دفعها في حالة إلغاء نشاط أو خط إنتاجي معين، لذا تُعد تكاليف ملائمة.",["صح","خطأ"],0,"عبارة صحيحة؛ التكلفة القابلة للتجنب تختلف بين بديل الاستمرار وبديل التوقف، مما يجعلها عنصراً حاسماً في قرارات الإغلاق أو التصنيع الداخلي."],[3,2,0,1,"يُقصد بـ (المدى الملائم) نطاق حجم النشاط الذي تظل فيه علاقات سلوك التكاليف الثابتة والمتغيرة صالحة ومستقرة دون الحاجة لزيادة الطاقة الإنتاجية.",["صح","خطأ"],0,"عبارة صحيحة؛ إذا تجاوز الإنتاج حدود المدى الملائم، قد تضطر المنشأة لاستئجار مصنع إضافي فتقفز التكاليف الثابتة لمستوى جديد."],[3,2,0,1,"تمثل التكلفة الثابتة بيانياً بخط مستقيم موازٍ للمحور الرأسي (محور التكاليف).",["صح","خطأ"],1,"عبارة خاطئة؛ التكلفة الثابتة الإجمالية تُرسم كخط مستقيم أفقي موازٍ للمحور الأفقي (محور حجم النشاط) دلالة على ثبات قيمتها مع تغير النشاط."],[3,2,0,1,"يبدأ الخط البياني للتكلفة المختلطة من نقطة الأصل (الصفر) ويتصاعد بميل ثابت.",["صح","خطأ"],1,"عبارة خاطئة؛ الذي يبدأ من الصفر هو خط التكلفة المتغيرة البحتة، أما خط التكلفة المختلطة فيبدأ من نقطة تقاطع على المحور الرأسي تمثل الشق الثابت (أ)."],[3,2,0,1,"لأغراض التخطيط والرقابة الدقيقة، يجب على محاسب التكاليف تحليل التكاليف المختلطة وفصلها إلى شقيها الثابت والمتغير.",["صح","خطأ"],0,"عبارة صحيحة؛ بقاء التكاليف مختلطة يصعّب التنبؤ بالتكلفة عند مستويات نشاط مختلفة، لذا تُفصل بطرق مثل أعلى وأدنى مستوى نشاط أو الانحدار."],[3,2,0,1,"إذا قررت شركة استخدام مبنى مملوك لها في مشروع جديد بدلاً من تأجيره للغير بمبلغ سنوي، فإن الإيجار الضائع يمثل تكلفة فرصة بديلة يجب أخذها في الحسبان.",["صح","خطأ"],0,"عبارة صحيحة؛ رغم أن الشركة لا تدفع إيجاراً نقدياً لنفسها، إلا أن تضحيتها بإيجار الغير تمثل تكلفة فرصة بديلة حقيقية عند تقييم المشروع."],[3,2,1,0,"تتصف التكاليف المتغيرة للنشاط بجميع الخصائص التالية ما عدا:",["تظل ثابتة في مجموعها الإجمالي مهما تغير حجم النشاط","تتغير في مجموعها طردياً مع تغير حجم النشاط خلال المدى الملائم","تساوي الصفر في حالة توقف النشاط الإنتاجي تماماً","يظل متوسط نصيب الوحدة الواحدة منها ثابتاً"],0,"ثبات المجموع الإجمالي هو صفة التكاليف الثابتة وليس المتغيرة."],[3,2,1,0,"يمكن تمثيل إجمالي التكلفة الثابتة للنشاط بيانياً بخط مستقيم:",["موازٍ للمحور الأفقي (محور حجم النشاط)","موازٍ للمحور الرأسي (محور التكلفة)","مائل يبدأ من نقطة الأصل (الصفر)","منحنى متناقص يصل للصفر"],0,"الخط الموازي للمحور الأفقي يعبر عن ثبات قيمة التكلفة عند نفس المستوى مهما زاد أو قل حجم النشاط على المحور الأفقي."],[3,2,1,0,"يمكن تمثيل إجمالي التكلفة المتغيرة للنشاط بيانياً بخط مائل:",["يبدأ من نقطة الصفر ويتصاعد بميل ثابت","موازٍ للمحور الأفقي","موازٍ للمحور الرأسي","يبدأ من منتصف المحور الرأسي"],0,"عند نشاط صفر تكون التكلفة المتغيرة صفراً، ثم تتزايد بمعدل ثابت (ب) مع كل وحدة نشاط إضافية."],[3,2,1,0,"العلاقة بين نصيب وحدة المنتج الواحد من التكاليف الثابتة وبين حجم النشاط هي علاقة:",["عكسية (ينخفض نصيب الوحدة كلما زاد حجم الإنتاج)","طردية (يزداد نصيب الوحدة كلما زاد حجم الإنتاج)","منعدمة تماماً","ثابتة لا تتأثر بتغير الإنتاج"],0,"نصيب الوحدة = إجمالي التكاليف الثابتة ÷ عدد الوحدات؛ وبزيادة المقام (الوحدات) ينخفض نصيب الوحدة الواحدة."],[3,2,1,0,"تُعبر معادلة التكاليف المختلطة عن إجمالي التكلفة (ص) بالصيغة الرياضية:",["ص = أ + ب س","ص = أ × ب × س","ص = س - أ ب","ص = أ ÷ س"],0,"حيث (أ) يمثل الشق الثابت، و(ب) يمثل معدل التكلفة المتغيرة للوحدة، و(س) يمثل حجم النشاط."],[3,2,1,0,"التكاليف التي تتصف بأنها (شبه ثابتة أو شبه متغيرة) مثل تكاليف الصيانة والكهرباء والتليفون تُسمى:",["التكاليف المختلطة","التكاليف الغارقة","التكاليف الأولية","التكاليف المباشرة"],0,"التكاليف المختلطة تضم اشتراكاً ثابتاً بالإضافة إلى تكلفة استهلاك متغيرة حسب التشغيل."],[3,2,1,0,"التكاليف التي نشأت بقرار اتُخذ في الماضي ولا يمكن استردادها أو تعديلها بقرار لاحق تُعرف بـ:",["التكاليف الغارقة (Sunk Costs)","التكاليف الملائمة (Relevant Costs)","تكلفة الفرصة البديلة","التكاليف الحدية"],0,"التكاليف الغارقة هي تكاليف تاريخية لا تتأثر بالقرارات الحالية أو المستقبلية."],[3,2,1,0,"أقصى مساهمة أو عائد ضائع نتيجة استخدام موارد نادرة في بديل معين وتفضيله على بدائل أخرى تُعرف بـ:",["تكلفة الفرصة البديلة (Opportunity Cost)","التكلفة الغارقة","التكلفة الأولية","التكلفة التاريخية"],0,"تكلفة الفرصة البديلة تقيس العائد المفقود من أفضل بديل تم التضحية به."],[3,2,1,0,"تُعد الفائدة المحتسبة على رأس المال المملوك أو القيمة الإيجارية المقدرة للعقارات المملوكة للمنشأة مثالاً على:",["التكاليف الضمنية (المحتسبة أو الافتراضية)","التكاليف الغارقة","النفقات النقدية المباشرة","التكاليف المتغيرة"],0,"التكاليف الضمنية لا يترتب عليها تدفق نقدي خارجي ولا تُقيد بالدفاتر المالية لكنها تُحتسب اقتصادياً لتقييم الأداء والقرارات."],[3,2,1,0,"التكاليف المستقبلية المتوقع حدوثها والتي تختلف من بديل لآخر عند المفاضلة بين بدائل الاختيار تُسمى:",["التكاليف الملائمة","التكاليف الغارقة","التكاليف التاريخية","التكاليف غير القابلة للتحكم"],0,"الاختلاف بين البدائل والمستقبلية هما شرطا ملاءمة التكلفة لعملية اتخاذ القرار."],[3,2,1,1,"في طريقة (أعلى وأدنى مستوى نشاط - ويليامز) لفصل التكاليف المختلطة، يتم حساب معدل التغير (ب) عن طريق قسمة:",["(تكاليف أعلى مستوى - تكاليف أدنى مستوى) ÷ (حجم أعلى مستوى - حجم أدنى مستوى)","(حجم أعلى مستوى - حجم أدنى مستوى) ÷ (تكاليف أعلى مستوى - تكاليف أدنى مستوى)","إجمالي التكاليف المختلطة ÷ إجمالي ساعات العمل","التكلفة الثابتة ÷ معدل التغير"],0,"الفرق في التكلفة (البسط) مقسوماً على الفرق في حجم النشاط (المقام) يعطينا ميل الخط المستقيم وهو معدل التكلفة المتغيرة للوحدة."],[3,2,1,1,"تُسمى عناصر التكاليف الثابتة في الأدبيات المحاسبية بـ (تكاليف الطاقة أو الحيازة) لأنها:",["ترتبط بتوفير الطاقة الإنتاجية والهيكلية للمنشأة عبر الزمن سواء تم التشغيل أم توقف","تتغير لحظياً مع كل وحدة يتم إنتاجها","تُدفع كعمولات لرجال البيع","تنعدم بمجرد إغلاق المصنع ليوم واحد"],0,"المنشأة تتحمل التكاليف الثابتة (إيجار، تأمين، إهلاك، مرتبات الإدارة العليا) لمجرد حيازتها للطاقة الإنتاجية واستعدادها للعمل."],[3,2,1,1,"أي من الطرق التالية تُعد من الأساليب العلمية المستخدمة لفصل التكاليف المختلطة إلى شقيها الثابت والمتغير؟",["جميع ما يلي (طريقة أعلى وأدنى مستوى نشاط، طريقة الانحدار والارتباط، طريقة التقدير المباشر، فرض توقف النشاط)","طريقة الوارد أولاً صادر أولاً (FIFO)","طريقة القسط المتناقص للإهلاك","طريقة التحميل الكلي فقط"],0,"توجد عدة طرق لفصل التكاليف المختلطة منها التقدير الهندسي المباشر، فرض توقف النشاط، الحد الأعلى والأدنى (ويليامز)، وتحليل الانحدار الإحصائي."],[3,2,1,1,"الفرق المفاهيمي الدقيق بين (التكلفة التفاضلية) و(التكلفة الحدية) يكمن في أن:",["التكلفة التفاضلية تقيس التغير الإجمالي بين بديلين أو مستويين للنشاط، بينما التكلفة الحدية تقيس تغير التكلفة لوحدة واحدة فقط","التكلفة الحدية تشمل التكاليف الغارقة والتفاضلية لا تشملها","التكلفة التفاضلية تُحسب في الماضي والحدية في المستقبل","لا يوجد أي فرق بينهما في الحجم أو الاستخدام"],0,"التكلفة التفاضلية أوسع وتشمل الفروق الإجمالية بين خطط أو مستويات إنتاج مختلفة، أما الحدية فتخص الوحدة الإضافية الواحدة (Marginal Unit)."],[3,2,1,1,"عندما تفاضل إدارة المصنع بين (تصنيع جزء معين داخلياً) أو (شرائه جاهزاً من مورد خارجي)، فإن إيجار مبنى المصنع القائم الذي سيُدفع في الحالتين يُعد:",["تكلفة غير ملائمة (ثابتة لا تختلف بين البديلين) تُستبعد من المفاضلة","تكلفة ملائمة يجب إضافتها لتكلفة الشراء الخارجي","تكلفة متغيرة تزيد بزيادة الشراء","تكلفة فرصة بديلة"],0,"بما أن إيجار المصنع سيُدفع سواء صُنعت القطعة داخلياً أم اشتُريت من الخارج، فهو لا يختلف بين البدائل وبالتالي فهو غير ملائم للقرار."],[3,2,1,1,"يُطلق على التكاليف التي يمكن توفيرها وعدم تكبدها إذا قررت الإدارة إيقاف خط إنتاجي خاسر اسم:",["التكاليف الممكن تجنبها (Avoidable Costs)","التكاليف الغارقة (Sunk Costs)","التكاليف المشتركة غير القابلة للتجنب","التكاليف التاريخية"],0,"التكاليف الممكن تجنبها هي التكاليف التفاضلية التي تختفي باختفاء النشاط، وتُقارن بالإيرادات المفقودة لاتخاذ قرار الإغلاق أو الاستمرار."],[3,2,1,1,"في معادلة التكلفة المختلطة (ص = أ + ب س)، يمثل الرمز (ب) هندسياً على الرسم البياني:",["ميل الخط المستقيم (معدل التغير في التكلفة لكل وحدة نشاط)","نقطة تقاطع الخط مع المحور الرأسي","نقطة الأصل (الصفر)","الحد الأقصى للطاقة الإنتاجية"],0,"في المعادلة الخطية، الثابت (أ) هو الجزء المقطوع من المحور الصادي، والمعامل (ب) هو ميل الخط المستقيم."],[3,2,1,1,"لماذا تُعد التكاليف الضمنية ذات أهمية بالغة عند اتخاذ القرارات الإدارية رغم عدم تسجيلها في الدفاتر المحاسبية؟",["لأنها تعكس تكلفة الفرصة البديلة الحقيقية لاستخدام موارد المنشأة الذاتية وتمنع اتخاذ قرارات مضللة","لأن مصلحة الضرائب تسمح بخصمها مرتين","لأنها تزيد من رصيد النقدية في الخزينة","لأنها تلغي التكاليف المتغيرة"],0,"إهمال التكاليف الضمنية (كإيجار العقار المملوك) يجعل المشروع يبدو رابحاً بشكل وهمي رغم أنه قد يحقق عائداً أقل من تأجير العقار للغير."],[3,2,1,1,"إذا خرج حجم الإنتاج الفعلي عن نطاق (المدى الملائم) بالزيادة الكبيرة، فإن سلوك التكاليف الثابتة الإجمالية:",["يرتفع على شكل قفزات (درجات) لاستيعاب الطاقة الجديدة","يظل ثابتاً إلى ما لا نهاية مهما تضاعف حجم المصنع","ينخفض إلى الصفر تلقائياً","يتحول إلى تكلفة غارقة"],0,"ثبات التكاليف الثابتة مشروط بالبقاء داخل (المدى الملائم)؛ وتجاوز هذا المدى يتطلب التوسع في الطاقة وزيادة التكاليف الثابتة."],[3,2,1,1,"أي من التكاليف التالية تُعد دائماً (تكلفة غير ملائمة) في جميع قرارات المفاضلة المستقبلية؟",["التكاليف الغارقة التاريخية","التكاليف التفاضلية المتوقعة","تكلفة الفرصة البديلة","التكاليف الممكن تجنبها"],0,"التكلفة الغارقة وقعت وانتهت في الماضي ولا يمكن لأي قرار مستقبلي تغييرها، لذا فهي دائماً غير ملائمة."],[3,3,0,0,"تقضي طريقة التحميل الكلي (الإجمالي) بتحميل وحدات الإنتاج بكافة تكاليف الإنتاج المباشرة وغير المباشرة، الثابتة والمتغيرة.",["صح","خطأ"],0,"عبارة صحيحة؛ في الطريقة الكلية تُعتبر جميع التكاليف الصناعية (ثابتة ومتغيرة) تكاليف منتج تلتصق بالوحدات المنتجة وتُخزن معها."],[3,3,0,0,"في ظل طريقة التحميل الكلي، تُعامل التكاليف التسويقية والإدارية والتمويلية كتكاليف فترة تُخصم مباشرة في قائمة الدخل ولا تُخزن.",["صح","خطأ"],0,"عبارة صحيحة؛ حتى في الطريقة الكلية، يقتصر التخزين على التكاليف الصناعية (الإنتاجية) فقط، أما التسويقية والإدارية فتُستنفد كتكاليف فترة."],[3,3,0,0,"تقوم طريقة التحميل بالتكلفة المتغيرة على تحميل وحدات الإنتاج بالتكاليف الإنتاجية المتغيرة فقط (مباشرة + غير مباشرة متغيرة).",["صح","خطأ"],0,"عبارة صحيحة؛ تقصر الطريقة المتغيرة تكلفة المنتج القابلة للتخزين على العناصر المتغيرة للإنتاج فقط."],[3,3,0,0,"في ظل طريقة التحميل بالتكلفة المتغيرة، تُعتبر التكاليف الصناعية غير المباشرة الثابتة تكاليف فترة تُستنفد فوراً في قائمة الدخل ولا تدخل في تقييم المخزون.",["صح","خطأ"],0,"عبارة صحيحة؛ هذا هو جوهر الطريقة المتغيرة، حيث ترى أن التكاليف الصناعية الثابتة مرتبطة بالزمن (طاقة المصنع) فتُحمل بالكامل على إيرادات الفترة."],[3,3,0,0,"يتفق صافي الدخل المستنتج من طريقة التحميل الكلي مع صافي الدخل في المحاسبة المالية، لذا تعد الأساس الملائم لإعداد التقارير الخارجية.",["صح","خطأ"],0,"عبارة صحيحة؛ المعايير المحاسبية للتقارير المالية الخارجية تشترط تقييم المخزون بالتكلفة الكلية الشاملة للتكاليف الصناعية الثابتة والمتغيرة."],[3,3,0,0,"يُفضل تطبيق طريقة التحميل بالتكلفة المتغيرة عند إعداد قوائم الدخل لأغراض الاستخدام الداخلي وتقييم أداء مديري مراكز المسؤولية.",["صح","خطأ"],0,"عبارة صحيحة؛ لأنها تمنع المديرين من تضخيم الأرباح بشكل وهمي عن طريق زيادة الإنتاج وتكديس المخزون آخر المدة."],[3,3,0,0,"يُطلق على الفرق بين إيراد المبيعات وإجمالي التكلفة المتغيرة للمبيعات (الإنتاجية والتسويقية المتغيرة) اسم (هامش المساهمة).",["صح","خطأ"],0,"عبارة صحيحة؛ هامش المساهمة = إيراد المبيعات - التكاليف المتغيرة الكلية، ويمثل المبلغ المتاح لتغطية التكاليف الثابتة وتحقيق الأرباح."],[3,3,0,0,"تُظهر قائمة الدخل وفقاً لطريقة التحميل الكلي (مجمل الربح)، بينما تُظهر قائمة الدخل وفقاً للطريقة المتغيرة (هامش المساهمة).",["صح","خطأ"],0,"عبارة صحيحة؛ في الطريقة الكلية نطرح تكلفة المبيعات الكلية لنصل لـ (مجمل الربح)، أما في المتغيرة فنطرح التكاليف المتغيرة لنصل لـ (هامش المساهمة)."],[3,3,0,0,"يُعد متوسط التكلفة الكلية للوحدة في ظل طريقة التحميل الكلي مقبولاً ومناسباً لاتخاذ قرارات قبول طلبيات خاصة بأسعار مخفضة في أوقات الكساد.",["صح","خطأ"],1,"عبارة خاطئة؛ الاعتماد على التكلفة الكلية قد يؤدي لرفض طلبيات مربحة في أوقات الكساد لأنها تتضمن تكاليف ثابتة ستتحملها المنشأة في كل الأحوال؛ والأنسب هنا التكلفة المتغيرة."],[3,3,0,0,"من نظريات وطرق تحميل التكاليف المعروفة: الطريقة الكلية (الإجمالية)، الطريقة المتغيرة، الطريقة المباشرة، والطريقة المستغلة.",["صح","خطأ"],0,"عبارة صحيحة؛ تنقسم طرق التحميل إلى طريقة التحميل الكلي وطرق التحميل الجزئي (المتغيرة، المباشرة، المستغلة)."],[3,3,0,1,"ينحصر الاختلاف الجوهري والأساسي بين طريقة التحميل الكلي وطريقة التحميل المتغير في كيفية معالجة التكاليف الصناعية غير المباشرة الثابتة.",["صح","خطأ"],0,"عبارة صحيحة؛ فالطريقة الكلية تعتبرها تكلفة منتج (تُخزن في المخزون)، بينما الطريقة المتغيرة تعتبرها تكلفة فترة (تُخصم فوراً بقائمة الدخل)."],[3,3,0,1,"إذا تساوى حجم الإنتاج التام خلال الفترة مع حجم المبيعات (أي لم يحدث أي تغير في كمية المخزون)، فإن صافي الدخل يتساوى في الطريقتين الكلية والمتغيرة.",["صح","خطأ"],0,"عبارة صحيحة؛ لأن عدم تغير المخزون يعني أن جميع التكاليف الثابتة للفترة قد استُنفدت في قائمة الدخل في كلا الطريقتين (بافتراض ثبات تكلفة الوحدة)."],[3,3,0,1,"عندما يزيد حجم الإنتاج عن حجم المبيعات (زيادة مخزون آخر المدة عن أول المدة)، يكون صافي الدخل في الطريقة الكلية أكبر منه في الطريقة المتغيرة.",["صح","خطأ"],0,"عبارة صحيحة؛ لأن الطريقة الكلية تقوم بـ (تخزين) جزء من التكاليف الصناعية الثابتة داخل وحدات مخزون آخر المدة وترحيلها للميزانية بدلاً من خصمها من أرباح العام."],[3,3,0,1,"عندما يزيد حجم المبيعات عن حجم الإنتاج (انخفاض مخزون آخر المدة عن أول المدة)، يكون صافي الدخل في الطريقة المتغيرة أكبر منه في الطريقة الكلية.",["صح","خطأ"],0,"عبارة صحيحة؛ لأنه في الطريقة الكلية يتم الإفراج عن التكاليف الثابتة المخزنة في مخزون أول المدة وتحميلها على مبيعات الفترة، مما يخفض ربح الطريقة الكلية."],[3,3,0,1,"تقييم المخزون السلعي في قائمة المركز المالي يكون دائماً أعلى في ظل طريقة التحميل الكلي مقارنة بطريقة التحميل المتغيرة.",["صح","خطأ"],0,"عبارة صحيحة؛ لأن تكلفة الوحدة المخزنة في الطريقة الكلية تشمل نصيبها من التكاليف الصناعية الثابتة، بينما تقتصر في المتغيرة على التكاليف المتغيرة فقط."],[3,3,0,1,"في ظل طريقة التحميل الكلي، يمكن لمدير الإنتاج رفع صافي الربح الظاهري للشركة دون زيادة المبيعات، وذلك بمجرد زيادة الإنتاج وتكديس المخزون.",["صح","خطأ"],0,"عبارة صحيحة؛ وهذه هي الثغرة الرقابية في الطريقة الكلية، حيث تُمتص التكاليف الثابتة في المخزون، وهو ما تعالجه الطريقة المتغيرة بربط الربح بالمبيعات فقط."],[3,3,0,1,"الفرق في صافي الدخل بين الطريقتين الكلية والمتغيرة يساوي تماماً الفرق بين التكاليف الصناعية الثابتة المضمنة في مخزون آخر المدة وتلك المضمنة في مخزون أول المدة.",["صح","خطأ"],0,"عبارة صحيحة؛ الفارق بين الربحين ليس خطأً حسابياً بل هو صافي التكاليف الثابتة المُرحّلة أو المُفرج عنها عبر حركة المخزون."],[3,3,0,1,"في قائمة الدخل وفقاً للطريقة المتغيرة، تُطرح التكاليف التسويقية المتغيرة قبل الوصول إلى هامش المساهمة، بينما تُطرح التكاليف التسويقية الثابتة بعد هامش المساهمة.",["صح","خطأ"],0,"عبارة صحيحة؛ قائمة الدخل المتغيرة تفصل التكاليف حسب سلوكها (متغيرة أولاً للوصول لهامش المساهمة، ثم ثابتة بكافة أنواعها للوصول لصافي الدخل)."],[3,3,0,1,"تُعامل تكلفة مخزون الإنتاج تحت التشغيل آخر الفترة بنفس فلسفة مخزون الإنتاج التام: بالتكلفة الكلية في الطريقة الكلية، وبالتكلفة المتغيرة فقط في الطريقة المتغيرة.",["صح","خطأ"],0,"عبارة صحيحة؛ مبدأ التحميل ينسحب على كافة أنواع المخزون الإنتاجي (تحت التشغيل والتام)."],[3,3,0,1,"تتأثر الأرباح في ظل طريقة التحميل بالتكلفة المتغيرة بحجم المبيعات فقط ولا تتأثر بتقلبات مستويات المخزون الإنتاجي.",["صح","خطأ"],0,"عبارة صحيحة؛ في الطريقة المتغيرة، مع ثبات الأسعار والتكاليف، يتحرك صافي الدخل في نفس اتجاه المبيعات فقط."],[3,3,1,0,"وفقاً لطريقة التحميل الكلي (الإجمالي)، تُعتبر التكاليف الصناعية غير المباشرة الثابتة:",["تكاليف منتج قابلة للتخزين تدخل في تقويم المخزون","تكاليف فترة تُستنفد فوراً في قائمة الدخل","خسائر غير عادية","تكاليف إدارية وتمويلية"],0,"الطريقة الكلية تعتبر كل تكاليف المصنع (ثابتة ومتغيرة) جزءاً لا يتجزأ من تكلفة المنتج القابلة للتخزين."],[3,3,1,0,"وفقاً لطريقة التحميل بالتكلفة المتغيرة، تُعتبر التكاليف الصناعية غير المباشرة الثابتة:",["تكاليف فترة تُستنفد فوراً في قائمة الدخل ولا تُخزن","تكاليف منتج تُحمل على وحدات المخزون آخر المدة","جزءاً من التكلفة الأولية للمنتج","أصولاً متداولة بالميزانية"],0,"الطريقة المتغيرة تفصل التكاليف الثابتة عن تكلفة الوحدة المنتجة وتخصمها بالكامل في قائمة الدخل كتكلفة فترة."],[3,3,1,0,"تُعد طريقة التحميل الكلي (التقليدية) الأساس المعتمد والملائم لإعداد:",["التقارير والقوائم المالية الخارجية المنشورة","تقارير تقييم أداء مديري مراكز المسؤولية داخلياً","قرارات تسعير الطلبيات الخاصة في أوقات الكساد","تحليل نقطة التعادل"],0,"تتوافق الطريقة الكلية مع مبادئ المحاسبة المالية ومتطلبات الجهات الخارجية والضرائب."],[3,3,1,0,"تُعد طريقة التحميل بالتكلفة المتغيرة الأساس الأفضل والأكثر شفافية لإعداد:",["التقارير الداخلية للإدارة وتقييم أداء المسؤولين ومنع التلاعب بالأرباح","القوائم المالية المنشورة للمساهمين والبنوك","الإقرارات الضريبية السنوية","سجلات رأس المال"],0,"تمنع الطريقة المتغيرة التلاعب برقم صافي الدخل عبر تضخيم المخزون، لذا فهي الأداة المثلى للإدارة الداخلية."],[3,3,1,0,"يُعرف (هامش المساهمة) في قائمة الدخل المعدة وفقاً للطريقة المتغيرة بأنه:",["إجمالي الإيرادات المتبقية بعد طرح التكاليف المتغيرة لتغطية التكاليف الثابتة وتحقيق الربح","إيراد المبيعات مطروحاً منه التكلفة الكلية للإنتاج المباع","صافي الدخل بعد الضرائب","إجمالي التكاليف الثابتة للمنشأة"],0,"هامش المساهمة = إيراد المبيعات - التكاليف المتغيرة (الإنتاجية والتسويقية)، ويُستخدم لتغطية التكاليف الثابتة ثم تحقيق الربح."],[3,3,1,0,"أي من البنود التالية يُعامل كـ (تكلفة فترة) في كل من الطريقة الكلية والطريقة المتغيرة على حد سواء؟",["التكاليف التسويقية والإدارية والتمويلية","التكاليف الصناعية غير المباشرة الثابتة","التكاليف الصناعية غير المباشرة المتغيرة","المواد المباشرة والأجور المباشرة"],0,"تتفق الطريقتان على أن التكاليف غير الإنتاجية (التسويقية والإدارية) هي تكاليف فترة تُستنفد فوراً في قائمة الدخل."],[3,3,1,0,"في قائمة تكاليف الإنتاج للوحدات التامة المباعة، للوصول من (إجمالي تكاليف الإنتاج) إلى (تكلفة الإنتاج التام) نقوم بـ:",["إضافة تكلفة وحدات تحت التشغيل أول الفترة وطرح وحدات تحت التشغيل آخر الفترة","إضافة تكلفة وحدات الإنتاج التام أول الفترة وطرح التام آخر الفترة","طرح التكاليف الإدارية والتمويلية","إضافة إيراد المبيعات"],0,"تسوية مخزون تحت التشغيل (أول + وآخر -) تحول إجمالي تكاليف الإنتاج خلال الفترة إلى تكلفة الإنتاج التام."],[3,3,1,0,"في قائمة تكاليف الإنتاج، للوصول من (تكلفة الإنتاج التام) إلى (تكلفة الإنتاج التام المباع) نقوم بـ:",["إضافة تكلفة مخزون الإنتاج التام أول الفترة وطرح تكلفة مخزون الإنتاج التام آخر الفترة","إضافة تكلفة مخزون تحت التشغيل أول الفترة وطرح تحت التشغيل آخر الفترة","طرح التكاليف التسويقية","إضافة التكاليف الصناعية الثابتة"],0,"تسوية مخزون الإنتاج التام (أول + وآخر -) تحدد تكلفة الوحدات التامة التي تم بيعها فعلاً خلال الفترة."],[3,3,1,0,"تشمل طرق التحميل الجزئي للتكاليف كلاً من:",["الطريقة المتغيرة، الطريقة المباشرة، والطريقة المستغلة","الطريقة الكلية فقط","طريقة القسط الثابت والقسط المتناقص","طريقة الجرد الدوري والجرد المستمر"],0,"تنقسم نظريات التحميل إلى: (1) التحميل الكلي/الإجمالي، و(2) التحميل الجزئي الذي يضم المتغيرة والمباشرة والمستغلة."],[3,3,1,0,"في ظل طريقة التحميل الكلي، يعبر (متوسط التكلفة الكلية للوحدة) في الظروف العادية عن:",["الحد الأدنى لسعر البيع الذي يمكن قبوله لتغطية كافة التكاليف","الحد الأقصى للربح الصافي","تكلفة الفرصة البديلة","التكلفة الحدية للوحدة"],0,"في الأجل الطويل والظروف الطبيعية، يجب أن يغطي سعر البيع متوسط التكلفة الكلية للوحدة على الأقل حتى لا تحقق المنشأة خسارة."],[3,3,1,1,"إذا قامت شركة بإنتاج 10,000 وحدة وباعت منها 8,000 وحدة فقط خلال العام، فإن صافي الدخل المحسوب وفقاً للطريقة الكلية سيكون:",["أكبر من صافي الدخل المحسوب وفقاً للطريقة المتغيرة","أقل من صافي الدخل المحسوب وفقاً للطريقة المتغيرة","مساوياً تماماً لصافي الدخل في الطريقة المتغيرة","يساوي صفراً في كلتا الطريقتين"],0,"لأن الإنتاج (10,000) أكبر من المبيعات (8,000)، زاد المخزون بمقدار 2,000 وحدة احتجزت بداخلها تكاليف صناعية ثابتة في الطريقة الكلية فارتفع صافي ربحها."],[3,3,1,1,"إذا قامت شركة بإنتاج 7,000 وحدة وباعت 9,000 وحدة (بالسحب من مخزون أول المدة)، فإن صافي الدخل وفقاً للطريقة المتغيرة سيكون:",["أكبر من صافي الدخل وفقاً للطريقة الكلية","أقل من صافي الدخل وفقاً للطريقة الكلية","مساوياً لصافي الدخل في الطريقة الكلية","لا يمكن تحديد العلاقة"],0,"لأن المبيعات أكبر من الإنتاج، انخفض المخزون وتحملت قائمة الدخل الكلية بالتكاليف الثابتة المخزنة في مخزون أول المدة، مما جعل ربح المتغيرة أعلى."],[3,3,1,1,"تفسير (فجوة الأرباح) بين قائمة الدخل الكلية وقائمة الدخل المتغيرة يرجع علمياً إلى:",["التكاليف الصناعية الثابتة التي تم تخزينها في الميزانية أو الإفراج عنها عبر تغير مستويات المخزون","وجود أخطاء حسابية في جمع التكاليف المباشرة","اختلاف سعر بيع الوحدة بين القائمتين","اختلاف معالجة التكاليف الإدارية الثابتة"],0,"الفجوة بين الربحين تساوي الفرق بين التكاليف الثابتة في مخزون آخر المدة والتكاليف الثابتة في مخزون أول المدة."],[3,3,1,1,"عند مقارنة تقييم المخزون السلعي في الميزانية العمومية بين الطريقتين، نجد أن قيمة مخزون آخر المدة في الطريقة المتغيرة تكون:",["أقل من قيمته في الطريقة الكلية لأنها تعكس التكاليف الإنتاجية المتغيرة فقط","أكبر من قيمته في الطريقة الكلية","مساوية لقيمته في الطريقة الكلية دائماً","تساوي صفراً"],0,"تستبعد الطريقة المتغيرة التكاليف الصناعية الثابتة من تكلفة المخزون، لذا يظهر المخزون بالميزانية بقيمة أقل وأكثر تحفظاً."],[3,3,1,1,"لماذا تُعد الطريقة الكلية غير ملائمة لاتخاذ قرار قبول طلبية خاصة بسعر منخفض في أوقات الكساد؟",["لأنها تُحمّل الوحدة بنصيب من التكاليف الثابتة التي ستتحملها المنشأة أصلاً، مما يضخم تكلفة الوحدة ويؤدي لرفض طلبية مربحة","لأنها لا تحسب تكلفة المواد المباشرة","لأنها تُظهر هامش المساهمة بشكل مبالغ فيه","لأن القانون يمنع استخدامها في أوقات الكساد"],0,"في أوقات الكساد، أي سعر بيع يغطي التكلفة المتغيرة للطلبية ويحقق فائضاً (هامش مساهمة) يساهم في تغطية التكاليف الثابتة وتقليل الخسائر."],[3,3,1,1,"في هندسة تدفق التكاليف في النظام المالي وفقاً للطريقة المتغيرة، متى تتحول (التكاليف الإنتاجية المتغيرة) إلى مصروفات بقائمة الدخل؟",["عند بيع المنتج للعملاء (تُعين أولاً للمخزون ثم تُستنفد عند البيع)","فوراً بمجرد شراء المواد الخام","فوراً بمجرد دفع الأجور","لا تتحول إلى مصروفات أبداً"],0,"التكاليف الإنتاجية المتغيرة هي تكاليف منتج، فتُحتجز في المخزون (قائمة المركز المالي) كتكلفة غير مستنفدة حتى يتم بيع المنتج فتُستنفد في قائمة الدخل."],[3,3,1,1,"في هندسة تدفق التكاليف وفقاً للطريقة المتغيرة، متى تتحول (التكاليف الإضافية الصناعية الثابتة) إلى مصروفات بقائمة الدخل؟",["تُستنفد فوراً في نفس الفترة المحاسبية دون المرور بالمخزون","عند بيع الوحدات المنتجة في السنوات القادمة","تبقى كأصل ثابت في الميزانية","تُضاف إلى تكلفة المواد المباشرة"],0,"لأن الطريقة المتغيرة تعتبرها تكاليف فترة، فإنها تتدفق مباشرة إلى قائمة الدخل وتُستنفد بالكامل في نفس فترة حدوثها."],[3,3,1,1,"أثر الإنتاج الزائد عن حاجة السوق على صافي الربح في ظل (الطريقة المتغيرة) مقابل (الطريقة الكلية) هو:",["لا يتأثر الربح في الطريقة المتغيرة، بينما يزداد الربح وهمياً في الطريقة الكلية","يزداد الربح في الطريقة المتغيرة وينخفض في الكلية","يتأثر الربح بنفس المقدار في كلتا الطريقتين","ينخفض الربح في الطريقتين معاً"],0,"هذه المقارنة التشخيصية توضح لماذا تمنع الطريقة المتغيرة التلاعب بالأرباح من خلال رفع مستويات المخزون."],[3,3,1,1,"في قائمة الدخل وفقاً للطريقة الكلية، يتم الوصول إلى (مجمل الربح) عن طريق طرح:",["إجمالي تكلفة المبيعات (تكلفة الإنتاج التام المباع + التكاليف التسويقية) من إيراد المبيعات","التكاليف الإدارية والتمويلية من إيراد المبيعات","التكاليف المتغيرة فقط من إيراد المبيعات","مخزون آخر المدة من مخزون أول المدة"],0,"في قائمة الدخل الكلية: إيراد المبيعات - إجمالي تكلفة المبيعات (صناعية مباعة + تسويقية) = مجمل الربح، ثم يُطرح منه الإدارية والتمويلية للوصول لصافي الدخل."],[3,3,1,1,"في قائمة الدخل وفقاً للطريقة المتغيرة، يتم الوصول إلى (صافي الدخل) في الخطوة الأخيرة عن طريق طرح:",["إجمالي التكاليف الثابتة (الإنتاجية والتسويقية والإدارية والتمويلية) من هامش المساهمة","التكاليف المتغيرة من مجمل الربح","تكلفة الإنتاج التام المباع من هامش المساهمة","التكاليف الصناعية الثابتة فقط من إيراد المبيعات"],0,"بعد الوصول إلى (هامش المساهمة)، تُطرح جميع التكاليف الثابتة للمنشأة دفعة واحدة للوصول إلى صافي الدخل."],[3,4,0,0,"يُقصد بالضياع استنفاذ كمية من عوامل الإنتاج (مواد أو وقت عمل أو طاقة آلات) دون الحصول على عائد أو منفعة مقابلة.",["صح","خطأ"],0,"عبارة صحيحة؛ الضياع هو فقدان واستنفاذ للموارد دون إنتاجية أو منفعة، ويهدف نظام التكاليف للحد منه."],[3,4,0,0,"تقدم محاسبة التكاليف معلومات مالية وكمية تفصيلية ومستقبلية بغرض خدمة المستخدم الداخلي في المقام الأول.",["صح","خطأ"],0,"عبارة صحيحة؛ هذا هو التعريف الشامل لطبيعة مخرجات محاسبة التكاليف ومستفيديها."],[3,4,0,0,"يُعرف عنصر التكلفة بأنه القيمة المالية لعوامل الإنتاج التي تُستخدم في تصنيع وتسويق المنتج أو الخدمة التي تقدمها المنشأة.",["صح","خطأ"],0,"عبارة صحيحة؛ عناصر التكلفة تمثل القيم النقدية لعوامل الإنتاج المستهلكة في أداء أنشطة المنشأة."],[3,4,0,0,"تقدم محاسبة التكاليف معلومات لكلٍ من المحاسبة الإدارية والمحاسبة المالية من خلال القياس والتقرير عن المعلومات المالية وغير المالية.",["صح","خطأ"],0,"عبارة صحيحة؛ محاسبة التكاليف تُعد همزة الوصل ومصدر البيانات لكل من المحاسبة المالية والمحاسبة الإدارية."],[3,4,0,0,"تعني النفقة التضحية النقدية التي لا يترتب عليها أي منفعة أو عائد اقتصادي.",["صح","خطأ"],1,"عبارة خاطئة؛ التضحية التي لا يترتب عليها أي منفعة تُسمى (خسارة)، أما النفقة فتهدف لتحقيق منافع اقتصادية محددة."],[3,4,0,0,"يعتبر الحصول على عائد أو منفعة أو توقع الحصول عليها أحد الأركان الرئيسية لتحديد مفهوم التكلفة.",["صح","خطأ"],0,"عبارة صحيحة؛ لكي تُعد التضحية تكلفة (وليست خسارة)، يجب أن يرتبط بها منفعة حالية أو متوقعة مستقبلاً."],[3,4,0,0,"تُعد المحاسبة عن التكاليف أداة مساعدة وضرورة حتمية لنجاح إدارة أي شركة في ظل المنافسة.",["صح","خطأ"],0,"عبارة صحيحة؛ لا غنى للإدارة الحديثة عن بيانات التكاليف للتسعير والرقابة والتخطيط."],[3,4,0,0,"تعتمد المحاسبة المالية في تسجيلها على البيانات التاريخية التي تمت في الماضي والناتجة من تعامل المنشأة مع الغير.",["صح","خطأ"],0,"عبارة صحيحة؛ المحاسبة المالية تسجل المعاملات الفعلية المثبتة تاريخياً بين المنشأة والأطراف الخارجية."],[3,4,0,0,"تُعرف التكاليف المباشرة بأنها العناصر التي لا يمكن ربطها وتتبعها مباشرة على المنتجات النهائية لارتباطها بالنشاط ككل.",["صح","خطأ"],1,"عبارة خاطئة؛ هذا تعريف التكاليف غير المباشرة، أما المباشرة فيمكن ربطها وتتبعها بسهولة ودقة على وحدة المنتج."],[3,4,0,0,"يتكون نظام المحاسبة عن التكاليف من مجموعة متكاملة من المستندات والسجلات والقوائم والتقارير.",["صح","خطأ"],0,"عبارة صحيحة؛ تمثل هذه العناصر الهيكل التطبيقي لنظام التكاليف داخل المنشأة."],[3,4,0,1,"المحاسبة عن التكاليف تحكمها مجموعة من المبادئ والفروض المحاسبية الصارمة، بينما المحاسبة المالية تتحرر من هذه المعايير.",["صح","خطأ"],1,"عبارة خاطئة (معكوسة)؛ المحاسبة المالية هي التي تحكمها المبادئ والفروض المحاسبية المتعارف عليها، بينما محاسبة التكاليف أكثر تحرراً ومرونة لخدمة الإدارة."],[3,4,0,1,"في ظل طريقة التحميل بالتكلفة المتغيرة، لا يمكن لمدير الإنتاج تحسين نتيجة أعماله الظاهرية عن طريق زيادة الإنتاج وتكوين مخزون إضافي.",["صح","خطأ"],0,"عبارة صحيحة؛ لأن التكاليف الثابتة تُخصم بالكامل في قائمة الدخل بغض النظر عن حجم الإنتاج والمخزون."],[3,4,0,1,"يُعتبر قرار إحلال آلة حديثة محل آلة قديمة مثالاً على القرارات التي تُستبعد فيها القيمة الدفترية للآلة القديمة باعتبارها تكلفة غارقة.",["صح","خطأ"],0,"عبارة صحيحة؛ القيمة الدفترية للآلة القديمة نشأت عن شراء ماضٍ ولا يمكن تغييرها، لذا تُستبعد من المفاضلة ويُؤخذ فقط ثمن بيعها كخردة (تدفق مستقبلي)."],[3,4,0,1,"إذا انخفض حجم النشاط داخل المدى الملائم، فإن إجمالي التكاليف الثابتة ينخفض بنفس نسبة انخفاض حجم النشاط.",["صح","خطأ"],1,"عبارة خاطئة؛ إجمالي التكاليف الثابتة يظل ثابتاً لا يتغير بتغير حجم النشاط، بينما يرتفع نصيب الوحدة الواحدة منها."],[3,4,0,1,"تُعد التكاليف التسويقية المتغيرة (مثل عمولة رجال البيع) تكلفة منتج قابلة للتخزين ضمن مخزون الإنتاج التام آخر المدة.",["صح","خطأ"],1,"عبارة خاطئة؛ التكاليف التسويقية (سواء كانت متغيرة أم ثابتة) هي تكاليف فترة ترتبط بالوحدات المباعة فقط ولا تُخزن ضمن المخزون الإنتاجي."],[3,4,0,1,"تُسمى التكاليف التي لا تختلف بين البدائل المتاحة لمتخذ القرار بـ (التكاليف غير الملائمة) حتى لو كانت ستحدث في المستقبل.",["صح","خطأ"],0,"عبارة صحيحة؛ لكي تكون التكلفة ملائمة يجب أن تكون مستقبلية ومختلفة بين البدائل؛ فإذا تساوت في جميع البدائل أصبحت غير مؤثرة في الاختيار."],[3,4,0,1,"تؤدي طريقة التحميل الكلي إلى تقييم المخزون السلعي في الميزانية بقيمة أكبر مما تظهر به في ظل الطريقة المتغيرة في حالة وجود تكاليف صناعية ثابتة.",["صح","خطأ"],0,"عبارة صحيحة؛ بسبب احتواء تكلفة الوحدة المخزنة في الطريقة الكلية على نصيب من التكاليف الصناعية الثابتة."],[3,4,0,1,"تهدف تقارير ترشيد القرارات الإدارية إلى تزويد الإدارة بالبيانات الخاصة بالقرارات غير المتكررة أو الاستراتيجية كالتسعير وقبول الطلبيات الخاصة.",["صح","خطأ"],0,"عبارة صحيحة؛ هذه التقارير تُعد خصيصاً لمساعدة متخذ القرار في المواقف المختلفة وفقاً لمفاهيم التكاليف الملائمة والتفاضلية."],[3,4,0,1,"يمكن جمع (التكلفة الأولية) مع (تكلفة التحويل) معاً للحصول على إجمالي التكلفة الصناعية للإنتاج.",["صح","خطأ"],1,"عبارة خاطئة؛ لأن الأجور المباشرة موجودة في كليهما، فجمعهما معاً يؤدي لازدواج احتساب الأجور المباشرة مرتين."],[3,4,0,1,"تُحقق الرقابة على التكاليف الكفاءة الاقتصادية في استخدام المواد والعمالة والآلات، وليس مجرد خفض التكاليف على حساب جودة المنتج.",["صح","خطأ"],0,"عبارة صحيحة؛ الرقابة الرشيدة تعني منع الإسراف والضياع وتحقيق أقصى عائد بأقل تكلفة ممكنة مع الحفاظ على مستوى الجودة."],[3,4,1,0,"يُعرف مقدار الموارد الاقتصادية المضحى بها من أجل تحقيق منفعة أو منافع محددة بـ:",["التكلفة","الإيراد","المسحوبات","رأس المال"],0,"هذا هو التعريف الدقيق لمفهوم التكلفة في محاسبة التكاليف."],[3,4,1,0,"يتم تحليل عناصر التكاليف بحسب علاقتها بحجم الإنتاج (مستوى النشاط) إلى:",["متغيرة / ثابتة / مختلطة","مواد / أجور / خدمات","صناعية / تسويقية / إدارية","مباشرة / غير مباشرة"],0,"دراسة سلوك التكاليف مع تغير حجم النشاط تقسمها إلى متغيرة وثابتة ومختلطة."],[3,4,1,0,"أصبح الهدف الحديث والشامل لمحاسبة التكاليف يشمل:",["جميع ما يلي (تحقيق هدف التخطيط، تحقيق هدف الرقابة، تحقيق هدف اتخاذ القرارات، قياس التكلفة)","قياس تكلفة المنتج فقط","إمساك الدفاتر التجارية فقط","حساب ضريبة القيمة المضافة فقط"],0,"تطور دور محاسبة التكاليف من مجرد حصر وقياس التكلفة إلى نظام معلومات متكامل للتخطيط والرقابة واتخاذ القرارات."],[3,4,1,0,"تسعى المحاسبة عن التكاليف في المقام الأول إلى خدمة:",["الأطراف الداخلية (إدارة المنشأة)","الأطراف الخارجية فقط","الجهات الحكومية فقط","المنافسين في السوق"],0,"محاسبة التكاليف محاسبة داخلية تخدم مستويات الإدارة المختلفة داخل المنشأة."],[3,4,1,0,"أي من التكاليف التالية تُعد مثالاً نموذجياً على التكاليف المختلطة؟",["تكاليف الصيانة والكهرباء والتليفون","الخشب في صناعة الأثاث","إيجار مبنى المصنع السنوي","عمولة مندوبي المبيعات كنسبة من المبيعات"],0,"الصيانة والكهرباء والتليفون تحتوي على شق ثابت (اشتراك/صيانة دورية) وشق متغير (حسب ساعات التشغيل أو الاستهلاك)."],[3,4,1,0,"تُسمى التكاليف التي تنفق من أجل النشاط ككل ويصعب تمييزها عينياً أو تتبعها بدقة لوحدة منتج معين بـ:",["التكاليف غير المباشرة","التكاليف المباشرة","التكاليف الأولية","التكاليف الضمنية"],0,"التكاليف غير المباشرة مشتركة بين أكثر من منتج أو مركز تكلفة ويتم توزيعها بأسس تخصيص مناسبة."],[3,4,1,0,"التغير في التكاليف الكلية نتيجة زيادة أو نقصان حجم النشاط بوحدة واحدة فقط يُسمى:",["التكلفة الحدية","التكلفة التفاضلية","التكلفة الغارقة","التكلفة الثابتة"],0,"التكلفة الحدية تقيس التغير في التكلفة الكلية عند تغير الإنتاج بمقدار وحدة واحدة."],[3,4,1,0,"قيمة التغير في إجمالي التكاليف نتيجة اتخاذ قرار بالانتقال من مستوى نشاط إلى مستوى نشاط آخر تُسمى:",["التكاليف التفاضلية","التكاليف الغارقة","التكاليف التاريخية","التكاليف الضمنية"],0,"التكاليف التفاضلية هي الفروق الإجمالية في التكاليف بين بديلين أو مستويين مختلفين للنشاط."],[3,4,1,0,"في قائمة الدخل المعدة وفقاً لطريقة التحميل المتغيرة، يُحسب (هامش المساهمة) بطرح:",["إجمالي التكاليف المتغيرة (الإنتاجية والتسويقية) من إيراد المبيعات","التكاليف الثابتة من إيراد المبيعات","التكاليف الإدارية من مجمل الربح","تكلفة مخزون آخر المدة من أول المدة"],0,"هامش المساهمة = إيراد المبيعات - التكلفة المتغيرة للمبيعات - تكاليف التسويق المتغيرة."],[3,4,1,0,"تُعرف الوحدات الفنية والإدارية المتجانسة التي تتكون منها المنشأة وينتج عنها منتج أو خدمة متميزة بـ:",["مراكز التكلفة","قوائم الدخل","التكاليف الغارقة","الموازنات التقديرية"],0,"مراكز التكلفة هي دوائر نشاط متجانسة تُجمع فيها التكاليف لأغراض القياس والرقابة."],[3,4,1,1,"إذا أرادت إدارة الشركة تقييم أداء مديري المصانع بعدالة تامة دون أن يتمكن أي مدير من تجميل أرباحه بزيادة المخزون، فعليها الاعتماد على:",["قائمة الدخل المعدة وفقاً لطريقة التحميل بالتكلفة المتغيرة","قائمة الدخل المعدة وفقاً لطريقة التحميل الكلي","قائمة المركز المالي التقديرية","إلغاء تقارير الرقابة الدورية"],0,"الطريقة المتغيرة تمنع ترحيل التكاليف الثابتة للميزانية عبر المخزون، فتعكس الأداء البيعي والربحي الحقيقي للمسؤولين."],[3,4,1,1,"أي من المعادلات المحاسبية التالية صحيحة تماماً لتحديد تكلفة الوحدة المنتجة في المصنع؟",["التكلفة الأولية + تكلفة التحويل - الأجور المباشرة = إجمالي التكلفة الصناعية للإنتاج","التكلفة الأولية + تكلفة التحويل = إجمالي التكلفة الصناعية للإنتاج","المواد المباشرة + التكاليف الإدارية = التكلفة الأولية","التكاليف الثابتة + التسويقية = تكلفة التحويل"],0,"بما أن الأجور المباشرة مكررة في التكلفة الأولية وفي تكلفة التحويل، فإن طرحها مرة واحدة يعطينا مجموع (مواد مباشرة + أجور مباشرة + ت.ص.غ.م)."],[3,4,1,1,"عندما يرتفع حجم الإنتاج داخل المدى الملائم من مستوى نشاط لآخر، ما الذي يحدث لكل من (إجمالي التكاليف الثابتة) و(نصيب الوحدة من التكاليف المتغيرة)؟",["يظل كلاهما ثابتاً لا يتغير","يرتفع كلاهما بنفس النسبة","ينخفض كلاهما عكسياً","يرتفع إجمالي الثابت وينخفض متغير الوحدة"],0,"من أروع المفارقات في محاسبة التكاليف: إجمالي الثابت ثابت، ومتغير الوحدة الواحدة ثابت أيضاً داخل المدى الملائم!"],[3,4,1,1,"عندما ينخفض حجم الإنتاج داخل المدى الملائم، ما الذي يحدث لكل من (إجمالي التكاليف المتغيرة) و(نصيب الوحدة من التكاليف الثابتة)؟",["ينخفض إجمالي التكاليف المتغيرة، بينما يرتفع نصيب الوحدة الواحدة من التكاليف الثابتة","يرتفع إجمالي التكاليف المتغيرة، وينخفض نصيب الوحدة الثابت","يظل كلاهما ثابتاً","ينخفض كلاهما معاً"],0,"التكلفة المتغيرة الإجمالية تتبع حجم الإنتاج طردياً (فتنخفض)، بينما نصيب الوحدة من الثابت يتبع الإنتاج عكسياً (فيرتفع)."],[3,4,1,1,"تُعد تكلفة التغليف الأولي اللازم لحفظ المنتج وحمايته فنياً داخل المصنع قبل وصوله للمخازن جزءاً من:",["التكاليف الصناعية (الإنتاجية)","التكاليف التسويقية","التكاليف الإدارية والتمويلية","الخسائر الرأسمالية"],0,"كل ما يُنفق لإتمام المنتج وجعله صالحاً للاستخدام والحفظ وفق مواصفاته الفنية يُعد تكلفة إنتاجية."],[3,4,1,1,"في نظام تدفق التكاليف، تتحول (تكاليف المنتج غير المستنفدة) الموجودة في قائمة المركز المالي إلى (تكاليف مستنفدة) في قائمة الدخل في اللحظة التي يتم فيها:",["بيع المنتج وتسليمه للعملاء","الانتهاء من تصنيع المنتج وتحويله لمخزن الإنتاج التام","شراء المواد الخام وتخزينها","سداد فواتير الكهرباء للمصنع"],0,"نقطة الاستنفاد المحاسبي لتكاليف المنتج هي لحظة البيع وتحقق الإيراد المقابل لها."],[3,4,1,1,"تُسمى الطريقة التي تُحمّل وحدات الإنتاج بالتكاليف المباشرة فقط (مواد مباشرة + أجور مباشرة) وتعتبر جميع التكاليف غير المباشرة تكاليف فترة بـ:",["طريقة التحميل بالتكلفة المباشرة","طريقة التحميل بالتكلفة الكلية","طريقة التحميل بالتكلفة المتغيرة","طريقة التحميل بالتكلفة المستغلة"],0,"الطريقة المباشرة هي إحدى طرق التحميل الجزئي، وتقصر تكلفة المنتج على العناصر المباشرة فقط."],[3,4,1,1,"أي من المزايا التالية تنفرد بها (طريقة التحميل بالتكلفة المتغيرة) وتجعلها أداة مثالية للتخطيط واتخاذ القرارات؟",["إظهار هامش المساهمة بوضوح وربط الأرباح بالمبيعات وتسهيل تحليل التعادل والتسعير المرن","إخفاء التكاليف الثابتة داخل قيمة المخزون السلعي","تطابقها التام مع متطلبات مصلحة الضرائب","عدم الحاجة إلى فصل التكاليف المختلطة"],0,"فصل التكاليف المتغيرة عن الثابتة يوضح للإدارة مساهمة كل منتج في تغطية الأعباء الثابتة ويسهّل دراسة العلاقة بين التكلفة والحجم والربح (CVP)."],[3,4,1,1,"إذا قررت منشأة التوقف عن إنتاج منتج معين، فإن مرتب مدير عام الشركة الذي سيستمر في عمله لإدارة باقي المنتجات يُعد بالنسبة لقرار التوقف:",["تكلفة غير ملائمة (لا يمكن تجنبها ولا تختلف بين البديلين)","تكلفة ملائمة يمكن تجنبها","تكلفة متغيرة مباشرة","تكلفة حدية"],0,"مرتب المدير العام مستمر في كلتا الحالتين (الاستمرار أو التوقف)، لذا لا يؤثر في القرار ويُستبعد."],[3,4,1,1,"يُعبر مفهوم (النفقة) عن تضحية بالموارد المالية ينتج عنها محاسبياً:",["نقص في الأصول (مثل النقدية) أو زيادة في الخصوم (مثل الدائنين)","زيادة في رأس المال المدفوع","زيادة في الأصول الثابتة دون مقابل","تقدير افتراضي غير مسجل بالدفاتر"],0,"النفقة ترتبط بالتدفق المالي الفعلي (نقص أصل نقدي) أو الالتزام بالدفع مستقبلاً (زيادة خصم/التزام)."],[4,0,0,0,"يقتصر مفهوم التسويق الحديث على عملية البيع والإعلان فقط.",["صح","خطأ"],1,"خطأ؛ البيع والإعلان ما هما إلا جزء من الوظائف التسويقية، بينما التسويق عملية متكاملة تبدأ قبل الإنتاج وتستمر بعد البيع."],[4,0,0,0,"عرّفت الجمعية الأمريكية للتسويق (AMA) التسويق بأنه نشاط ومجموعة مؤسسات وعمليات لخلق وتوصيل وتبادل العروض ذات القيمة.",["صح","خطأ"],0,"صحيح؛ هذا هو التعريف الرسمي المعتمد للجمعية الأمريكية للتسويق."],[4,0,0,0,"الحاجات الإنسانية (Needs) هي حالات من الشعور بالحرمان الأساسي مثل الحاجة للطعام والملبس والأمان.",["صح","خطأ"],0,"صحيح؛ الحاجات فطرية وأساسية في الإنسان ولا يخلقها المسوقون."],[4,0,0,0,"الرغبات (Wants) هي الشكل الذي تتخذه الحاجات الإنسانية بعد تشكيلها بواسطة الثقافة والشخصية الفردية.",["صح","خطأ"],0,"صحيح؛ فالحاجة للطعام قد تترجم لرغبة في الكشري في مصر أو البرجر في أمريكا."],[4,0,0,0,"تتحول الرغبات إلى طلب (Demand) بمجرد رغبة العميل في اقتناء المنتج دون الحاجة لوجود قدرة شرائية.",["صح","خطأ"],1,"خطأ؛ الطلب (Demand) هو الرغبات المدعومة بالقدرة الشرائية (المال)."],[4,0,0,0,"يقوم المسوقون بخلق الحاجات الأساسية لدى البشر من العدم.",["صح","خطأ"],1,"خطأ؛ المسوقون لا يخلقون الحاجات لأنها موجودة فطرياً، بل يؤثرون في الرغبات ويوجهونها نحو منتجاتهم."],[4,0,0,0,"العروض السوقية (Market Offerings) تقتصر على السلع المادية الملموسة فقط.",["صح","خطأ"],1,"خطأ؛ تشمل العروض السوقية السلع المادية، الخدمات غير الملموسة، الخبرات، الأفكار، والأماكن."],[4,0,0,0,"قصر النظر التسويقي (Marketing Myopia) هو التركيز المفرط على المنتج نفسه وإغفال الحاجة الحقيقية للعميل.",["صح","خطأ"],0,"صحيح؛ يحدث عندما يقع البائع في حب منتجه وينسى أن العميل يشتري المنفعة والحل لمشكلته."],[4,0,0,0,"القيمة المدركة للعميل هي الفرق بين إجمالي المنافع التي يحصل عليها وإجمالي التكاليف التي يتحملها.",["صح","خطأ"],0,"صحيح؛ القيمة = المنافع المدركة - التكاليف المدركة (المالية والزمنية والجهد)."],[4,0,0,0,"يتحقق رضا العميل (Customer Satisfaction) عندما يطابق الأداء الفعلي للمنتج توقعات العميل أو يفوقها.",["صح","خطأ"],0,"صحيح؛ إذا كان الأداء أقل من التوقعات يشعر العميل بعدم الرضا، وإذا فاقها يشعر بالبهجة."],[4,0,0,0,"التبادل (Exchange) هو جوهر التسويق، ويعني الحصول على شيء مرغوب من شخص ما مقابل تقديم شيء آخر له.",["صح","خطأ"],0,"صحيح؛ التبادل هو الفعل الأساسي الذي تقوم عليه العملية التسويقية."],[4,0,0,0,"السوق في المفهوم التسويقي الحديث هو مجموعة المشترين الفعليين والمحتملين لمنتج معين.",["صح","خطأ"],0,"صحيح؛ لم يعد السوق مقتصراً على المكان الجغرافي بل يشمل كافة المشترين ذوي الحاجة والقدرة."],[4,0,0,0,"يفترض المفهوم الإنتاجي أن المستهلكين يفضلون المنتجات المتوفرة بكثرة وبأسعار منخفضة.",["صح","خطأ"],0,"صحيح؛ يركز التوجه الإنتاجي على كفاءة الإنتاج والتوزيع الشامل وتخفيض التكلفة."],[4,0,0,0,"يركز مفهوم المنتج (Product Concept) على أن المستهلك يفضل المنتجات ذات الجودة والأداء والمزايا المبتكرة الأعلى.",["صح","خطأ"],0,"صحيح؛ ولكن الإفراط في هذا التوجه دون دراسة رغبة السوق قد يؤدي لقصر النظر التسويقي."],[4,0,0,0,"المفهوم البيعي (Selling Concept) يبدأ من السوق واحتياجات العملاء وينتهي بتحقيق الربح من خلال رضاهم.",["صح","خطأ"],1,"خطأ؛ هذا تعريف المفهوم التسويقي، أما المفهوم البيعي فيبدأ من المصنع ويركز على الترويج المكثف لبيع ما تم إنتاجه."],[4,0,0,0,"مفهوم التسويق الاجتماعي يوازن بين أرباح الشركة، رغبات المستهلك، ومصلحة المجتمع طويلة الأجل.",["صح","خطأ"],0,"صحيح؛ يراعي البعد الأخلاقي والبيئي والصحي للمجتمع بجانب الربح وإشباع العميل."],[4,0,0,0,"إدارة علاقات العملاء (CRM) تهدف إلى بناء علاقات مربحة طويلة الأجل مع العملاء من خلال تقديم قيمة ورضا متفوقين.",["صح","خطأ"],0,"صحيح؛ الاحتفاظ بالعميل الحالي أقل تكلفة وأكثر ربحية من جذب عميل جديد."],[4,0,0,0,"القيمة الدائمة للعميل (CLV) تعبر عن قيمة المشتريات المتوقعة للعميل طوال فترة تعامله مع الشركة.",["صح","خطأ"],0,"صحيح؛ لذا تسعى الشركات لبناء ولاء العميل لضمان تدفق هذه القيمة مستقبلاً."],[4,0,0,0,"التسويق الرقمي ووسائل التواصل الاجتماعي ألغت الحاجة إلى فهم حاجات ورغبات المستهلكين.",["صح","خطأ"],1,"خطأ؛ التكنولوجيا الرقمية هي أدوات وقنوات حديثة لتوصيل القيمة، لكن الأساس يظل فهم العميل وإشباع حاجاته."],[4,0,0,0,"المنظمات غير الهادفة للربح مثل الجامعات والمستشفيات والجمعيات الخيرية لا تحتاج إلى التسويق.",["صح","خطأ"],1,"خطأ؛ التسويق ضروري للمنظمات غير الربحية لجذب التبرعات، نشر الوعي، وتقديم خدماتها بكفاءة."],[4,0,1,0,"العملية الاجتماعية والإدارية التي يحصل من خلالها الأفراد والمجموعات على ما يحتاجونه ويرغبونه عبر خلق وتبادل القيمة هي:",["التسويق","الإنتاج","التمويل","المحاسبة"],0,"هذا هو تعريف فيليب كوتلر الشامل للتسويق."],[4,0,1,0,"عندما يدعم المستهلك رغبته في شراء هاتف ذكي بامتلاكه للمال الكافي لشرائه، فإن ذلك يسمى:",["الطلب (Demand)","الحاجة (Need)","الرغبة (Want)","العرض السوقي"],0,"الطلب = الرغبة + القدرة الشرائية."],[4,0,1,0,"الشعور بالحرمان الأساسي لدى الإنسان (مثل الجوع أو العطش أو الأمان) يُعرف بـ:",["الحاجة (Need)","الرغبة (Want)","الطلب (Demand)","المنفعة"],0,"الحاجات هي المتطلبات الإنسانية الأساسية الفطرية."],[4,0,1,0,"أي من الفلسفات التسويقية التالية تركز على \"تحسين كفاءة الإنتاج والتوزيع وتخفيض التكلفة\"؟",["المفهوم الإنتاجي","المفهوم البيعي","المفهوم التسويقي","التسويق الاجتماعي"],0,"المفهوم الإنتاجي يناسب الأسواق التي يزيد فيها الطلب عن العرض أو التي تتطلب خفض التكلفة."],[4,0,1,0,"الفلسفة التي ترى أن المستهلكين لن يشتروا كميات كافية من منتجات الشركة إلا إذا بذلت جهوداً ترويجية وبيعية مكثفة هي:",["المفهوم البيعي","مفهوم المنتج","المفهوم الإنتاجي","مفهوم التسويق الاجتماعي"],0,"المفهوم البيعي يركز على تصريف المخزون وزيادة حجم المبيعات (من الداخل للخارج)."],[4,0,1,0,"أي من المفاهيم التالية يأخذ وجهة نظر (من الخارج إلى الداخل) أي يبدأ من السوق واحتياجات العميل؟",["المفهوم التسويقي","المفهوم البيعي","المفهوم الإنتاجي","مفهوم المنتج"],0,"المفهوم التسويقي يبدأ بتحديد السوق المستهدف وفهم حاجاته ثم تصميم المنتج المناسب."],[4,0,1,0,"الحالة التي تركز فيها الشركة على خصائص المنتج المادية وتغفل الحاجة الفعلية التي يشبعها للعميل تُسمى:",["قصر النظر التسويقي","القيمة المدركة","التبادل التجاري","تجزئة السوق"],0,"قصر النظر التسويقي يجعل الشركة عرضة للزوال عند ظهور تكنولوجيا جديدة تشبع نفس الحاجة بشكل أفضل."],[4,0,1,0,"عندما يكون الأداء الفعلي للمنتج أقل من توقعات العميل، فإن النتيجة تكون:",["عدم رضا العميل","رضا العميل","بهجة العميل","ولاء العميل"],0,"عدم تطابق الأداء مع التوقعات بالانخفاض يسبب خيبة أمل وعدم رضا."],[4,0,1,0,"المفهوم الذي يضيف \"رفاهية المجتمع وحماية البيئة\" كعنصر ثالث بجانب أرباح الشركة ورغبات العميل هو:",["مفهوم التسويق الاجتماعي","المفهوم البيعي","مفهوم المنتج","المفهوم الإنتاجي"],0,"التسويق الاجتماعي يوازن بين ثلاثة أطراف: الشركة، المستهلك، والمجتمع."],[4,0,1,0,"إجمالي القيم التي يساهم بها جميع عملاء الشركة مجتمعين طوال فترة تعاملهم معها يُعرف بـ:",["قيمة حقوق العملاء (Customer Equity)","حصة السوق","التكلفة الكلية","الهامش الربحي"],0,"قيمة حقوق العملاء هي مجموع القيم الدائمة لجميع عملاء الشركة الحاليين والمحتملين."],[4,0,1,0,"أي مما يلي لا يُعد من شروط إتمام عملية التبادل التسويقي؟",["إجبار أحد الطرفين على الشراء","وجود طرفين على الأقل","امتلاك كل طرف شيئاً ذا قيمة للآخر","حرية القبول أو الرفض لكل طرف"],0,"التبادل التسويقي يقوم على الحرية والاختيار الطوعي وليس الإجبار."],[4,0,1,0,"الخطوة الأولى في نموذج العملية التسويقية المكون من 5 خطوات هي:",["فهم السوق واحتياجات ورغبات العملاء","تصميم استراتيجية تسويقية موجهة للعميل","بناء برنامج تسويقي متكامل","بناء علاقات مربحة مع العملاء"],0,"تبدأ العملية التسويقية دائماً بفهم العميل والسوق قبل اتخاذ أي قرار إنتاجي أو ترويجي."],[4,0,1,0,"الخطوة الأخيرة في نموذج العملية التسويقية والتي تجني فيها الشركة ثمار جهودها هي:",["الحصول على قيمة من العملاء (أرباح وولاء)","تصميم المنتج","تحديد السعر","التوزيع المادي"],0,"بعد تقديم القيمة وبناء العلاقة، تحصل الشركة على القيمة في شكل مبيعات وأرباح وولاء مستمر."],[4,0,1,0,"مجموعة الفوائد أو القيم التي تعد الشركة بتقديمها للمستهلكين لإشباع حاجاتهم تُسمى:",["عرض القيمة (Value Proposition)","قصر النظر التسويقي","الترويج المباشر","المزيج السلعي"],0,"عرض القيمة يجيب على سؤال العميل: لماذا أشتري علامتك التجارية بدلاً من المنافسين؟"],[4,0,1,0,"شركة تركز فقط على تطوير جودة الكاميرا والمعالج في هواتفها دون سؤال العملاء عما يريدونه فعلاً تتبع:",["مفهوم المنتج","المفهوم التسويقي","المفهوم الاجتماعي","المفهوم البيعي"],0,"التركيز الأحادي على مواصفات المنتج دون صوت العميل يمثل مفهوم المنتج."],[4,0,1,0,"يُستخدم المفهوم البيعي بكثافة عادةً مع:",["السلع غير المبحوث عنها (مثل التأمين والموسوعات)","السلع الميسرة اليومية","المواد الخام الأساسية","السلع النادرة"],0,"السلع غير المبحوث عنها لا يفكر المستهلك في شرائها تلقائياً لذا تحتاج لجهد بيعي مكثف."],[4,0,1,0,"يُطلق على العميل الذي يشتري بشكل متكرر وينشر كلاماً إيجابياً عن الشركة للآخرين اسم:",["العميل المبشّر أو المدافع (Customer Evangelist)","العميل العابر","المستهلك الصناعي","الموزع المعتمد"],0,"هؤلاء العملاء يمثلون قمة الولاء ويسوقون للشركة مجاناً."],[4,0,1,0,"أحد العوامل التي ساهمت في نمو التسويق غير الهادف للربح هو:",["الحاجة لزيادة الوعي المجتمعي وجذب التبرعات","تحقيق أرباح مالية للمساهمين","احتكار الأسواق التجارية","تخفيض الضرائب الصناعية"],0,"المؤسسات الخيرية والحكومية تستخدم التسويق لتغيير السلوكيات أو جمع التبرعات."],[4,0,1,0,"تحويل العلاقة مع العميل من مجرد صفقة بيع عابرة إلى شراكة طويلة الأمد هو جوهر:",["إدارة علاقات العملاء (CRM)","المفهوم الإنتاجي","التوزيع الانتقائي","التسعير الاختراقي"],0,"CRM يركز على بناء علاقة مستدامة ومربحة للطرفين."],[4,0,1,0,"تُعرف الفجوة بين ما يتوقعه العميل من المنتج وما يحصل عليه فعلياً عند الاستخدام بـ:",["محددات رضا العميل","تجزئة السوق","المزيج الترويجي","دورة حياة المنتج"],0,"مقارنة الأداء الفعلي بالتوقعات هي المعيار الأساسي لقياس الرضا."],[4,0,0,1,"عندما ركزت شركات السكك الحديدية الأمريكية على تحسين القطارات وتجاهلت ظهور الطائرات والسيارات باعتبارها في مجال \"النقل\"، وقعت في قصر النظر التسويقي.",["صح","خطأ"],0,"صحيح؛ هذا هو المثال الكلاسيكي الشهير لـ (Theodore Levitt) حول قصر النظر التسويقي."],[4,0,0,1,"شركة \"ستاربكس\" لا تبيع مجرد كوب قهوة، بل تبيع \"تجربة المكان الثالث\" والجو الاجتماعي المريح، مما يعكس مفهوم العروض السوقية الشاملة.",["صح","خطأ"],0,"صحيح؛ ستاربكس تدمج السلعة المادية بالخدمة والتجربة الشعورية لخلق قيمة عالية."],[4,0,0,1,"إطلاق شركة \"ماكدونالدز\" لقوائم طعام صحية (سلطات وفواكه) وتقليل السعرات الحرارية يُعد تطبيقاً لمفهوم التسويق الاجتماعي.",["صح","خطأ"],0,"صحيح؛ لأنها استجابت للضغوط الصحية والمجتمعية لحماية صحة المستهلكين بجانب تحقيق الربح."],[4,0,0,1,"إذا اشتريت هاتفاً وتوقعت أن تدوم بطاريته 10 ساعات، فوجدتها تدوم 15 ساعة، فإن حالتك تُصنف كـ \"رضا عادي\" فقط.",["صح","خطأ"],1,"خطأ؛ عندما يتجاوز الأداء الفعلي توقعات العميل بشكل ملحوظ، فإن العميل يشعر بـ \"البهجة\" (Customer Delight)."],[4,0,0,1,"نجاح شركة \"أبل\" في جعل عملائها يصطفون لساعات لشراء هاتفها الجديد يعكس ارتفاع \"قيمة حقوق العملاء\" والولاء للعلامة.",["صح","خطأ"],0,"صحيح؛ أبل نجحت في بناء ارتباط عاطفي وقيمة مدركة تفوق السعر المدفوع."],[4,0,0,1,"الفرق الجوهري بين المفهوم البيعي والمفهوم التسويقي هو أن البيعي يركز على \"حاجات البائع\" بينما التسويقي يركز على \"حاجات المشتري\".",["صح","خطأ"],0,"صحيح؛ البائع يريد تحويل منتجه لنقدية، بينما المسوق يريد إشباع حاجة العميل من خلال المنتج."],[4,0,0,1,"قيام شركة \"أمازون\" بتقديم توصيات مخصصة لكل مستخدم بناءً على مشترياته السابقة هو تطبيق عملي لإدارة علاقات العملاء (CRM).",["صح","خطأ"],0,"صحيح؛ استخدام البيانات لتخصيص التجربة يعزز العلاقة الفردية مع العميل ويزيد من ولائه."],[4,0,0,1,"شركة مصنعة للمثاقب الكهربائية تدرك أن العميل لا يريد المثقاب في حد ذاته بل يريد \"ثقباً في الحائط\"، هي شركة تتجنب قصر النظر التسويقي.",["صح","خطأ"],0,"صحيح؛ لأنها تركز على المنفعة والحل الذي يبحث عنه العميل وليس الأداة المادية."],[4,0,0,1,"التسويق التشاركي (Customer-Engagement Marketing) يعني أن الشركة تفرض رسائلها الإعلانية على المستهلك دون السماح له بالمشاركة.",["صح","خطأ"],1,"خطأ؛ التسويق التشاركي يشرك المستهلك في صناعة المحتوى وتشكيل تجارب العلامة التجارية عبر المنصات التفاعلية."],[4,0,0,1,"في أوقات الأزمات الاقتصادية وانخفاض دخول المستهلكين، قد تضطر الشركات لتبني جوانب من \"المفهوم الإنتاجي\" لتوفير منتجات بأسعار اقتصادية.",["صح","خطأ"],0,"صحيح؛ عندما يكون السعر هو العائق الأكبر، تصبح الكفاءة الإنتاجية وخفض التكلفة ميزة تنافسية حاسمة."],[4,0,0,1,"إذا كانت تكلفة اكتساب عميل جديد تبلغ 500 جنيه، بينما أرباحه المتوقعة طوال حياته (CLV) تبلغ 400 جنيه، فهذا استثمار تسويقي ناجح.",["صح","خطأ"],1,"خطأ؛ يجب أن تكون القيمة الدائمة للعميل (CLV) أعلى بكثير من تكلفة اكتسابه لضمان الربحية."],[4,0,0,1,"تُعد حملات التوعية بمخاطر التدخين أو ترشيد استهلاك المياه شكلاً من أشكال التسويق الاجتماعي للأفكار.",["صح","خطأ"],0,"صحيح؛ التسويق يشمل تسويق الأفكار والسلوكيات الإيجابية لخدمة المجتمع."],[4,0,0,1,"المنافسة الحديثة في عالم الأعمال لم تعد بين شركة وأخرى، بل أصبحت بين \"شبكات توصيل القيمة\" المتكاملة لكل شركة.",["صح","خطأ"],0,"صحيح؛ الموردون والموزعون والشركاء يشكلون مع الشركة شبكة متكاملة لتقديم القيمة للعميل."],[4,0,0,1,"تجاهل شركة \"كوداك\" للتصوير الرقمي وتمسكها بالأفلام التقليدية لأنها كانت تحقق أرباحاً عالية يُعد مثالاً على المفهوم التسويقي الحديث.",["صح","خطأ"],1,"خطأ؛ هذا مثال شهير على \"قصر النظر التسويقي\" والتمسك بالمنتج القديم على حساب تطور حاجات السوق."],[4,0,0,1,"التسويق بالمعاملات (Transaction Marketing) يهدف إلى تعظيم الربح من كل صفقة بيع منفردة دون الاهتمام بعودة العميل مرة أخرى.",["صح","خطأ"],0,"صحيح؛ وهو يرتبط بالمفهوم البيعي التقليدي على عكس تسويق العلاقات الحديث."],[4,0,0,1,"يمكن لشركة ما أن تقدم عرض قيمة يعتمد على \"أقل سعر مع جودة مقبولة\" مثل شركة الطيران الاقتصادي، ويُعد ذلك استراتيجية تسويقية سليمة.",["صح","خطأ"],0,"صحيح؛ القيمة المدركة لا تعني دائماً أعلى جودة وأعلى سعر، بل قد تعني معادلة اقتصادية عادلة لفئة مستهدفة."],[4,0,0,1,"تُعتبر \"نايكي\" (Nike) نموذجاً للشركات التي تبني علاقة عاطفية مع عملائها من خلال ربط علامتها بقيم الإنجاز والتحدي وليس مجرد بيع أحذية رياضية.",["صح","خطأ"],0,"صحيح؛ شعار \"Just Do It\" يبيع الإلهام والهوية الرياضية للعميل."],[4,0,0,1,"التسويق مسؤولية قسم التسويق وحده داخل المنظمة، ولا علاقة للأقسام الأخرى مثل الإنتاج أو خدمة العملاء برضا المستهلك.",["صح","خطأ"],1,"خطأ؛ التسويق فلسفة شاملة تتطلب تضافر جميع إدارات الشركة لتقديم قيمة متفوقة للعميل."],[4,0,0,1,"استخدام الذكاء الاصطناعي في خدمة العملاء (Chatbots) لتقديم دعم فوري على مدار الساعة يرفع من القيمة المدركة عبر تقليل التكلفة الزمنية للعميل.",["صح","خطأ"],0,"صحيح؛ توفير وقت وجهد العميل يزيد من القيمة الإجمالية المدركة للخدمة."],[4,0,0,1,"التسويق الأخلاقي يتطلب من الشركات الامتناع عن المبالغة في الوعود الإعلانية حتى لا ترفع توقعات العميل لمستوى يعجز المنتج عن تحقيقه.",["صح","خطأ"],0,"صحيح؛ رفع التوقعات بشكل مبالغ فيه يؤدي حتماً إلى عدم الرضا وفقدان الثقة."],[4,0,1,1,"شركة تصنع مساحيق غسيل وتستبدل عبواتها البلاستيكية بأخرى قابلة للتحلل الحيوي لحماية البيئة رغم ارتفاع التكلفة قليلاً، هي تطبق:",["مفهوم التسويق الاجتماعي","المفهوم الإنتاجي","المفهوم البيعي","قصر النظر التسويقي"],0,"الموازنة بين الربح، إشباع العميل، وحماية البيئة تمثل جوهر التسويق الاجتماعي."],[4,0,1,1,"شاب يشعر بالعطش الشديد، ففكر في شرب كوب ماء بارد، ولكنه قرر شراء علبة \"بيبسي\" لامتلاكه ثمنها. ما يمثله العطش والبيبسي والمال على الترتيب هو:",["حاجة - رغبة - طلب","رغبة - حاجة - طلب","طلب - رغبة - حاجة","حاجة - طلب - رغبة"],0,"العطش حاجة فطرية، اختيار البيبسي رغبة ثقافية، ووجود المال يحولها لطلب."],[4,0,1,1,"عندما تقول شركة \"رولكس\" للساعات: \"نحن لا نبيع أداة لمعرفة الوقت، بل نبيع المكانة الاجتماعية والتميز\"، فإنها تتجنب:",["قصر النظر التسويقي","إدارة علاقات العملاء","التسويق الاجتماعي","المنافسة السعرية"],0,"لأنها فهمت المنفعة النفسية وال ظمة.",["صح","خطأ"],0,"صحيح؛ O و T تمثلان البيئة الخارجية، بينما S و W تمثلان البيئة الداخلية."],[4,1,0,0,"ينقسم الجمهور (Publics) في البيئة الجزئية إلى عدة أنواع مثل الجمهور المالي، الإعلامي، والحكومي.",["صح","خطأ"],0,"صحيح؛ الجمهور هو أي مجموعة لها اهتمام فعلي أو محتمل أو تأثير على قدرة المنظمة في تحقيق أهدافها."],[4,1,0,0,"العملاء (Customers) هم أهم عنصر في البيئة الجزئية للشركة لأن الهدف الكامل لنظام توصيل القيمة هو خدمتهم.",["صح","خطأ"],0,"صحيح؛ وتنقسم أسواق العملاء إلى أسواق مستهلكين، أسواق أعمال، أسواق حكومية، ودولية."],[4,1,0,0,"الجيل Z (Gen Z) هم الأفراد الذين ولدوا في عصر الإنترنت والهواتف الذكية ويتميزون بارتباطهم الوثيق بالتكنولوجيا.",["صح","خطأ"],0,"صحيح؛ ويعد هذا الجيل قوة شرائية متنامية ومؤثرة في قرارات الشراء العائلية."],[4,1,0,0,"القيم الثقافية الثانوية (Secondary Cultural Values) أكثر عرضة للتغيير مقارنة بالقيم الثقافية الأساسية.",["صح","خطأ"],0,"صحيح؛ فمثلاً قد يتغير أسلوب اللبس أو تسريحات الشعر (قيم ثانوية) بينما تظل قيمة الأسرة والأمانة (أساسية) ثابتة."],[4,1,0,0,"الهدف من تحليل SWOT هو مطابقة نقاط القوة الداخلية مع الفرص الخارجية، وتقليل نقاط الضعف وتجنب التهديدات.",["صح","خطأ"],0,"صحيح؛ التحليل الرباعي هو حجر الزاوية في التخطيط الاستراتيجي التسويقي."],[4,1,0,0,"تجاهل التغيرات في البيئة التسويقية لا يشكل خطراً طالما أن الشركة تمتلك منتجاً جيداً.",["صح","خطأ"],1,"خطأ؛ التغيرات البيئية المفاجئة قد تقضي على شركات كبرى إذا لم ترصدها وتتكيف معها."],[4,1,1,0,"أي من العناصر التالية ينتمي إلى \"البيئة التسويقية الجزئية\" (Microenvironment)؟",["الموردون والوسطاء التسويقيون","معدلات التضخم والبطالة","القوانين والتشريعات الحكومية","التغيرات المناخية وندرة المياه"],0,"الموردون والوسطاء عناصر قريبة تتعامل معها الشركة مباشرة ضمن بيئتها الجزئية."],[4,1,1,0,"القوى المجتمعية الأوسع التي تؤثر على البيئة الجزئية بأكملها وتقع خارج سيطرة الشركة تُعرف بـ:",["البيئة الكلية (Macroenvironment)","البيئة الداخلية","البيئة الجزئية","شبكة التوزيع"],0,"البيئة الكلية تشمل القوى الست الكبرى (الديموغرافية، الاقتصادية، الطبيعية، التكنولوجية، السياسية، الثقافية)."],[4,1,1,0,"تُعرف دراسة السكان من حيث الأعمار، معدلات المواليد، التوزيع الجغرافي، ومستويات التعليم بـ:",["البيئة الديموغرافية","البيئة الاقتصادية","البيئة التكنولوجية","البيئة الطبيعية"],0,"الديموغرافيا هي علم دراسة الخصائص السكانية."],[4,1,1,0,"في تحليل SWOT، تُصنف \"سمعة العلامة التجارية القوية وبراءات الاختراع\" ضمن:",["نقاط القوة (Strengths)","نقاط الضعف (Weaknesses)","الفرص (Opportunities)","التهديدات (Threats)"],0,"لأنها ميزة داخلية تمتلكها الشركة وتتفوق بها على منافسيها."],[4,1,1,0,"في تحليل SWOT، يُصنف \"دخول منافس أجنبي قوي للسوق أو فرض ضرائب جمركية جديدة\" ضمن:",["التهديدات (Threats)","نقاط الضعف (Weaknesses)","نقاط القوة (Strengths)","الفرص (Opportunities)"],0,"لأنها عوامل خارجية سلبية قد تضر بأداء الشركة."],[4,1,1,0,"في تحليل SWOT، يُصنف \"نمو الطلب في الأسواق الإلكترونية أو انسحاب منافس رئيسي\" ضمن:",["الفرص (Opportunities)","نقاط القوة (Strengths)","نقاط الضعف (Weaknesses)","التهديدات (Threats)"],0,"لأنها ظروف خارجية مواتية يمكن للشركة استغلالها للنمو."],[4,1,1,0,"البنوك وشركات الاستثمار والمساهمون الذين يؤثرون على قدرة الشركة في الحصول على الأموال يُطلق عليهم:",["الجمهور المالي (Financial Publics)","الجمهور الإعلامي","الجمهور الحكومي","الوسطاء الماديون"],0,"الجمهور المالي هو المسؤول عن توفير التمويل والائتمان للشركة."],[4,1,1,0,"الصحف، القنوات الفضائية، والمواقع الإخبارية والمدونون يُصنفون ضمن:",["الجمهور الإعلامي (Media Publics)","الموردين","العملاء الصناعيين","الجمهور الداخلي"],0,"الجمهور الإعلامي ينقل الأخبار والآراء حول الشركة ومنتجاتها للرأي العام."],[4,1,1,0,"التضخم، أسعار الفائدة، وتوزيع الدخل القومي هي مؤشرات رئيسية في:",["البيئة الاقتصادية","البيئة الثقافية","البيئة الديموغرافية","البيئة التكنولوجية"],0,"هذه العوامل تحدد القدرة الشرائية الحقيقية للمستهلكين."],[4,1,1,0,"الاهتمام المتزايد بالاستدامة، إعادة التدوير، والحد من الانبعاثات الكربونية يندرج تحت:",["البيئة الطبيعية","البيئة الديموغرافية","البيئة الجزئية","الوسطاء الماليين"],0,"البيئة الطبيعية تركز على الموارد البيئية وحماية الكوكب."],[4,1,1,0,"أي من القوى البيئية التالية أدت إلى ظهور التجارة الإلكترونية، الذكاء الاصطناعي، والدفع عبر الهاتف؟",["البيئة التكنولوجية","البيئة الطبيعية","البيئة الديموغرافية","البيئة السياسية"],0,"الابتكارات التكنولوجية هي المحرك الرئيسي للتحول الرقمي."],[4,1,1,0,"القوانين التي تمنع الإعلانات المضللة وتحمي حقوق الملكية الفكرية تندرج ضمن:",["البيئة السياسية والقانونية","البيئة الاقتصادية","البيئة الطبيعية","البيئة الديموغرافية"],0,"التشريعات الحكومية تنظم المنافسة وتحمي المستهلك والمجتمع."],[4,1,1,0,"القيم والمعتقدات الراسخة التي تنتقل من الآباء إلى الأبناء وتصعب تغييرها تُسمى:",["القيم الثقافية الأساسية (Core Cultural Values)","القيم الثانوية","الموضة العابرة","التفضيلات السعرية"],0,"القيم الأساسية مثل قدسية الأسرة والصدق والأمانة تتميز بالثبات الشديد."],[4,1,1,0,"الوسطاء الذين يشترون السلع ويعيدون بيعها لتحقيق الربح (مثل تجار الجملة والتجزئة) يُسمون:",["الوسطاء التجاريين (Resellers)","وكالات الخدمات التسويقية","شركات التوزيع المادي","الوسطاء الماليين"],0,"الوسطاء التجاريون يمتلكون السلعة ويعيدون بيعها للمستهلك."],[4,1,1,0,"الموظفون والمديرون وأعضاء مجلس الإدارة داخل المنظمة يمثلون:",["الجمهور الداخلي (Internal Publics)","الجمهور العام","الوسطاء التسويقيين","المنافسين المباشرين"],0,"رضا وتحفيز الجمهور الداخلي ينعكس إيجاباً على رضا العملاء الخارجيين."],[4,1,1,0,"مفهوم \"الاستدامة البيئية\" (Environmental Sustainability) يعني:",["تطوير استراتيجيات تحافظ على البيئة وتدعمها مع تحقيق أرباح للشركة","استنزاف الموارد الطبيعية بأقصى سرعة","تجاهل القوانين البيئية لتقليل التكاليف","التوقف عن الإنتاج الصناعي تماماً"],0,"الاستدامة تهدف لتلبية حاجات الحاضر دون الإضرار بقدرة الأجيال القادمة."],[4,1,1,0,"تُعرف المنظمات التي تراقب أداء الشركات وتدافع عن حقوق المستهلك أو البيئة بـ:",["جماعات العمل المدني (Citizen-Action Publics)","الموردين","الوسطاء الماليين","العملاء الحكوميين"],0,"تشمل جمعيات حماية المستهلك، منظمات حماية البيئة، وجماعات حقوق الإنسان."],[4,1,1,0,"أي من العناصر التالية يُعد عاملاً (داخلياً) في مصفوفة SWOT؟",["ضعف شبكة التوزيع الحالية للشركة","انخفاض أسعار الفائدة في البنوك","زيادة عدد السكان الشباب في الدولة","ظهور تكنولوجيا جديدة لدى المنافسين"],0,"ضعف شبكة التوزيع هو نقطة ضعف داخلية (Weakness) تخص الشركة نفسها."],[4,1,1,0,"البيئة التي تشمل جميع الإدارات داخل الشركة مثل الإدارة العليا، المالية، البحث والتطوير، والمشتريات هي:",["البيئة الداخلية للشركة (The Company)","البيئة الكلية","البيئة التكنولوجية","البيئة الثقافية"],0,"تعمل إدارة التسويق بالتنسيق الوثيق مع بقية إدارات الشركة الداخلية."],[4,1,1,0,"جيل الألفية (Millennials) يتميز ديموغرافياً بأنه:",["أكبر جيل متصل رقمياً ويقدر التجارب والأصالة في العلامات التجارية","جيل يرفض استخدام الإنترنت تماماً","جيل كبار السن المتقاعدين","جيل لا يهتم بالأسعار أو الجودة"],0,"جيل الألفية يمثل شريحة سوقية ضخمة ومؤثرة في الإنفاق الاستهلاكي."],[4,1,0,1,"ارتفاع معدلات التضخم وانخفاض القوة الشرائية في دولة ما يدفع الشركات إلى تعديل عروضها نحو \"التسويق القيمي\" (Value Marketing) وتقديم عبوات أصغر وأوفر.",["صح","خطأ"],0,"صحيح؛ في أوقات الركود والتضخم يبحث المستهلك عن القيمة مقابل السعر، فتتكيف الشركات بتقديم أحجام اقتصادية."],[4,1,0,1,"إذا كانت شركة ما تعاني من \"نقص السيولة النقدية\" (نقطة ضعف)، وفي نفس الوقت هناك \"نمو كبير في السوق\" (فرصة)، فإن أفضل استراتيجية هي الدخول في تحالف استراتيجي أو اندماج.",["صح","خطأ"],0,"صحيح؛ التحالف يعالج نقطة الضعف الداخلية (التمويل) لاقتناص الفرصة الخارجية."],[4,1,0,1,"شركة \"ماكدونالدز\" عندما تقدم برجر \"ماك أرابيا\" في الدول العربية وبرجر نباتي في الهند، فإنها تتكيف مع البيئة الديموغرافية فقط.",["صح","خطأ"],1,"خطأ؛ هذا تكيف أساسي مع \"البيئة الثقافية والدينية\" وعادات الطعام في كل مجتمع."],[4,1,0,1,"المنافسون لشركة \"ستاربكس\" يقتصرون فقط على المقاهي الأخرى مثل \"كوستا كوفي\"، ولا يشملون شركات المشروبات الغازية أو العصائر.",["صح","خطأ"],1,"خطأ؛ المنافسة تشمل المنافسة المباشرة (المقاهي) وغير المباشرة (أي مشروب يروي العطش أو يمنح الطاقة)."],[4,1,0,1,"زيادة مشاركة المرأة في سوق العمل وتأخر سن الزواج هي تغيرات ديموغرافية واجتماعية أدت لزيادة الطلب على الوجبات الجاهزة وخدمات رعاية الأطفال.",["صح","خطأ"],0,"صحيح؛ التغيرات الديموغرافية تخلق حاجات وأنماط استهلاكية جديدة تماماً."],[4,1,0,1,"استخدام شركة \"إنتل\" (Intel) لشعار \"Intel Inside\" داخل أجهزة الكمبيوتر هو مثال على تأثير \"المورد\" في خلق طلب لدى المستهلك النهائي.",["صح","خطأ"],0,"صحيح؛ إنتل مورد للمكونات لكنها سوقت لنفسها لدى المستهلك النهائي لتجبر مصنعي الحواسيب على استخدام معالجاتها."],[4,1,0,1,"النظرة الاستباقية (Proactive) للبيئة التسويقية تعني أن تنتظر الشركة حدوث التغيير البيئي ثم تحاول التكيف معه برد فعل بطيء.",["صح","خطأ"],1,"خطأ؛ النظرة الاستباقية تعني المبادرة بالتأثير في البيئة وتشكيلها (مثل الضغط لتغيير القوانين أو ابتكار تكنولوجيا تقود السوق)."],[4,1,0,1,"تُعد ارتفاع أسعار الوقود والاتجاه نحو السيارات الكهربائية فرصة لشركة \"تسلا\" (Tesla)، بينما تمثل تهديداً لشركات السيارات التقليدية.",["صح","خطأ"],0,"صحيح؛ نفس التغير البيئي قد يكون فرصة لشركة وتهديداً لأخرى حسب جاهزيتها."],[4,1,0,1,"في تحليل SWOT، لا يجوز الخلط بين \"الفرصة\" و\"الاستراتيجية\"؛ فالفرصة ظرف خارجي، أما الاستراتيجية فهي الفعل الذي تتخذه الشركة لاستغلالها.",["صح","خطأ"],0,"صحيح؛ مثلاً \"نمو التجارة الإلكترونية\" فرصة، أما \"إنشاء متجر إلكتروني\" فهو استراتيجية."],[4,1,0,1,"تنامي الوعي الصحي والاهتمام باللياقة البدنية يُعد تغيراً في البيئة الثقافية والاجتماعية أدى لازدهار النوادي الرياضية والأغذية العضوية.",["صح","خطأ"],0,"صحيح؛ تغير نظرة الناس للصحة والجمال خلق أسواقاً بمليارات الدولارات."],[4,1,0,1,"إذا أضرب عمال النقل والشحن عن العمل، فإن ذلك يؤثر على الشركة من خلال عنصر \"الوسطاء التسويقيين\" في البيئة الجزئية.",["صح","خطأ"],0,"صحيح؛ شركات التوزيع المادي والنقل جزء أساسي من الوسطاء التسويقيين."],[4,1,0,1,"قوانين حماية البيانات والخصوصية (مثل GDPR في أوروبا) تمثل قيداً من البيئة السياسية والتكنولوجية يؤثر على التسويق الرقمي.",["صح","خطأ"],0,"صحيح؛ تقيد هذه القوانين كيفية جمع واستخدام بيانات المستهلكين في الإعلانات المستهدفة."],[4,1,0,1,"تحول المستهلكين من الشراء النقدي إلى الشراء بالتقسيط وتطبيقات (اشتر الآن وادفع لاحقاً BNPL) يعكس تفاعلاً بين البيئة الاقتصادية والتكنولوجية.",["صح","خطأ"],0,"صحيح؛ تراجع السيولة (اقتصادي) مع ابتكار تطبيقات التمويل الميسر (تكنولوجي) غير سلوك الدفع."],[4,1,0,1,"تُعتبر \"التوقعات المتفائلة\" للإدارة حول المبيعات المستقبلية نقطة قوة (Strength) حقيقية في تحليل SWOT.",["صح","خطأ"],1,"خطأ؛ نقاط القوة يجب أن تكون حقائق ملموسة ومثبتة (مثل حصة سوقية، براءة اختراع، كفاءة عالية) وليست مجرد أمنيات."],[4,1,0,1,"ارتفاع نسبة كبار السن في دول مثل اليابان وألمانيا يُعد تغيراً ديموغرافياً يقلل من فرص شركات الرعاية الصحية والسياحة العلاجية.",["صح","خطأ"],1,"خطأ؛ بل يمثل فرصة ذهبية للشركات العاملة في الرعاية الصحية، الأدوية، والترفيه الموجه لكبار السن."],[4,1,0,1,"مقاطعة المستهلكين لمنتجات شركة ما بسبب موقفها من قضية بيئية أو مجتمعية يمثل ضغطاً من \"الجمهور العام\" وجماعات العمل المدني.",["صح","خطأ"],0,"صحيح؛ الرأي العام ووسائل التواصل الاجتماعي أصبحت قوة ضغط مؤثرة جداً على الشركات."],[4,1,0,1,"لا تتأثر الشركات الصغيرة بالبيئة الكلية لأن تأثير البيئة الكلية يقتصر فقط على الشركات متعددة الجنسيات.",["صح","خطأ"],1,"خطأ؛ الجميع يتأثر بالبيئة الكلية، بل قد تكون الشركات الصغيرة أكثر هشاشة أمام التضخم أو القوانين الجديدة."],[4,1,0,1,"استبدال الفحم والنفط بالطاقة الشمسية وطاقة الرياح في المصانع هو استجابة لضغوط البيئة الطبيعية والتشريعات الحكومية.",["صح","خطأ"],0,"صحيح؛ لتقليل البصمة الكربونية وتجنب الغرامات البيئية."],[4,1,0,1,"عندما تقوم شركة بتدريب موظفي خدمة العملاء لتحسين تعاملهم مع الجمهور، فإنها تعالج عاملاً في البيئة الداخلية والجزئية.",["صح","خطأ"],0,"صحيح؛ الموظفون هم الجمهور الداخلي وواجهة الشركة أمام العملاء."],[4,1,0,1,"تُعد التقاليد الرمضانية في العالم العربي وزيادة الإقبال على التمور والمشروبات الرمضانية مثالاً على تأثير البيئة الثقافية والدينية على الطلب الموسمي.",["صح","خطأ"],0,"صحيح؛ الثقافة والدين يحددان مواسم الذروة الاستهلاكية ونوعية المنتجات المطلوبة."],[4,1,1,1,"شركة تصنيع سيارات تواجه ارتفاعاً حاداً في أسعار الصلب والرقائق الإلكترونية العالمية. هذا التحدي يرتبط مباشرة بـ:",["الموردين في البيئة الجزئية","الجمهور الإعلامي","البيئة الديموغرافية","الوسطاء الماليين"],0,"الصلب والرقائق مدخلات إنتاج يوفرها الموردون، وارتفاع تكلفتها يهدد ربحية الشركة."],[4,1,1,1,"قامت دولة بفرض ضرائب مرتفعة على المشروبات الغازية المحلاة للحد من السمنة. بالنسبة لشركات المياه الغازية، يُعد هذا القرار:",["تهديداً من البيئة السياسية والقانونية","نقطة ضعف داخلية","فرصة ديموغرافية","نقطة قوة تسويقية"],0,"الضرائب الحكومية عامل خارجي سلبي (تهديد) ينبع من البيئة السياسية والقانونية."],[4,1,1,1,"شركة تمتلك فريق بحث وتطوير عبقري (قوة) وتلاحظ تزايد اهتمام الشباب بالذكاء الاصطناعي (فرصة). الاستراتيجية الأنسب في مصفوفة SWOT هي:",["استراتيجية هجومية (SO): إطلاق منتجات ذكية مبتكرة للشباب","استراتيجية دفاعية (WT): الانسحاب من السوق","استراتيجية علاجية (WO): بيع براءات الاختراع","تجميد نشاط البحث والتطوير"],0,"استغلال نقاط القوة لاقتناص الفرص يُعرف بالاستراتيجية الهجومية (SO)."],[4,1,1,1,"ظهور تطبيقات التوصيل السريع (مثل طلبات ومرسول) مثّل بالنسبة للمطاعم التقليدية التي لا تمتلك خدمة توصيل:",["فرصة للتوسع والوصول لعملاء جدد عبر الشراكة معهم كوسطاء","نقطة ضعف داخلية لا يمكن حلها","تغييراً في البيئة الديموغرافية","قانوناً حكومياً ملزماً"],0,"تطبيقات التوصيل تعمل كوسطاء تسويقيين يفتحون أسواقاً جديدة للمطاعم."],[4,1,1,1,"تراجع مبيعات الساعات السويسرية التقليدية في السبعينيات بسبب ظهور ساعات الكوارتز اليابانية الرقمية كان نتيجة إغفال:",["البيئة التكنولوجية","البيئة الطبيعية","الجمهور المالي","البيئة الديموغرافية"],0,"التفوق التكنولوجي الياباني غير قواعد المنافسة في صناعة الساعات."],[4,1,1,1,"إذا أظهرت الإحصاءات أن 60% من سكان دولة ما هم تحت سن الـ 30 عاماً، فإن هذا المؤشر ينتمي إلى:",["البيئة الديموغرافية","البيئة الطبيعية","البيئة السياسية","الجمهور الداخلي"],0,"التركيب العمري للسكان هو أحد أهم متغيرات البيئة الديموغرافية."],[4,1,1,1,"قيام شركة \"أبل\" بإزالة الشاحن السلكي من علب هواتف الآيفون بحجة تقليل النفايات الإلكترونية وانبعاثات الكربون يرتبط بـ:",["البيئة الطبيعية والاستدامة","البيئة الديموغرافية","الجمهور المالي","الوسطاء التجاريين"],0,"ربطت أبل هذا القرار بحماية البيئة وتقليل المخلفات الإلكترونية."],[4,1,1,1,"عندما تراقب شركة \"بيبسي\" تحركات شركة \"كوكاكولا\" وحملاتها الإعلانية وأسعارها، فإنها تراقب عنصراً في:",["البيئة الجزئية (المنافسون)","البيئة الكلية (الاقتصادية)","البيئة الطبيعية","البيئة الثقافية"],0,"المنافسون جزء أساسي من البيئة الجزئية المباشرة للشركة."],[4,1,1,1,"الأزمة المالية العالمية في عام 2008 والتي أدت لتسريح العمال وانخفاض الإنفاق الاستهلاكي هي مثال صارخ على تأثير:",["البيئة الاقتصادية","البيئة الطبيعية","البيئة التكنولوجية","البيئة الديموغرافية"],0,"الأزمات المالية والركود تؤثر مباشرة على القدرة الشرائية وثقة المستهلك."],[4,1,1,1,"لجوء الشركات إلى تعيين مديرين للشؤون الحكومية وجماعات الضغط (Lobbying) للتأثير على التشريعات يعكس:",["المنظور التفاعلي أو الاستباقي تجاه البيئة التسويقية","الاستسلام التام للبيئة","تجاهل القوانين","التركيز على البيئة الداخلية فقط"],0,"بدلاً من قبول القوانين كأمر واقع، تحاول الشركات الكبرى التأثير في صياغتها."],[4,1,1,1,"تغير نظرة المجتمع في العقود الأخيرة تجاه دور الرجل والمرأة، حيث أصبح الرجال يشاركون في التسوق المنزلي ورعاية الأطفال، يمثل تغيراً في:",["البيئة الثقافية والاجتماعية","البيئة الطبيعية","البيئة التكنولوجية","البيئة السياسية"],0,"تغير الأدوار الاجتماعية هو تحول ثقافي يجبر المسوقين على تعديل رسائلهم الإعلانية."],[4,1,1,1,"في تحليل SWOT، إذا كانت الشركة تعاني من \"ارتفاع تكلفة الإنتاج\" (ضعف) وتواجه \"دخول منافسين بأسعار رخيصة\" (تهديد)، فإن وضعها يتطلب:",["استراتيجية دفاعية (WT) لإعادة الهيكلة وخفض التكاليف أو الانسحاب","التوسع العشوائي في الأسواق","رفع الأسعار بشكل أكبر","تجاهل المنافسين"],0,"اجتماع الضعف الداخلي مع التهديد الخارجي يمثل أخطر وضع في مصفوفة SWOT."],[4,1,1,1,"شركة مستحضرات تجميل توقفت عن إجراء التجارب على الحيوانات استجابة لحملات جمعيات الرفق بالحيوان. هذه الجمعيات تُصنف كـ:",["جماعات العمل المدني (الجمهور)","موردين","وسطاء تجاريين","عملاء صناعيين"],0,"المنظمات الحقوقية والبيئية تمثل جماعات ضغط مؤثرة على قرارات الشركات."],[4,1,1,1,"اتجاه المستهلكين نحو \"العمل عن بُعد\" (Remote Work) بعد جائحة كورونا خلق فرصة هائلة لشركات مثل:",["Zoom ومصنعي الأثاث المكتبي المنزلي","شركات الطيران السياحي","الفنادق الكبرى","شركات تأجير المكاتب الإدارية"],0,"العمل عن بعد عزز الطلب على برمجيات التواصل وتجهيزات المكاتب المنزلية."],[4,1,1,1,"أي من العبارات التالية صحيحة بخصوص \"البيئة الداخلية\" للشركة؟",["يجب أن تعمل جميع الإدارات بانسجام لخلق قيمة متفوقة للعميل","قسم التسويق هو الوحيد المسؤول سعر، يُسمى ذلك:",["إعادة الشراء المعدل (Modified Rebuy)","إعادة الشراء الروتيني","الشراء الجديد كلياً","الشراء العشوائي"],0,"يمثل هذا الموقف فرصة للموردين الخارجيين (Out-suppliers) لاقتناص الصفقة من المورد الحالي."],[4,3,1,0,"الموقف الشرائي الذي يواجه فيه مركز الشراء أعلى درجات المخاطرة وعدم التأكد ويستغرق أطول وقت هو:",["الشراء الجديد (New Task)","إعادة الشراء الروتيني","إعادة الشراء المعدل","الشراء التلقائي"],0,"لأن المنظمة تشتري المنتج لأول مرة وليس لديها خبرة سابقة به."],[4,3,1,0,"في مركز الشراء، يُطلق على المهندسين والفنيين الذين يضعون المواصفات الفنية للمنتج اسم:",["المؤثرون (Influencers)","حراس البوابة (Gatekeepers)","المشترون (Buyers)","المستخدمون (Users)"],0,"المؤثرون يوجهون القرار عبر وضع المعايير الفنية التي يجب توافرها في المنتج."],[4,3,1,0,"الأفراد الذين يتحكمون في تدفق المعلومات والكتالوجات ومواعيد المقابلات مع أعضاء مركز الشراء هم:",["حراس البوابة (Gatekeepers)","المقررون (Deciders)","المستخدمون (Users)","الموردون"],0,"تشمل هذه الفئة السكرتارية وموظفي الاستقبال وأخصائيي المشتريات المبدئيين."],[4,3,1,0,"الشخص الذي يملك السلطة الرسمية للتفاوض على الأسعار وتوقيع عقود الشراء مع الموردين هو:",["المشتري (Buyer)","المستخدم (User)","حارس البوابة (Gatekeeper)","المستهلك النهائي"],0,"مدير أو أخصائي المشتريات هو المسؤول التعاقدي والتفاوضي."],[4,3,1,0,"المرحلة الأولى في عملية الشراء الصناعي المكونة من 8 مراحل هي:",["إدراك المشكلة أو الحاجة (Problem Recognition)","تحديد مواصفات المنتج","البحث عن الموردين","اختيار المورد"],0,"تبدأ العملية بإدراك حاجة داخلية (مثل تعطل آلة) أو خارجية (رؤية تقنية جديدة)."],[4,3,1,0,"المرحلة الأخيرة في عملية الشراء الصناعي هي:",["مراجعة وتقييم الأداء (Performance Review)","إصدار أمر الشراء الروتيني","تقديم العروض الفنية","تحديد المواصفات"],0,"يُقيّم المشتري مدى التزام المورد بالجودة والمواعيد ليقرر استمرار التعامل أو إيقافه."],[4,3,1,0,"التسويق الإلكتروني بين المنظمات (E-Procurement) يوفر للمشترين الصناعيين ميزة:",["تقليل تكاليف المعاملات وتسريع عملية الشراء والوصول لموردين عالميين","إلغاء الحاجة لمواصفات الجودة","زيادة البيروقراطية ال ","ثبات الطلب الصناعي مهما تغير السوق","سرعة شحن البضائع بالقطارات","انخفاض أسعار المواد الخام باستمرار"],0,"زيادة طلب المستهلكين بنسبة 10% قد تدفع المصانع لزيادة طلبها على المعدات بنسبة 200%."],[4,3,1,0,"في أسواق الأعمال، تكون العلاقة بين البائع والمشتري علاقة:",["اعتماد متبادل وتعاون طويل الأمد (تطوير مشترك)","صراع ومواجهة لمرة واحدة","علاقة مجهولة الهوية","علاقة قائمة على العاطفة فقط"],0,"نجاح المورد مرتبط بنجاح العميل الصناعي ونموه في السوق."],[4,3,1,0,"المعاملة بالمثل (Reciprocity) في الشراء الصناعي تعني:",["تفضيل المشتري التعامل مع الموردين الذين يشترون منه منتجاته أيضاً","إرجاع البضاعة التالفة للمورد","دفع الثمن نقداً عند الاستلام","الاعتماد على المناقصات السرية"],0,"مبدأ \"اشترِ مني وأشتري منك\" شائع في بعض القطاعات الصناعية."],[4,3,0,1,"إذا ارتفع سعر الصلب عالمياً بنسبة 5%، فلن تتوقف شركات تصنيع السيارات فوراً عن شرائه في الأجل القصير لأن الطلب على الصلب غير مرن (Inelastic).",["صح","خطأ"],0,"صحيح؛ تكلفة الصلب تمثل جزءاً من تكلفة السيارة ولا يوجد بديل فوري له في خطوط الإنتاج."],[4,3,0,1,"قيام شركة \"إنتل\" (Intel) بحملات إعلانية موجهة للمستهلكين النهائيين رغم أنها تبيع معالجاتها لمصنعي الحواسيب (B2B) هو استراتيجية ذكية للتغلب على مشكلة \"الطلب المشتق\".",["صح","خطأ"],0,"صحيح؛ بتحفيز طلب المستهلك النهائي على أجهزة تحمل معالج إنتل، تضمن إنتل استمرار طلب مصنعي الحواسيب عليها."],[4,3,0,1,"في موقف \"إعادة الشراء الروتيني\"، يجب على المورد الخارجي (Out-Supplier) محاولة إقناع المشتري بتجربة طلبية صغيرة أو عرض حل لمشكلة لم ينتبه لها المورد الحالي لتحويل الموقف إلى \"إعادة شراء معدل\".",["صح","خطأ"],0,"صحيح؛ هذه هي الطريقة الوحيدة لكسر روتين الشراء لدى العميل الصناعي."],[4,3,0,1,"عندما تشتري جامعة نظاماً إلكترونياً لإدارة التعليم لأول مرة، فإن سكرتيرة عميد الكلية التي ترفض تمرير مكالمات مندوبي شركات البرمجيات تمارس دور \"المقرر\" (Decider).",["صح","خطأ"],1,"خطأ؛ السكرتيرة هنا تمارس دور \"حارس البوابة\" (Gatekeeper) لأنها تتحكم في تدفق المعلومات والوصول لصناع القرار."],[4,3,0,1,"تُعد مبيعات الطائرات التجارية من شركة \"بوينغ\" (Boeing) إلى شركات الطيران مثالاً نموذجياً على \"الشراء النظمي\" (Systems Selling) حيث توفر بوينغ الطائرة والتدريب والصيانة والتمويل.",["صح","خطأ"],0,"صحيح؛ الشركات الكبرى تبيع حزمة حلول متكاملة وليس مجرد هيكل الطائرة."],[4,3,0,1,"في أسواق الأعمال (B2B)، يقتصر التقييم عند اختيار المورد على \"أقل سعر مقدم\" فقط، ولا يُنظر إلى جودة الخدمة أو الالتزام بمواعيد التسليم.",["صح","خطأ"],1,"خطأ؛ السعر المنخفض مع تأخر التوريد قد يوقف خط الإنتاج ويكبد المصنع خسائر فادحة، لذا الجودة والالتزام أولوية قصوى."],[4,3,0,1,"شراء مصنع ملابس لأزرار وخيوط عادية كل أسبوع من نفس المورد هو \"إعادة شراء روتيني\"، بينما شراؤه لأول مرة لروبوتات قص القماش بالليزر هو \"شراء جديد\".",["صح","خطأ"],0,"صحيح؛ الفرق يكمن في الجدة، التكلفة، ومستوى المخاطرة الفنية والمالية."],[4,3,0,1,"تتميز الأسواق الحكومية بمرونة وسرعة اتخاذ قرار الشراء دون الحاجة إلى مستندات أو مناقصات علنية.",["صح","خطأ"],1,"خطأ؛ الأسواق الحكومية تخضع لرقابة صارمة وبيروقراطية ومناقصات عامة وتفضل غالباً العروض الأقل سعراً المطابقة للمواصفات."],[4,3,0,1,"قد يضم \"مركز الشراء\" لشراء جهاز أشعة مقطعية لمستشفى: الأطباء (مستخدمون)، مهندسي الأجهزة الطبية (مؤثرون)، مدير المشتريات (مشتري)، ومدير المستشفى (مقرر).",["صح","خطأ"],0,"صحيح؛ هذا مثال واقعي يوضح تعدد الأدوار والتخصصات داخل مركز الشراء."],[4,3,0,1,"البائعين في أسواق الأعمال (B2B) يحتاجون لفهم عملاء عملائهم (المستهلك النهائي) للتنبؤ بدقة بالطلب المستقبلي على منتجاتهم الصناعية.",["صح","خطأ"],0,"صحيح؛ نظراً لطبيعة الطلب المشتق، فإن مراقبة سوق المستهلك النهائي ضرورة لنجاح المسوق الصناعي."],[4,3,0,1,"العوامل العاطفية والشخصية (مثل الخوف من الفشل الوظيفي أو الطموح للترقية) لا تؤثر إطلاقاً على أعضاء مركز الشراء لأنهم يتصرفون كآلات منطقية.",["صح","خطأ"],1,"خطأ؛ رغم أن القرارات الصناعية عقلانية وفنية بالأساس، إلا أن أعضاء مركز الشراء بشر يتأثرون بمخاوفهم الشخصية وعلاقاتهم مع مندوبي المبيعات."],[4,3,0,1,"تطبيق أنظمة الربط الإلكتروني المباشر (EDI) بين مخازن مصنع السيارات ومخازن مورد الإطارات لإرسال الطلبيات آلياً عند انخفاض المخزون يعزز ولاء المورد الحالي.",["صح","خطأ"],0,"صحيح؛ هذا الاندماج التقني يجعل من الصعب والمكلف على المشتري تغيير المورد."],[4,3,0,1,"الطلب على خدمات المحاسبة والاستشارات القانونية للشركات يُعد جزءاً من أسواق الأعمال (B2B).",["صح","خطأ"],0,"صحيح؛ أسواق الأعمال تشمل السلع المادية والخدمات المهنية الموجهة للمنظمات."],[4,3,0,1,"تُعد شركة \"سيسكو\" (Cisco) للشبكات نموذجاً للشركات التي تعتمد البيع الاستشاري (Consultative Selling) حيث يدرس مهندسوها مشكلة العميل ويصممون له حلاً مخصصاً.",["صح","خطأ"],0,"صحيح؛ في الحلول التقنية المعقدة يتحول مندوب المبيعات إلى مستشار تقني."],[4,3,0,1,"في مرحلة \"طلب العروض\" (Proposal Solicitation) في الشراء الصناعي المعقد، يكتفي الموردون بإرسال ورقة واحدة مكتوب عليها السعر فقط.",["صح","خطأ"],1,"خطأ؛ يقدم الموردون عروضاً فنية ومالية مفصلة وقد يقومون بعروض تقديمية (Presentations) أمام لجنة الشراء."],[4,3,0,1,"إدارة علاقات الموردين (SRM) لا تقل أهمية عن إدارة علاقات العملاء (CRM) في الشركات الصناعية الحديثة.",["صح","خطأ"],0,"صحيح؛ الشراكة القوية مع الموردين تضمن استقرار الإمدادات والابتكار المشترك."],[4,3,0,1,"زيادة مبيعات السيارات الكهربائية عالمياً أدت لطفرة هائلة في الطلب على معدن \"الليثيوم\" المستخدم في البطاريات؛ هذا تطبيق لمفهوم الطلب المشتق.",["صح","خطأ"],0,"صحيح؛ الطلب على الليثيوم مشتق مباشرة من الطلب على السيارات الكهربائية."],[4,3,0,1,"تُعتبر المدارس والجامعات والمستشفيات الحكومية مثالاً على \"أسواق إعادة البيع\" (Reseller Markets).",["صح","خطأ"],1,"خطأ؛ أسواق إعادة البيع هي تجار الجملة والتجزئة، أما المدارس والمستشفيات فهي \"أسواق مؤسسية\"."],[4,3,0,1,"في موقف \"الشراء الجديد\"، يلعب رجال البيع الشخصي والتسويق بالمحتوى التقني (White Papers & Case Studies) دوراً حاسماً في إقناع مركز الشراء.",["صح","خطأ"],0,"صحيح؛ لأن العميل يبحث عن المعرفة والموثوقية لتقليل مخاطر القرار الجديد."],[4,3,0,1,"إذا كان المورد الحالي يقدم خدمة ممتازة وتوصيلاً دقيقاً، فإن أفضل استراتيجية له هي الاستمرار في تحسين القيمة للحفاظ على الموقف كـ \"إعادة شراء روتيني\".",["صح","خطأ"],0,"صحيح؛ منع العميل من التفكير في البحث عن بدائل هو هدف المورد الحالي."],[4,3,1,1,"ارتفع طلب المستهلكين على شراء الشقق السكنية بنسبة 15%، فقامت شركات المقاولات بزيادة طلبها على الرافعات ومعدات البناء بنسبة 120%. هذا المثال يوضح خاصيتين في أسواق الأعمال هما:",["الطلب المشتق وتقلب الطلب (مبدأ المعجل)","مرونة الطلب السعرية والشراء الروتيني","التوزيع المكثف والشراء الاندفاعي","الولاء بالعادة والتنافر المعرفي"],0,"الطلب على الرافعات مشتق من طلب الشقق، والزيادة المضاعفة تمثل تقلب الطلب."],[4,3,1,1,"مصنع للأغذية يشتري السكر أسبوعياً من نفس المورد، ولكن مدير الجودة لاحظ تكتل السكر في الشحنة الأخيرة، فقررت الإدارة مراجعة الموردين الآخرين. تحول موقف الشراء هنا من:",["إعادة شراء روتيني إلى إعادة شراء معدل","شراء جديد إلى إعادة شراء روتيني","إعادة شراء معدل إلى شراء استهلاكي","شراء نظمي إلى شراء اندفاعي"],0,"ظهور مشكلة في الجودة كسر الروتين ودفع الشركة لإعادة تقييم الشروط والموردين."],[4,3,1,1,"في شركة برمجيات، اقترح المبرمجون شراء خوادم سحابية جديدة، وحدد مدير أمن المعلومات معايير التشفير المطلوبة، وتفاوض مدير المشتريات على السعر، واعتمد المدير التنفيذي العقد. من الذي قام بدور \"المؤثر\" (Influencer)؟",["مدير أمن المعلومات","المدير التنفيذي","مدير المشتريات","المبرمجون فقط"],0,"وضع المواصفات والمعايير الفنية التي تقيد الاختيار هو الدور الجوهري للمؤثر."],[4,3,1,1,"مندوب مبيعات لشركة معدات طبية يحاول مقابلة رئيس قسم الجراحة في مستشفى خاص، لكن موظف المشتريات يرفض تحديد موعد بحجة انشغال الطبيب. موظف المشتريات هنا يمارس دور:",["حارس البوابة (Gatekeeper)","المستخدم (User)","المقرر النهائي (Decider)","المورد الخارجي"],0,"التحكم في قنوات الاتصال ومنع الوصول لصناع القرار هو وظيفة حارس البوابة."],[4,3,1,1,"لماذا تُعد أسواق الأعمال (B2B) أكثر \"تركزاً جغرافياً\" من أسواق المستهلكين؟",["لأن الصناعات المتشابهة تتجمع غالباً في مدن ومناطق صناعية محددة","لأن المستهلكين يعيشون في مدينة واحدة فقط","بسبب عدم وجود وسائل نقل بين المدن","لأن القوانين تمنع البيع خارج العاصمة"],0,"مثل تركز صناعة السيارات في ديترويت أو صناعة التكنولوجيا في وادي السيليكون."],[4,3,1,1,"شركة اتصالات تعرض على البنوك حزمة متكاملة تشمل: خطوط الإنترنت فائقة السرعة، أنظمة الحماية السيبرانية، وخدمة الصيانة على مدار الساعة في عقد واحد. هذا الأسلوب يُعرف بـ:",["الشراء/البيع النظمي (Systems Selling)","إعادة الشراء ال
