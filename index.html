<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة الفرقة الثانية | بنك الأسئلة التفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('sy_theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
<style>
:root{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--soft:#f1f5f9;--blue:#2563eb;--indigo:#4338ca;--teal:#0d9488;--amber:#fbbf24;--ok:#059669;--okbg:#ecfdf5;--bad:#e11d48;--badbg:#fff1f2;--sh:0 10px 30px -12px rgba(15,23,42,.18)}
.dark{--bg:#020617;--card:#0f172a;--ink:#f1f5f9;--mute:#94a3b8;--line:#1e293b;--soft:#1e293b;--ok:#34d399;--okbg:rgba(16,185,129,.12);--bad:#fb7185;--badbg:rgba(244,63,94,.12);--sh:0 10px 30px -12px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0}
body{font-family:'Cairo','Tajawal',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;min-height:100vh;display:flex;flex-direction:column;transition:background-color .3s,color .3s}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
::selection{background:var(--blue);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(59,130,246,.4);border-radius:9px}
.hide{display:none!important}
@keyframes up{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{50%{opacity:.35}}
.in{animation:up .3s ease-out both}
/* header */
.hdr{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.hdr>div{max-width:1152px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center;cursor:pointer;margin-inline-end:auto}
.tile{width:44px;height:44px;border-radius:16px;background:linear-gradient(135deg,#2563eb,#4338ca);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;box-shadow:0 8px 16px -6px rgba(37,99,235,.5);flex:none}
.brand h1{font-size:19px;font-weight:800;line-height:1.2}.brand p{font-size:12px;color:var(--blue);font-weight:600}
.b{border:0;border-radius:12px;padding:9px 16px;font-weight:700;font-size:14px;background:var(--soft);transition:.2s;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.b:hover:not(:disabled){filter:brightness(.95);transform:translateY(-1px)}
.b:active:not(:disabled){transform:scale(.98)}.b:disabled{opacity:.45;cursor:not-allowed}
.b.pri{background:linear-gradient(135deg,#2563eb,#4338ca);color:#fff;box-shadow:0 8px 18px -8px rgba(37,99,235,.7)}
.b.amb{background:var(--amber);color:#0f172a;font-weight:900;box-shadow:0 8px 18px -8px rgba(245,158,11,.6)}
.b.lg{padding:14px 24px;font-size:16px;border-radius:14px}.b.w{width:100%}
.live{display:inline-flex;gap:6px;align-items:center;padding:5px 12px;border-radius:12px;font-size:12px;font-weight:700;background:rgba(16,185,129,.1);color:var(--ok);border:1px solid rgba(16,185,129,.25)}
.live i{width:8px;height:8px;border-radius:50%;background:#10b981;animation:pulse 1.6s infinite}
/* layout */
main{flex:1;width:100%;max-width:1152px;margin:auto;padding:28px 16px 60px;display:grid;gap:26px;align-content:start}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:34px;color:#fff;background:linear-gradient(to left,#1d4ed8,#4338ca 55%,#0f172a);box-shadow:0 20px 40px -18px rgba(37,99,235,.55);display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(40px);pointer-events:none}
.hero::before{width:260px;height:260px;left:-60px;bottom:-70px;background:rgba(96,165,250,.22)}
.hero::after{width:200px;height:200px;right:40px;top:-60px;background:rgba(129,140,248,.22)}
.hero>*{position:relative;z-index:1}
.hero .txt{max-width:640px;display:grid;gap:12px}
.hero h2{font-size:clamp(24px,4vw,36px);font-weight:900;line-height:1.35}
.hero p{color:rgba(219,234,254,.92)}
.glass{display:inline-flex;gap:8px;padding:4px 14px;border-radius:99px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);font-size:13px;font-weight:700;width:fit-content}
.exam{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:20px;display:grid;gap:12px;min-width:min(300px,100%)}
.exam small{color:#fcd34d;font-weight:700}.exam h3{font-size:20px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--sh)}
.card h3.sec{font-size:19px;font-weight:800;margin-bottom:14px}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
label.f{display:grid;gap:6px;font-weight:700;font-size:14px}
select,input.i{background:var(--soft);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;width:100%}
select:focus,input.i:focus{border-color:var(--blue);outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.cc{--g:linear-gradient(135deg,#2563eb,#4338ca);text-align:start;display:grid;gap:10px;padding:22px;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);transition:transform .25s cubic-bezier(.4,0,.2,1),border-color .25s;position:relative;overflow:hidden}
.cc:hover{transform:translateY(-4px);border-color:var(--blue)}
.cc .ic{width:52px;height:52px;border-radius:18px;background:var(--g);display:grid;place-items:center;font-size:26px;box-shadow:0 10px 18px -8px rgba(0,0,0,.35)}
.cc h3{font-size:19px;font-weight:800;line-height:1.5}
.mt{color:var(--mute);font-size:13px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:2px 10px;border-radius:99px;background:var(--soft);font-size:12px;font-weight:700;color:var(--mute)}
.bar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--g,var(--blue));transition:width .4s}
.ch{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ch .ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:rgba(255,255,255,.18)}
/* quiz */
.qh{display:grid;gap:12px}
.qrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pill{padding:5px 12px;border-radius:12px;background:var(--soft);font-weight:700;font-size:13px}
.pill.t{font-variant-numeric:tabular-nums;background:rgba(37,99,235,.1);color:var(--blue)}
.big-bar{height:10px;border-radius:9px;background:var(--soft);overflow:hidden}.big-bar i{display:block;height:100%;background:linear-gradient(to left,#4338ca,#2563eb,#0d9488);border-radius:9px;transition:width .35s}
.qt{font-size:clamp(19px,2.6vw,24px);font-weight:700;line-height:1.9;margin:6px 0 20px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bd{padding:2px 12px;border-radius:99px;font-size:12px;font-weight:800;background:rgba(37,99,235,.1);color:var(--blue)}
.bd.e{background:rgba(16,185,129,.12);color:var(--ok)}.bd.m{background:rgba(245,158,11,.15);color:#b45309}.dark .bd.m{color:#fbbf24}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:start;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:17px;font-weight:600;transition:.2s;width:100%}
.opt b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:14px;font-weight:800}
.opt:hover:not(:disabled){border-color:var(--blue);transform:translateX(-3px)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt.sel{border-color:var(--blue);background:rgba(37,99,235,.08)}.opt.sel b{background:var(--blue);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok b{background:var(--ok);color:#fff}
.opt.no{border-color:var(--bad);background:var(--badbg)}.opt.no b{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.exp{margin-top:16px;border-radius:16px;padding:14px 16px;border:1px solid var(--line);background:var(--soft)}
.exp.ok{border-inline-start:5px solid var(--ok)}.exp.no{border-inline-start:5px solid var(--bad)}
.exp strong{display:block;margin-bottom:2px}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:20px}
/* result */
.res{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:center}
.ring{position:relative;width:200px;height:200px;margin:auto}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.ring .tr{stroke:var(--soft)}.ring .pg{transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.st{border-radius:18px;padding:14px;background:var(--soft);display:grid;gap:2px}.st b{font-size:26px;font-weight:900}.st span{font-size:13px;color:var(--mute);font-weight:700}
.rev{display:grid;gap:12px}
.rv{border-radius:18px;padding:16px;border:1px solid var(--line);background:var(--card);border-inline-start:5px solid var(--ok)}
.rv.no{border-inline-start-color:var(--bad)}
.tabs{display:flex;gap:8px}.tabs .b.on{background:var(--blue);color:#fff}
/* modal / toast */
.modal{position:fixed;inset:0;background:rgba(2,6,23,.72);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:60}
.box{background:var(--card);border-radius:24px;padding:26px;max-width:520px;width:100%;display:grid;gap:14px;max-height:90vh;overflow:auto;animation:up .25s both}
.note{background:#fffbeb;color:#92400e;border:1px solid #fde68a;border-radius:16px;padding:14px 16px;font-weight:700}
.dark .note{background:rgba(245,158,11,.12);color:#fcd34d;border-color:rgba(245,158,11,.3)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.map button{height:46px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800}
.map button.a{background:rgba(37,99,235,.12);border-color:var(--blue);color:var(--blue)}
.map button.c{background:var(--blue);color:#fff;border-color:var(--blue)}
.map button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.map button.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 22px;border-radius:14px;font-weight:700;z-index:80;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse}th,td{text-align:start;padding:10px;border-bottom:1px solid var(--line);font-size:14px}
/* login */
.lg-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#1d4ed8,#4338ca 55%,#0f172a);position:relative;overflow:hidden}
.lg-wrap::before,.lg-wrap::after{content:"";position:absolute;border-radius:50%;filter:blur(50px)}
.lg-wrap::before{width:340px;height:340px;left:-80px;bottom:-80px;background:rgba(96,165,250,.3)}
.lg-wrap::after{width:260px;height:260px;right:-40px;top:-60px;background:rgba(129,140,248,.3)}
.lg-card{position:relative;z-index:1;width:min(430px,100%);background:rgba(255,255,255,.1);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25);border-radius:28px;padding:30px;display:grid;gap:16px;color:#fff;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.lg-card h1{font-size:34px;font-weight:900;line-height:1.2}.lg-card p{color:#dbeafe}
.lg-card label.f{color:#e0e7ff}
.lg-card input{background:rgba(255,255,255,.95);color:#0f172a;border:2px solid transparent;border-radius:14px;padding:13px 14px;width:100%;direction:ltr;text-align:left}
.lg-card input:focus{border-color:var(--amber);outline:none}
.pw{position:relative}.pw button{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);background:#e2e8f0;color:#0f172a;border:0;border-radius:9px;padding:4px 10px;font-size:12px;font-weight:700}
.err{color:#fecdd3;font-weight:700;min-height:1.6em}.shake{animation:shake .35s}
.subs{display:flex;gap:6px;flex-wrap:wrap}.subs span{padding:2px 12px;border-radius:99px;background:rgba(255,255,255,.14);font-size:12px;font-weight:700}
@media(max-width:720px){.res{grid-template-columns:1fr}.hero{padding:24px}.hdr .live{display:none}.brand p{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="login" class="lg-wrap">
  <div class="lg-card in" id="lgc">
    <div class="tile">ف</div>
    <div><h1>منصة الفرقة الثانية</h1><p>بنك أسئلة تفاعلي للتدريب على الامتحان</p></div>
    <div class="subs"><span>لغة الأعمال</span><span>تطبيقات الإنترنت</span><span>التفكير الابتكاري</span><span>محاسبة التكاليف</span><span>التسويق</span></div>
    <label class="f">كود الطالب<input id="code" inputmode="numeric" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="مثال: 2500000"></label>
    <label class="f">كلمة المرور<div class="pw"><input id="pass" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false"><button type="button" id="eye">إظهار</button></div></label>
    <div class="err" id="err" role="alert"></div>
    <button class="b amb lg w" id="go">دخول المنصة</button>
  </div>
</section>

<div id="app" class="hide" style="display:flex;flex-direction:column;min-height:100vh">
  <header class="hdr"><div>
    <div class="brand" id="home"><div class="tile">ف</div><div><h1>الفرقة الثانية</h1><p>منصة الاختبارات التفاعلية</p></div></div>
    <span class="live"><i></i><span id="total"></span></span>
    <button class="b" id="homeBtn">الرئيسية</button>
    <button class="b" id="adminBtn">لوحة الأدمن</button>
    <button class="b" id="theme" aria-label="تبديل المظهر">🌓</button>
    <button class="b" id="out">خروج</button>
  </div></header>
  <main id="view"></main>
</div>

<div id="modal" class="modal hide" role="dialog" aria-modal="true"><div class="box" id="box"></div></div>

فة المختلطة؟",["حجم النشاط بالوحدات","إجمالي التكاليف","التكلفة الثابتة","سعر البيع"],0,"X يعبر عن مستوى النشاط أو عدد الوحدات المنتجة/المباعة."],[0,2,1,0,"التكاليف التي تحمل خصائص التكاليف الثابتة والمتغيرة معاً تُسمى:",["التكاليف المختلطة (Mixed Costs)","التكاليف المباشرة","التكاليف الرأسمالية","التكاليف الغارقة"],0,"المختلطة أو شبه المتغيرة تجمع بين خصائص الاثنين."],[0,2,1,0,"إذا ارتفع حجم النشاط بنسبة 10%، فما الذي يحدث لإجمالي التكاليف المتغيرة؟",["تزداد بنسبة 10%","تبقى كما هي","تنخفض بنسبة 10%","تزداد بنسبة مضاعفة"],0,"الزيادة في النشاط تنعكس طردياً وبنفس النسبة على التكاليف المتغيرة الإجمالية."],[0,2,1,0,"إذا انخفض حجم النشاط بنسبة 10%، فماذا يحدث لإجمالي التكاليف المتغيرة؟",["تنخفض بنسبة 10%","تبقى كما هي","ترتفع بنسبة 10%","تتضاعف"],0,"التغير الطردي يعني انخفاض التكلفة بنفس نسبة انخفاض النشاط."],[0,2,1,0,"أي التكاليف التالية تتغير عكسياً للوحدة الواحدة مع تغير حجم النشاط؟",["التكاليف الثابتة للوحدة","التكاليف المتغيرة للوحدة","سعر بيع الوحدة","إيراد المبيعات"],0,"التكاليف الثابتة للوحدة تنخفض مع زيادة الإنتاج وتزيد مع انخفاضه (عكسياً)."],[0,2,1,0,"ما هو الهدف الرئيسي من تحليل التكلفة والحجم والربح (CVP)؟",["مساعدة الإدارة في التخطيط واتخاذ القرارات","حساب الضرائب السنوية للشركة","مراجعة الحسابات البنكية فقط","تقييم أداء الموظفين الإداريين"],0,"يستخدم تحليل CVP لدراسة أثر تغير التكاليف والحجم على الأرباح لمساعدة الإدارة."],[0,2,0,1,"إذا كانت التكلفة المتغيرة للوحدة 60 دولاراً والتكلفة الثابتة 10,000,000 دولار، فإن إجمالي التكلفة لإنتاج 100,000 وحدة يبلغ 16,000,000 دولار.",["صحيح","خطأ"],0,"إجمالي التكلفة = (100,000 × 60) + 10,000,000 = 6,000,000 + 10,000,000 = 16,000,000."],[0,2,0,1,"في الجدول المرجعي، إذا كان حجم الإنتاج 100,000 وحدة وتكلفة الوحدة الإجمالية 160 دولاراً، فإن إنتاج 200,000 وحدة يخفض تكلفة الوحدة إلى 110 دولاراً.",["صحيح","خطأ"],0,"بسبب توزيع الثابت على وحدات أكثر تنخفض تكلفة الوحدة الإجمالية."],[0,2,0,1,"لحساب التكلفة المتغيرة لكل وحدة باستخدام طريقة الأعلى والأقل، نقسم التغير في التكلفة على التغير في النشاط.",["صحيح","خطأ"],0,"معادلة الميل b = (تغير التكلفة ÷ تغير النشاط)."],[0,2,0,1,"عند تطبيق طريقة الأعلى والأقل، يتم اختيار مستوى النشاط الأعلى والأدنى بغض النظر عن قيمة التكلفة المرتبطة بهما.",["صحيح","خطأ"],0,"نحدد نقطة أعلى نشاط وأقل نشاط ونحسب الفرق بين تكاليفهما."],[0,2,0,1,"إذا كانت التكلفة عند أعلى نشاط (800 وحدة) هي 5,200 جنيه وعند أدنى نشاط (220 وحدة) هي 4,330 جنيه، فإن التغير في التكلفة هو 870 جنيه.",["صحيح","خطأ"],0,"تغير التكلفة = 5,200 - 4,330 = 870."],[0,2,0,1,"بناءً على المعطيات السابقة، التغير في النشاط يساوي 580 وحدة.",["صحيح","خطأ"],0,"تغير النشاط = 800 - 220 = 580 وحدة."],[0,2,0,1,"بناءً على ذلك، التكلفة المتغيرة للوحدة (b) تساوي 1.50 جنيه.",["صحيح","خطأ"],0,"b = 870 ÷ 580 = 1.50 جنيه."],[0,2,0,1,"إجمالي التكاليف الثابتة (a) في المثال السابق يبلغ 4,000 جنيه.",["صحيح","خطأ"],0,"a = 5,200 - (1.50 × 800) = 5,200 - 1,200 = 4,000 جنيه."],[0,2,0,1,"كلما زاد حجم الإنتاج، زادت حصة الوحدة الواحدة من التكاليف الثابتة.",["صحيح","خطأ"],1,"حصة الوحدة من التكاليف الثابتة تنخفض وليست تزيد."],[0,2,0,1,"التكلفة المختلطة تتضمن شقين أحدهما لا يتغير مهما تغير حجم الإنتاج ضمن المدى الملائم.",["صحيح","خطأ"],0,"الشق الثابت (a) لا يتغير بتغير حجم النشاط ضمن المدى الملائم."],[0,2,1,1,"إذا كانت شركة تنتج 100,000 وحدة بتكلفة متغيرة للوحدة 60 دولاراً وتكلفة ثابتة 10,000,000 دولار، فما هو إجمالي التكاليف المتغيرة؟",["6,000,000 دولار","10,000,000 دولار","16,000,000 دولار","800,000 دولار"],0,"إجمالي التكاليف المتغيرة = عدد الوحدات × التكلفة المتغيرة للوحدة = 100,000 × 60 = 6,000,000 دولار."],[0,2,1,1,"بناءً على المعطيات السابقة، كم يبلغ إجمالي التكاليف الكلية عند إنتاج 100,000 وحدة؟",["16,000,000 دولار","6,000,000 دولار","10,000,000 دولار","22,000,000 دولار"],0,"إجمالي التكلفة = إجمالي متغير (6,000,000) + ثابت (10,000,000) = 16,000,000 دولار."],[0,2,1,1,"إذا أنتجت الشركة 500,000 وحدة بنفس التكاليف السابقة، فكم تكون تكلفة الوحدة الإجمالية؟",["80 دولاراً","160 دولاراً","110 دولاراً","72.50 دولاراً"],0,"إجمالي التكلفة عند 500,000 = (500,000 × 60) + 10,000,000 = 40,000,000. تكلفة الوحدة = 40,000,000 ÷ 500,000 = 80 دولاراً."],[0,2,1,1,"باستخدام طريقة الأعلى والأقل: أعلى نشاط 800 وحدة بتكلفة 5,200، وأدنى نشاط 220 وحدة بتكلفة 4,330. كم تبلغ التكلفة المتغيرة للوحدة (b)؟",["1.50 جنيه","2.00 جنيه","1.20 جنيه","2.50 جنيه"],0,"b = (5,200 - 4,330) ÷ (800 - 220) = 870 ÷ 580 = 1.50 جنيه."],[0,2,1,1,"بناءً على السؤال السابق، ما هي قيمة إجمالي التكاليف الثابتة (a)؟",["4,000 جنيه","5,200 جنيه","1,200 جنيه","4,330 جنيه"],0,"a = 5,200 - (1.50 × 800) = 5,200 - 1,200 = 4,000 جنيه."],[0,2,1,1,"إذا كانت التكاليف الثابتة لشركة 12,000 جنيه وتكلفة الوحدة المتغيرة 4 جنيهات، فما إجمالي التكلفة عند إنتاج 5,000 وحدة؟",["32,000 جنيه","20,000 جنيه","25,000 جنيه","40,000 جنيه"],0,"إجمالي التكلفة = 12,000 + (4 × 5,000) = 12,000 + 20,000 = 32,000 جنيه."],[0,2,1,1,"ما هو الشكل الصحيح لمعادلة إجمالي التكاليف باستخدام طريقة الأعلى والأقل؟",["Y = a + bX","Y = a - bX","Y = b + aX","X = a + bY"],0,"المعادلة المعتمدة هي Y = a + bX حيث Y إجمالي التكلفة و a الثابت و b المتغير للوحدة و X النشاط."],[0,2,1,1,"إذا كان حجم النشاط 200,000 وحدة، والتكلفة المتغيرة للوحدة 60، والتكاليف الثابتة 10,000,000، فما هي تكلفة الوحدة الإجمالية؟",["110 دولاراً","160 دولاراً","80 دولاراً","70 دولاراً"],0,"إجمالي التكلفة = (200,000 × 60) + 10,000,000 = 22,000,000. تكلفة الوحدة = 22,000,000 ÷ 200,000 = 110 دولاراً."],[0,2,1,1,"أي من العوامل التالية يعكس السلوك الصحيح للتكلفة الثابتة للوحدة عند زيادة حجم الإنتاج؟",["تنخفض","ترتفع","تظل ثابتة تماماً","تتساوى مع التكلفة المتغيرة الإجمالية"],0,"تتغير التكلفة الثابتة للوحدة عكسياً؛ فتنخفض بزيادة الإنتاج."],[0,2,1,1,"عند استخدام طريقة الأعلى والأقل، لماذا نقوم بطرح التكلفة الدنيا من التكلفة العليا؟",["لعزل واستخراج عنصر التكاليف الثابتة والمتغيرة بدقة","لحساب إجمالي المبيعات","لتحديد ضريبة الدخل","لإلغاء أثر الوحدات المنتجة"],0,"طرح التكاليف والنشاط يساعد في استخراج معدل التغير (b) ثم الثابت (a)."],[0,3,0,0,"في رسم خريطة التعادل، يمثل الحرف (A) أو خط التكلفة يبدأ من نقطة التكلفة الثابتة.",["صحيح","خطأ"],0,"خط التكلفة الإجمالية يبدأ من قيمة التكاليف الثابتة عند صفر مبيعات."],[0,3,0,0,"نقطة التعادل هي النقطة التي يتساوى عندها إجمالي الإيرادات مع إجمالي التكاليف (لا ربح ولا خسارة).",["صحيح","خطأ"],0,"عند نقطة التعادل إجمالي الإيراد = إجمالي التكلفة."],[0,3,0,0,"المنطقة الواقعة أسفل نقطة التعادل (حيث الإيرادات أقل من التكاليف) تسمى منطقة الخسارة (Loss Area).",["صحيح","خطأ"],0,"تسمى منطقة الخسارة التشغيلية."],[0,3,0,0,"المنطقة الواقعة أعلى نقطة التعادل تسمى منطقة الربح أو الدخل التشغيلي (Operating Income Area).",["صحيح","خطأ"],0,"تسمى منطقة الربح."],[0,3,0,0,"نقطة التعادل تعني تحقيق ربح صافٍ كبير للمنشأة.",["صحيح","خطأ"],1,"نقطة التعادل تعني صفريّة الربح والخسارة (ربح صفر)."],[0,3,0,0,"إجمالي الإيرادات عند نقطة التعادل يغطي تماماً إجمالي التكاليف (الثابتة والمتغيرة).",["صحيح","خطأ"],0,"الإيرادات تغطي التكاليف بالكامل عند التعادل."],[0,3,0,0,"إذا كانت كمية التعادل 25 وحدة، فهذا يعني أن بيع 25 وحدة يحقق ربحاً صافياً ضخماً.",["صحيح","خطأ"],1,"بيع 25 وحدة يحقق تعادلاً (ربح صفر)."],[0,3,0,0,"سعر بيع الوحدة يُحسب بقسمة إجمالي الإيرادات على إجمالي الوحدات المباعة.",["صحيح","خطأ"],0,"سعر البيع = إجمالي الإيرادات ÷ الوحدات المباعة."],[0,3,0,0,"التكلفة المتغيرة للوحدة تُحسب بقسمة إجمالي التكاليف المتغيرة على عدد الوحدات.",["صحيح","خطأ"],0,"تكلفة متغيرة للوحدة = إجمالي المتغير ÷ الوحدات."],[0,3,0,0,"عند بيع صفر وحدات، تكون النتيجة التشغيلية للمنشأة هي خسارة مساوية لمقدار التكاليف الثابتة.",["صحيح","خطأ"],0,"مع عدم وجود مبيعات تتحمل الشركة التكاليف الثابتة كخسارة كاملة."],[0,3,1,0,"ماذا يمثل تقاطع خط الإيرادات الكلية مع خط التكاليف الكلية على خريطة التعادل؟",["نقطة التعادل (Break-even Point)","منطقة الخسارة","إجمالي التكاليف الثابتة","هامش الأمان"],0,"تقاطع الخطين هو نقطة التعادل حيث يتساوى الإيراد والتكلفة."],[0,3,1,0,"المنطقة الواقعة بين خط التكاليف وخط الإيرادات قبل نقطة التعادل تسمى:",["منطقة الخسارة (Loss Area)","منطقة الربح التشغيلي","التكاليف الثابتة","هامش المساهمة"],0,"تسمى منطقة الخسارة لأن التكاليف تفوق الإيرادات."],[0,3,1,0,"المنطقة الواقعة بعد نقطة التعادل وتوضّح العائد الإيجابي تُسمى:",["منطقة الربح (Operating Income Area)","منطقة الخسارة","التكاليف الغارقة","رأس المال العامل"],0,"تسمى منطقة الدخل التشغيلي أو الأرباح."],[0,3,1,0,"عند بيع صفر من الوحدات (عند نقطة الصفر)، ماذا يكون صافي دخل أو نتيجة النشاط؟",["خسارة مساوية للتكاليف الثابتة","ربح يساوي التكاليف المتغيرة","تعادل تماماً","لا شيء مما ذكر"],0,"مع عدم وجود إيرادات، تظهر خسارة بقيمة التكاليف الثابتة."],[0,3,1,0,"أي من العبارات الآتية تصف بدقة حالة نقطة التعادل؟",["إجمالي الإيرادات يساوي إجمالي التكاليف","إجمالي الإيرادات أكبر من التكاليف","التكاليف الثابتة تساوي الصفر","التكاليف المتغيرة أكبر من الإيرادات"],0,"تعريف التعادل هو تساوي الإيرادات الكلية مع التكاليف الكلية."],[0,3,1,0,"إذا كانت إيرادات 500 وحدة مباعة هي 10,000 دولار، فكم يبلغ سعر البيع للوحدة الواحدة؟",["20 دولاراً","80 دولاراً","12 دولاراً","25 دولاراً"],0,"سعر البيع = إجمالي الإيرادات ÷ الوحدات = 10,000 ÷ 500 = 20 دولاراً."],[0,3,1,0,"إذا كان إجمالي التكاليف المتغيرة لـ 500 وحدة هو 6,000 دولار، فكم تبلغ التكلفة المتغيرة للوحدة الواحدة؟",["12 دولاراً","20 دولاراً","10 دولارات","8 دولار"],0,"التكلفة المتغيرة للوحدة = 6,000 ÷ 500 = 12 دولاراً."],[0,3,1,0,"على الرسم البياني للتعادل، الخط الذي يبدأ من نقطة الصفر (المنشأ) ويميل للأعلى يمثل عادةً:",["إجمالي الإيرادات (Total Revenues Line)","التكاليف الثابتة","التكاليف المختلطة","صافي الخسارة"],0,"خط الإيرادات يبدأ من نقطة الأصل (صفر) ويرتفع مع زيادة المبيعات."],[0,3,1,0,"الخط الذي يبدأ من قيمة التكاليف الثابتة (أعلى الصفر) ويمتد للأعلى يمثل:",["إجمالي التكاليف (Total Costs Line)","إجمالي الإيرادات","التكاليف المتغيرة وحدها","هامش الأمان"],0,"خط التكاليف الكلية يبدأ من قيمة الثابت ويشمل المتغير فوقه."],[0,3,1,0,"ماذا تعني عبارة 'حجم التعادل بالوحدات'؟",["عدد الوحدات التي يجب بيعها لتحقيق ربح صفري","أقصى عدد وحدات يمكن إنتاجها","عدد الوحدات التالفة في الإنتاج","الحد الأدنى لرواتب العمال"],0,"كمية التعادل هي حجم المبيعات الذي لا يحقق ربحاً ولا خسارة."],[0,3,0,1,"إذا كان سعر بيع الوحدة 20 دولاراً والتكلفة المتغيرة للوحدة 12 دولاراً، فإن هامش المساهمة للوحدة يبلغ 8 دولار.",["صحيح","خطأ"],0,"هامش المساهمة للوحدة = سعر البيع (20) - التكلفة المتغيرة (12) = 8 دولار."],[0,3,0,1,"إذا كانت التكاليف الثابتة 2,000 دولار وهامش المساهمة للوحدة 8 دولار، فإن كمية التعادل تساوي 250 وحدة.",["صحيح","خطأ"],0,"كمية التعادل = التكاليف الثابتة ÷ هامش المساهمة للوحدة = 2,000 ÷ 8 = 250 وحدة."],[0,3,0,1,"إذا تم بيع 30 وحدة بسعر 20 دولار، فإن إجمالي الإيراد يبلغ 600 دولار.",["صحيح","خطأ"],0,"إجمالي الإيراد = 30 × 20 = 600 دولار."],[0,3,0,1,"إذا كانت التكاليف الثابتة 2,000 والتكلفة المتغيرة للوحدة 12، فإن إجمالي التكلفة لـ 40 وحدة يبلغ 2,480 دولار.",["صحيح","خطأ"],0,"إجمالي التكلفة = 2,000 + (12 × 40) = 2,000 + 480 = 2,480 دولار."],[0,3,0,1,"عند حجم مبيعات صفر وحدة، يكون صافي دخل الشركة سالب 2,000 دولار (خسارة 2000).",["صحيح","خطأ"],0,"الخسارة تساوي التكاليف الثابتة بالكامل عند انعدام المبيعات."],[0,3,0,1,"نقطة التعادل تعني أن إجمالي الإيرادات يساوي إجمالي التكاليف.",["صحيح","خطأ"],0,"هذا هو المعيار الأساسي للتعادل."],[0,3,0,1,"إذا زادت التكاليف الثابتة مع ثبات سعر البيع والتكلفة المتغيرة، فإن كمية التعادل تنخفض.",["صحيح","خطأ"],1,"زيادة التكاليف الثابتة ترفع كمية التعادل لأننا نحتاج مبيعات أكثر لتغطيتها."],[0,3,0,1,"إذا زاد هامش المساهمة للوحدة، فإن عدد وحدات التعادل المطلوبة يقل.",["صحيح","خطأ"],0,"علاقة عكسية بين هامش المساهمة ووحدات التعادل."],[0,3,0,1,"إجمالي التكاليف عند نقطة التعادل (25 وحدة مثلاً في الرسم الأول) يساوي 5,000 دولار.",["صحيح","خطأ"],0,"في الرسم البياني المرفق، نقطة التعادل عند 25 وحدة وتقابل مبلغ 5,000 دولار."],[0,3,0,1,"في الرسم البياني الثاني، كمية التعادل (الحرف E) تبلغ 250 وحدة وقيمة التعادل (الحرف F) 5,000 جنيه.",["صحيح","خطأ"],0,"الرسم الثاني يوضح نقطة التعادل عند 250 وحدة و 5,000 جنيه."],[0,3,1,1,"إذا كانت التكاليف الثابتة 2,000 دولار، وسعر بيع الوحدة 20، والتكلفة المتغيرة للوحدة 12، فما هو عدد وحدات التعادل؟",["250 وحدة","500 وحدة","100 وحدة","400 وحدة"],0,"وحدات التعادل = الثابت ÷ (سعر البيع - التكلفة المتغيرة) = 2,000 ÷ (20 - 12) = 2,000 ÷ 8 = 250 وحدة."],[0,3,1,1,"ما هو إجمالي التكاليف المتحقق عند بيع 40 وحدة، علماً بأن الثابت 2,000 والمتغير للوحدة 12؟",["2,480 دولاراً","3,800 دولاراً","4,800 دولاراً","2,000 دولاراً"],0,"التكلفة الكلية = 2,000 + (12 × 40) = 2,480 دولاراً."],[0,3,1,1,"ما هي نتيجة نشاط الشركة إذا باعت 30 وحدة بسعر 20 دولار، مع تكاليف ثابتة 2,000 وتكلفة متغيرة للوحدة 12؟",["خسارة قدرها 1,760 دولاراً","ربح قدرها 600 دولار","تعادل تام","خسارة 2,000 دولار"],0,"الإيراد = 30 × 20 = 600. التكلفة الكلية = 2,000 + (12 × 30) = 2,360. صافي الدخل = 600 - 2,360 = -1,760 (خسارة)."],[0,3,1,1,"إذا كان إجمالي الإيراد عند بيع 500 وحدة هو 10,000 دولار، والتكلفة المتغيرة الإجمالية 6,000، والتكاليف الثابتة 2,000، فما هو صافي الربح؟",["2,000 دولار","4,000 دولار","صفر","8,000 دولار"],0,"مجمل الربح أو الدخل التشغيلي = الإيراد (10,000) - إجمالي التكاليف (6,000 + 2,000 = 8,000) = 2,000 دولار."],[0,3,1,1,"في خريطة التعادل، الحرف (A) الذي يبدأ منه خط التكاليف الكلية عند صفر وحدات يمثل:",["إجمالي التكاليف الثابتة","إجمالي التكاليف المتغيرة","إجمالي الإيرادات","هامش المساهمة"],0,"الحرف A يمثل قيمة التكاليف الثابتة التي تتحملها الشركة حتى لو كانت المبيعات صفراً."],[0,3,1,1,"ماذا يمثل الحرف (B) في الرسم البياني للتعادل الثاني (المساحة الإجمالية فوق خط التكلفة أو التكاليف الإجمالية)؟",["التكاليف الكلية (Total Costs Line)","التكاليف الثابتة وحدها","نقطة التعادل القيمة","صافي الربح الصافي"],0,"الحرف B يعبر عن خط أو عناصر التكاليف الكلية."],[0,3,1,1,"إذا انخفضت التكاليف الثابتة للشركة، فما أثر ذلك على نقطة التعادل بالوحدات؟",["تنخفض نقطة التعادل","ترتفع نقطة التعادل","لا تتأثر نهائياً","تتضاعف نقطة التعادل"],0,"انخفاض التكاليف الثابتة يقلل عدد الوحدات المطلوبة للتعادل."],[0,3,1,1,"إذا ارتفع سعر بيع الوحدة مع ثبات التكاليف، ماذا يحدث لكمية التعادل؟",["تنخفض كمية التعادل","ترتفع كمية التعادل","تظل ثابتة","تصل إلى الصفر المطلق"],0,"ارتفاع سعر البيع يزيد هامش المساهمة للوحدة، وبالتالي يقلل الوحدات المطلوبة للتعادل."],[0,3,1,1,"أي العوامل التالية لا يؤثر على تغير نقطة التعادل؟",["عدد الإداريين المخطط تعيينهم مستقبلاً (إذا لم يشملوا الثابت)","التكاليف الثابتة","سعر بيع الوحدة","التكلفة المتغيرة للوحدة"],0,"العوامل الأساسية للتعادل هي: التكاليف الثابتة، سعر البيع، والتكلفة المتغيرة للوحدة."],[0,3,1,1,"ما هو المعنى المالي لـ 'منطقة الأرباح' (Operating Income Area) في خريطة التعادل؟",["المستوى الذي تتجاوز فيه الإيرادات إجمالي التكاليف","المستوى الذي تتساوى فيه التكاليف","حالة توقف النشاط تماماً","مستوى الخسائر الدورية"],0,"منطقة الأرباح تقع بعد نقطة التعادل حيث الإيرادات أعلى من التكاليف."],[1,0,0,0,"الإنترنت هو شبكة عالمية مترابطة من ملايين الأجهزة تتكون من شبكات محلية وإقليمية ودولية.",["صح","خطأ"],0,"صحيح؛ الإنترنت شبكة عالمية تربط ملايين الأجهزة عبر بروتوكولات قياسية، وتتكون من شبكات محلية وإقليمية ودولية."],[1,0,0,0,"ISP هو مزود خدمة الإنترنت الذي يمنح المستخدمين إمكانية الاتصال بالشبكة.",["صح","خطأ"],0,"صحيح؛ ISP (Internet Service Provider) مثل Vodafone أو STC هي الجهة التي توفر الاتصال بالإنترنت."],[1,0,0,0,"ICP هو مزود محتوى الإنترنت مثل Netflix الذي يوفر الأفكار والفيديوهات عبر الشبكة.",["صح","خطأ"],0,"صحيح؛ ICP (Internet Content Provider) جهة توفر المحتوى مثل الأخبار أو الفيديوهات، ومثالها Netflix."],[1,0,0,0,"مسؤول النظام (System Administrator) هو شخص متخصص يدير الشبكات والخوادم لضمان استقرارها وأمنها.",["صح","خطأ"],0,"صحيح؛ يقوم بمهام مثل النسخ الاحتياطي ومراقبة الأداء وحماية الأنظمة."],[1,0,0,0,"البروتوكول هو القواعد والإجراءات المنظمة لتبادل البيانات بين الأجهزة.",["صح","خطأ"],0,"صحيح؛ تحدد البروتوكولات كيفية بدء الاتصال وصيغة الرسائل وكيفية إنهاء الجلسة."],[1,0,0,0,"TCP مسؤول عن تقسيم البيانات إلى رزم صغيرة والتأكد من وصولها سليمة.",["صح","خطأ"],0,"صحيح؛ TCP (Transmission Control Protocol) يقطع البيانات إلى حزم صغيرة ويعيد إرسال المفقود منها."],[1,0,0,0,"IP مسؤول عن تحديد المسار الذي تسلكه الحزم للوصول إلى الجهاز الهدف.",["صح","خطأ"],0,"صحيح؛ IP (Internet Protocol) يحدد عنوان الجهاز ومسار الحزم عبر الشبكة."],[1,0,0,0,"SMTP هو البروتوكول المسؤول عن إرسال البريد الإلكتروني.",["صح","خطأ"],0,"صحيح؛ SMTP (Simple Mail Transfer Protocol) ينقل رسائل البريد من خادم الإرسال إلى الوجهة."],[1,0,0,0,"FTP هو بروتوكول مخصص لنقل الملفات بين جهازك والخوادم على الإنترنت.",["صح","خطأ"],0,"صحيح؛ FTP (File Transfer Protocol) يستخدم لرفع وتنزيل الملفات من وإلى الخوادم."],[1,0,0,0,"HTTP هو البروتوكول الذي ينقل صفحات الويب من الخوادم إلى المتصفحات.",["صح","خطأ"],0,"صحيح؛ HTTP (HyperText Transfer Protocol) هو الأساس لنقل صفحات الويب."],[1,0,0,1,"HTTPS يضيف طبقة أمان باستخدام شهادات SSL/TLS لحماية البيانات الحساسة مثل كلمات المرور.",["صح","خطأ"],0,"صحيح؛ HTTPS يشفر البيانات باستخدام SSL/TLS مما يحمي المعلومات الحساسة أثناء النقل."],[1,0,0,1,"DNS يعمل كدليل هواتف الإنترنت ويحول أسماء النطاقات النصية إلى عناوين IP رقمية.",["صح","خطأ"],0,"صحيح؛ DNS (Domain Name System) يحول www.example.com إلى عنوان IP مثل 192.0.2.1."],[1,0,0,1,"IPv4 يستخدم أرقامًا رباعية بينما IPv6 يوفر نطاقًا أوسع من العناوين.",["صح","خطأ"],0,"صحيح؛ IPv4 يستخدم 4 مجموعات رقمية، بينما IPv6 يوفر نطاقاً هائلاً لتلبية النمو."],[1,0,0,1,"URL يتضمن البروتوكول واسم النطاق والمسار وقد يتضمن منفذًا أو متغيرات إضافية.",["صح","خطأ"],0,"صحيح؛ مثال: https://www.university.edu/courses/it101 يتضمن البروتوكول والنطاق والمسار."],[1,0,0,1,"HTML هي لغة توصيف تهتم بالمظهر الجمالي لصفحات الويب أكثر من هيكلها.",["صح","خطأ"],1,"خطأ؛ HTML لا تهتم بالمظهر الجمالي بل بوصف مكونات الصفحة (العناوين، الفقرات، الروابط، الصور)."],[1,0,0,1,"TCP/IP هي حزمة بروتوكولات تشكل العمود الفقري للإنترنت.",["صح","خطأ"],0,"صحيح؛ TCP يضمن وصول الحزم كاملة وIP يحدد المسار، مما يضمن موثوقية الاتصال."],[1,0,0,1,"عند إرسال بريد من Gmail إلى Yahoo فإن Gmail يستخدم SMTP لإرسال الرسالة.",["صح","خطأ"],0,"صحيح؛ SMTP هو البروتوكول المسؤول عن إرسال البريد من خادم المرسل إلى خادم المستقبل."],[1,0,0,1,"مطور المواقع يستخدم FTP لرفع صفحات الموقع والصور إلى خادم الاستضافة.",["صح","خطأ"],0,"صحيح؛ FTP مخصص لنقل الملفات بين جهازك والخادم، ومنها رفع ملفات الموقع."],[1,0,0,1,"الإنترنت يتيح تبادل المعلومات والخدمات بشكل لحظي تقريبًا.",["صح","خطأ"],0,"صحيح؛ من أهم خصائص الإنترنت سرعة تبادل المعلومات والخدمات بشكل فوري."],[1,0,0,1,"البروتوكولات لا تحدد صيغة الرسائل بل تقتصر على بدء الاتصال فقط.",["صح","خطأ"],1,"خطأ؛ البروتوكولات تحدد كيفية بدء الاتصال وصيغة الرسائل وكيفية إنهاء الجلسة."],[1,0,1,0,"أي مما يلي يُعد مزود خدمة إنترنت (ISP)؟",["Vodafone أو STC","Netflix","Google","متصفح Chrome"],0,"ISP هو الجهة التي تمنح الاتصال بالشبكة مثل Vodafone وSTC."],[1,0,1,0,"Netflix تُعد مثالاً على:",["مزود محتوى إنترنت (ICP)","مزود خدمة إنترنت (ISP)","مسؤول نظام","بروتوكول نقل ملفات"],0,"ICP (Internet Content Provider) جهة توفر المحتوى مثل الفيديوهات والأخبار، ومثالها Netflix."],[1,0,1,0,"من يقوم بإدارة الشبكات والخوادم والنسخ الاحتياطي ومراقبة الأداء؟",["مسؤول النظام (System Administrator)","مزود المحتوى (ICP)","مزود الخدمة (ISP)","مطور الويب"],0,"مسؤول النظام متخصص في إدارة الشبكات والخوادم وضمان استقرارها وأمنها."],[1,0,1,0,"البروتوكول المسؤول عن إرسال البريد الإلكتروني هو:",["SMTP","FTP","HTTP","DNS"],0,"SMTP (Simple Mail Transfer Protocol) مسؤول عن إرسال البريد الإلكتروني."],[1,0,1,0,"البروتوكول المخصص لنقل الملفات بين جهازك والخوادم هو:",["FTP","SMTP","HTTP","TCP"],0,"FTP (File Transfer Protocol) مخصص لنقل الملفات رفعًا وتنزيلاً."],[1,0,1,0,"أي بروتوكول ينقل صفحات الويب من الخوادم إلى المتصفحات؟",["HTTP","FTP","SMTP","IP"],0,"HTTP (HyperText Transfer Protocol) هو الأساس لنقل صفحات الويب."],[1,0,1,0,"نظام يحول أسماء النطاقات النصية إلى عناوين IP رقمية هو:",["DNS","FTP","SMTP","HTML"],0,"DNS (Domain Name System) يعمل كدليل هواتف الإنترنت ويحول الأسماء إلى عناوين IP."],[1,0,1,0,"لغة توصيف تُستخدم لبناء هيكل صفحات الويب هي:",["HTML","HTTP","FTP","DNS"],0,"HTML (HyperText Markup Language) هي لغة توصيف لبناء هيكل صفحات الويب."],[1,0,1,0,"أي مما يلي يمثل عنوانًا كاملاً لمورد على الويب؟",["URL","IP","DNS","ISP"],0,"URL (Uniform Resource Locator) يمثل العنوان الكامل لمورد على الويب."],[1,0,1,0,"أي بروتوكول يقطع البيانات إلى رزم صغيرة ويتأكد من وصولها سليمة؟",["TCP","IP","HTTP","FTP"],0,"TCP (Transmission Control Protocol) يقطع البيانات ويعيد إرسال المفقود."],[1,0,1,1,"الفرق بين SMTP وFTP هو أن:",["SMTP لنقل الرسائل الإلكترونية، وFTP لنقل الملفات بأنواعها","SMTP لنقل الملفات، وFTP لنقل الرسائل","كلاهما لنقل الملفات فقط","كلاهما لنقل الرسائل فقط"],0,"SMTP خاص بنقل الرسائل الإلكترونية، بينما FTP خاص بنقل الملفات (مستندات، صور، صفحات ويب)."],[1,0,1,1,"ما الذي يضيفه HTTPS مقارنة بـ HTTP؟",["طبقة أمان باستخدام شهادات SSL/TLS لحماية البيانات","سرعة أكبر في تحميل الصفحات","دعمًا للفيديوهات فقط","إمكانية إرسال البريد الإلكتروني"],0,"HTTPS يضيف تشفيرًا باستخدام SSL/TLS يحمي البيانات الحساسة مثل كلمات المرور ومعلومات الدفع."],[1,0,1,1,"عندما ترسل صورة لصديق عبر الإنترنت، أي بروتوكول يتأكد من تجميع القطع بالترتيب الصحيح؟",["TCP","IP","HTTP","SMTP"],0,"TCP مسؤول عن تجميع الحزم بالترتيب الصحيح وطلب إعادة إرسال أي قطعة مفقودة."],[1,0,1,1,"أي مما يلي يوضح العلاقة الصحيحة بين TCP وIP؟",["TCP يقسم البيانات ويضمن وصولها، وIP يحدد المسار","TCP يحدد المسار، وIP يقسم البيانات","كلاهما يقسم البيانات فقط","كلاهما يحدد المسار فقط"],0,"TCP يقسم البيانات إلى حزم ويضمن وصولها كاملة، بينما IP يحدد المسار الذي تسلكه الحزم."],[1,0,1,1,"أي مما يلي يمثل عنوان IP؟",["192.0.2.1","www.example.com","https://example.com","SMTP"],0,"192.0.2.1 هو عنوان IP رقمي، بينما www.example.com هو اسم نطاق."],[1,0,1,1,"ماذا يمثل الرابط https://www.university.edu/courses/it101؟",["URL كامل يتضمن البروتوكول والنطاق والمسار","عنوان IP فقط","اسم بروتوكول فقط","اسم نطاق فقط"],0,"هذا URL يتضمن البروتوكول (https) واسم النطاق (www.university.edu) والمسار (/courses/it101)."],[1,0,1,1,"لماذا يُقال إن DNS يعمل كدليل هواتف الإنترنت؟",["لأنه يحول أسماء النطاقات النصية إلى عناوين IP رقمية","لأنه يخزن جهات الاتصال في الهاتف","لأنه يدير البريد الإلكتروني","لأنه ينقل الملفات بين الأجهزة"],0,"DNS يحول اسم النطاق (مثل www.example.com) إلى عنوان IP رقمي (مثل 192.0.2.1)."],[1,0,1,1,"ما الفرق بين IPv4 وIPv6؟",["IPv4 يستخدم أرقامًا رباعية، وIPv6 يوفر نطاقًا أوسع من العناوين","IPv6 أقدم من IPv4","كلاهما يستخدم نفس عدد العناوين","IPv4 لا يستخدم في الإنترنت"],0,"IPv4 يستخدم عناوين رباعية، بينما IPv6 يوفر نطاقًا أوسع لتلبية النمو الهائل للأجهزة."],[1,0,1,1,"أي مما يلي يصف HTML بشكل صحيح؟",["لغة توصيف تهتم بهيكل الصفحة وليس مظهرها الجمالي","لغة برمجة لتصميم الألوان","بروتوكول لنقل الملفات","نظام لتحويل الأسماء إلى عناوين"],0,"HTML تصف مكونات الصفحة (العناوين، الفقرات، الروابط، الصور) ولا تهتم بالمظهر الجمالي."],[1,0,1,1,"إذا ضاعت إحدى رزم البيانات أثناء الإرسال، أي بروتوكول يطلب إعادة إرسالها؟",["TCP","IP","HTTP","DNS"],0,"TCP يتأكد من وصول كل الرزم، وإذا ضاعت رزمة يعيد إرسالها."],[2,0,0,0,"يُعرَّف التفكير بأنه نشاط عقلي غير مرئي يقوم به الدماغ البشري عندما يتعرض لمثير يتم استقباله عن طريق الحواس.",["صح","خطأ"],0,"صحيح؛ التفكير عملية عقلية غير ملموسة تحدث داخل الدماغ استجابة لمثيرات تستقبلها الحواس المختلفة."],[2,0,0,0,"يقتصر التفكير البشري على حل المشكلات التي تواجه الإنسان في الحاضر فقط ولا يمتد للتخطيط للمستقبل.",["صح","خطأ"],1,"خطأ؛ من أبرز المواقف التي تثير التفكير البشري: التخطيط للمستقبل، تذكر الماضي، وحل المشكلات."],[2,0,0,0,"يتكون التفكير من أربعة عناصر رئيسية هي: الفرد المفكر، والمثير، والعمليات العقلية، والاستجابة.",["صح","خطأ"],0,"صحيح؛ تكتمل منظومة التفكير بوجود الفرد الذي يفكر، والمثير الذي يستفز العقل، والعمليات الذهنية، ثم الاستجابة أو القرار."],[2,0,0,0,"يُعد التفكير نشاطاً فطرياً تماماً لا يمكن تعلمه أو تطويره بالتدريب والممارسة.",["صح","خطأ"],1,"خطأ؛ القدرة على التفكير فطرية، لكن مهارات التفكير الفعال والابتكاري مكتسبة ويمكن تنميتها بالتدريب والتعليم."],[2,0,0,0,"يتميز التفكير الإنساني بأنه نشاط هادف وليس عشوائياً، حيث يسعى الفرد من خلاله إلى تحقيق غاية محددة.",["صح","خطأ"],0,"صحيح؛ من خصائص التفكير الأساسية أنه سلوك هادف يوجه الفرد نحو فهم موقف أو حل مشكلة أو اتخاذ قرار."],[2,0,0,0,"يرتبط التفكير ارتباطاً وثيقاً باللغة، حيث تُعد اللغة الوعاء الذي يعبر به الإنسان عن أفكاره.",["صح","خطأ"],0,"صحيح؛ اللغة والتفكير وجهان لعملة واحدة، فالتفكير لغة صامتة واللغة تفكير منطوق."],[2,0,0,0,"يشير مصطلح 'الدماغ' إلى الوظائف العقلية غير المادية، بينما يشير 'العقل' إلى العضو المادي الموجود داخل الجمجمة.",["صح","خطأ"],1,"خطأ (معكوسة)؛ الدماغ (Brain) هو العضو المادي داخل الجمجمة، أما العقل (Mind) فهو منظومة الوظائف والعمليات الذهنية."],[2,0,0,0,"أصحاب العقلية الثابتة (Fixed Mindset) يعتقدون أن الذكاء والقدرات صفات جامدة لا تتغير.",["صح","خطأ"],0,"صحيح؛ وفقاً لعالمة النفس كارول دويك، يرى أصحاب العقلية الثابتة أن الموهبة والذكاء ثابتان منذ الولادة."],[2,0,0,0,"التفكير الفعال هو التفكير الذي يعتمد على العاطفة والانفعال السريع دون فحص الأدلة.",["صح","خطأ"],1,"خطأ؛ التفكير الفعال يعتمد على المنهجية السليمة والمعلومات الدقيقة والمنطق بعيداً عن التحيز والانفعال."],[2,0,0,0,"تشمل مستويات التفكير مستويات أساسية (دنيا) كالتذكر والفهم، ومستويات عليا كالتحليل والابتكار.",["صح","خطأ"],0,"صحيح؛ تتدرج مهارات التفكير من العمليات البسيطة إلى العمليات المركبة والعليا."],[2,0,0,1,"عندما يتجنب موظف الدخول في مشروع جديد خوفاً من الفشل وإظهار نقص مهاراته أمام زملائه، فإنه يجسد خصائص العقلية النامية.",["صح","خطأ"],1,"خطأ؛ تجنب التحديات خوفاً من الفشل هو سمة أساسية من سمات العقلية الثابتة، بينما العقلية النامية ترحب بالتحديات كفرص للتعلم."],[2,0,0,1,"الاستدلال على وجود خلل في محرك السيارة من خلال سماع صوت غير معتاد يعبر عن خاصية إدراك القوانين العامة للموجودات.",["صح","خطأ"],0,"صحيح؛ لأن الفرد وظّف خبرته السابقة وفهمه للعلاقة السببية بين الصوت وعمل المحرك للوصول إلى استنتاج عقلي."],[2,0,0,1,"الفرق الجوهري بين 'التفكير' و'الذكاء' هو أن الذكاء يمثل القدرة الكامنة، بينما التفكير هو المهارة التشغيلية التي توظف تلك القدرة.",["صح","خطأ"],0,"صحيح؛ الذكاء هو الإمكانية الفطرية، والتفكير هو الأداء الفعلي والمهارة التي نستخدم بها ذكاءنا في المواقف المختلفة."],[2,0,0,1,"التسرع في إصدار الأحكام والتعصب لرأي واحد دون سماع وجهات النظر الأخرى يُعد من معوقات التفكير الفعال.",["صح","خطأ"],0,"صحيح؛ التعصب الفكري والتسرع والاعتماد على معلومات ناقصة تمنع العقل من الوصول إلى تفكير سليم وموضوعي."],[2,0,0,1,"يتوقف نشاط التفكير تماماً لدى الإنسان أثناء نومه ولا تحدث أي عمليات ذهنية في تلك الفترة.",["صح","خطأ"],1,"خطأ؛ التفكير عملية مستمرة لا تتوقف، ويستمر الدماغ في معالجة المعلومات وترتيب الذكريات حتى أثناء النوم."],[2,0,0,1,"تُعد 'الخبرة السابقة' عاملاً ثانوياً لا يؤثر في قدرة الفرد على تفسير المثيرات الجديدة التي يتعرض لها.",["صح","خطأ"],1,"خطأ؛ يعتمد التفكير بدرجة كبيرة على الخبرات والمعارف السابقة للفرد في فهم المواقف الحاضرة وحل مشكلاتها."],[2,0,0,1,"ينعكس تفكير الفرد في سلوكه الظاهري، مما يعني أنه يمكن الاستدلال على طريقة تفكير الشخص من خلال أفعاله وكلماته.",["صح","خطأ"],0,"صحيح؛ رغم أن التفكير عملية داخلية غير مرئية، إلا أن نتائجه تظهر في سلوك الإنسان وقراراته وتعبيره اللغوي."],[2,0,0,1,"يرى أصحاب العقلية النامية (Growth Mindset) أن بذل الجهد علامة على الضعف ونقص الموهبة.",["صح","خطأ"],1,"خطأ؛ أصحاب العقلية الثابتة هم من يرون الجهد دليلاً على نقص الموهبة، أما أصحاب العقلية النامية فيرون الجهد طريقاً للإتقان."],[2,0,0,1,"تتفاعل العوامل الوراثية والبيئية معاً في تشكيل طريقة تفكير الإنسان ومستوى نضجه العقلي.",["صح","خطأ"],0,"صحيح؛ الوراثة تمنح الاستعداد الفطري، والبيئة والتعليم والثقافة تصقل هذا الاستعداد وتوجهه."],[2,0,0,1,"يُعد التخطيط لإنشاء مشروع تجاري بعد التخرج مثالاً على 'تنظيم التفكير' الذي يثيره موقف مستقبلي.",["صح","خطأ"],0,"صحيح؛ وضع الخطط والأهداف المستقبلية هو أحد أبرز الأنشطة العقلية التي تستدعي التفكير المنظم."],[2,0,1,0,"أيٌّ مما يلي يُعد التعريف الأدق للتفكير؟",["نشاط عقلي غير مرئي يقوم به الدماغ لمعالجة المثيرات والوصول لاستجابة","استجابة عضلية تلقائية للمؤثرات الخارجية دون تدخل الدماغ","تخزين المعلومات في الذاكرة دون القدرة على استرجاعها","العضو المادي الموجود داخل تجويف الجمجمة"],0,"التفكير هو نشاط ذهني داخلي غير مرئي يعالج به الدماغ المعلومات والمثيرات الحسية لاتخاذ قرار أو حل مشكلة."],[2,0,1,0,"جميع ما يلي من المواقف الرئيسية التي تثير التفكير البشري ما عدا:",["التخطيط للمستقبل","حل المشكلات الراهنة","تذكر الخبرات الماضية","انعدام المثيرات الحسية تماماً"],3,"يثار التفكير عند التخطيط للمستقبل، أو تذكر الماضي، أو تنظيم الأفكار، أو مواجهة مشكلة تحتاج لحل."],[2,0,1,0,"العنصر الذي يبدأ به الموقف التفكيري ويستقبل عبر الحواس الخمس هو:",["المثير","الاستجابة","التغذية الراجعة","التقييم النهائي"],0,"المثير (كصوت، صورة، مشكلة، أو سؤال) هو نقطة الانطلاق التي تستقبلها الحواس وتنقلها للدماغ."],[2,0,1,0,"الوعاء الرمزي الذي يعبر به الإنسان عن أفكاره وينقلها للآخرين هو:",["اللغة","الانفعال","الحدس","الوراثة"],0,"تُعد اللغة الأداة الرئيسية للتعبير عن الأفكار وتنظيمها والتواصل الفكري بين البشر."],[2,0,1,0,"من خصائص التفكير الإنساني أنه نشاط:",["هادف ومستمر ومرن","عشوائي ومتوقف أثناء اليقظة","مادي ملموس يمكن رؤيته بالعين","ثابت لا يتأثر بالخبرة أو التعلم"],0,"يتميز التفكير الإنساني بأنه هادف، مستمر، يعتمد على الخبرة السابقة، ويعبر عنه بشكل رمزي."],[2,0,1,0,"مفهوم 'العقلية' (Mindset) يشير إلى:",["مجموعة المعتقدات والاتجاهات التي تشكل نظرة الفرد لقدراته وتفسيره للأحداث","الوزن التشريحي للمخ البشري بالجرامات","عدد الخلايا العصبية في الحبل الشوكي فقط","سرعة النبضات القلبية أثناء التركيز"],0,"العقلية هي الإطار الفكري والمعتقدات الراسخة لدى الفرد حول ذكائه وقدراته وكيفية تعامله مع التحديات."],[2,0,1,0,"الشخص الذي يؤمن بأن ذكاءه ومهاراته يمكن تطويرها بالجهد والتعلم المستمر يمتلك:",["عقلية نامية (Growth Mindset)","عقلية ثابتة (Fixed Mindset)","عقلية جامدة غير قابلة للتكيف","عقلية اتكالية"],0,"العقلية النامية تقوم على الإيمان بأن القدرات البشرية قابلة للنمو والتطور من خلال التدريب والمثابرة."],[2,0,1,0,"أي من المهارات التالية تنتمي إلى مهارات التفكير الأساسية (الدنيا)؟",["الملاحظة والتصنيف والمقارنة","التفكير الابتكاري وإنتاج بدائل أصيلة","التفكير ما وراء المعرفي","التقويم النقدي المعقد"],0,"الملاحظة والمقارنة والتصنيف والتذكر من مهارات التفكير الأساسية التي تمهد لمهارات التفكير العليا."],[2,0,1,0,"العضو المادي المسؤول عن التحكم في العمليات الحيوية واستقبال الإشارات العصبية هو:",["الدماغ","العقلية","الوجدان","الضمير"],0,"الدماغ هو الكيان العضوي البيولوجي داخل الجمجمة، بينما العقل هو نتاج نشاط هذا الدماغ ووظائفه المعرفية."],[2,0,1,0,"من العوامل المؤثرة في تنمية التفكير لدى الفرد:",["البيئة التعليمية والثقافية والتدريب المستمر","الانعزال التام عن المجتمع","إهمال القراءة والبحث","الاكتفاء بحفظ المعلومات دون فهمها"],0,"تلعب البيئة المحفزة والتعليم التفاعلي والتدريب دوراً محورياً في تنمية مهارات التفكير."],[2,0,1,1,"طالب حصل على درجة منخفضة في اختبار الرياضيات فقال: 'أنا بطبيعتي فاشل في الأرقام ولن أتحسن أبداً'. هذا الموقف يعكس:",["العقلية الثابتة التي تفسر الفشل كدليل على نقص القدرة الدائم","العقلية النامية التي تحول الإخفاق إلى خطة تحسين","التفكير ما وراء المعرفي المتقدم","التفكير العلمي القائم على التجريب"],0,"أصحاب العقلية الثابتة يستسلمون عند أول إخفاق ويعتبرونه حكماً نهائياً على قدراتهم بدلاً من البحث عن استراتيجيات تعلم جديدة."],[2,0,1,1,"في المقارنة بين العقلية الثابتة والعقلية النامية، كيف يتعامل صاحب العقلية النامية مع النقد البناء؟",["يتقبله بمرونة ويستخدمه كمعلومات مفيدة لتطوير أدائه","يتجاهله تماماً ويعتبره هجوماً شخصياً","ينسحب من المهمة لتجنب أي تقييم مستقبلي","يلقي باللوم على الظروف المحيطة"],0,"صاحب العقلية النامية يرى النقد والتغذية الراجعة فرصة لاكتشاف نقاط التحسين وتطوير المهارات."],[2,0,1,1,"عندما يربط الطبيب بين ارتفاع درجة حرارة المريض ونتائج التحاليل المخبرية لتشخيص الحالة، فإن ذلك يوضح أن التفكير:",["يدرك العلاقات بين الظواهر ويعتمد على الخبرة السابقة","نشاط انفعالي يعتمد على التخمين العشوائي","عملية مادية منفصلة عن المعرفة العلمية","سلوك فطري لا يحتاج إلى تدريب"],0,"الطبيب يوظف معرفته العلمية السابقة لإدراك العلاقات السببية بين الأعراض والمرض."],[2,0,1,1,"أي من العبارات التالية تصف العلاقة الصحيحة بين التفكير الفعال والتفكير غير الفعال؟",["التفكير الفعال يوظف المنهجية والمعلومات الموثوقة، بينما غير الفعال يتأثر بالتحيز والانفعال","التفكير غير الفعال يعتمد على الأدلة المنطقية أكثر من التفكير الفعال","كلاهما يؤدي إلى نفس النتائج في حل المشكلات المعقدة","التفكير الفعال يتجنب البحث عن بدائل جديدة"],0,"التفكير الفعال يتسم بالموضوعية والدقة والبحث عن البدائل، عكس التفكير غير الفعال الذي تحكمه العاطفة والتسرع."],[2,0,1,1,"إذا واجه مدير شركة انخفاضاً في المبيعات فقام بجمع البيانات وتحليل آراء العملاء قبل اتخاذ قرار، فهذا يمثل عنصر:",["العمليات العقلية والمعالجة الذهنية للمعلومات","المثير الخارجي فقط","الاستجابة الانفعالية غير المدروسة","العقلية الثابتة"],0,"جمع البيانات وتحليلها وتفسيرها يمثل مرحلة العمليات العقلية التي تتوسط بين المثير (انخفاض المبيعات) والاستجابة (القرار)."],[2,0,1,1,"لماذا يُعد 'الخوف من ارتكاب الأخطاء' عائقاً رئيسياً أمام التفكير الابتكاري؟",["لأنه يدفع الفرد للالتزام بالطرق التقليدية المألوفة وتجنب التجريب","لأنه يزيد من سرعة معالجة المعلومات في الدماغ","لأنه يعزز الثقة بالنفس والمرونة الفكرية","لأنه يساعد على اكتشاف قوانين الطبيعة"],0,"الخوف من الخطأ يشل المبادرة ويجعل ا
